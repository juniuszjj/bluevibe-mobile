    var rr = arr[s].rot * Math.PI / 180, c2 = Math.abs(Math.cos(rr)), s2 = Math.abs(Math.sin(rr));
    var bh = arr[s].w * s2 + arr[s].h * c2;
    if (arr[s].cy + bh / 2 + 3 > ymax) ymax = arr[s].cy + bh / 2 + 3;
  }
  return {
    CW: CW, CH: CH, H: Math.ceil(ymax + CAROUSEL_PAD), slots: arr,
    clear: CAROUSEL_INS + CW,                  // 牌右缘正好压到画布左界的偏移（此刻已整张出画）
    exit: CAROUSEL_INS + CW + carOver(CW)      // 淡出窗口就在 [clear, exit] 这一段（画布外，看不见）
  };
}
/** 并排式几何：等距平移 dx = 牌宽 + 图间距（互不重叠）。图间距由面板的「图片间距」给 */
function carFilmGeom(o) {
  var CW = Math.round(CAROUSEL_VW * o.k);
  var CH = Math.round(CW / (o.ratio || 1));
  var gap = (o.gap == null ? CAROUSEL_INS : Math.max(0, +o.gap || 0));
  return {
    CW: CW, CH: CH, H: CH + 2 * CAROUSEL_PAD, slots: [],
    dx: CW + gap, clear: CAROUSEL_INS + CW, exit: CAROUSEL_INS + CW + carOver(CW)
  };
}
function carGeom(o) {
  return o.mode === "film" ? carFilmGeom(o)
    : (o.mode === "drop" ? carDropGeom(o) : carStackGeom(o));
}

/* ══ 折页落：几何 / 位置 / 投影 / 轨道 ══════════════════════════════════════ */

/** 方向夹取（面板给整数，但 state 里可能存过脏值 —— 一切都从这里过一遍） */
function carDropDir(d) {
  d = Math.round(+d);
  if (!isFinite(d)) d = CAR_DROP_DIR_DEF;
  return CAR_DROP_DIRS[Math.min(3, Math.max(0, d))];
}

/** 折页落几何：**画布就是牌本身** —— 牌铺满画布，四周不留白。
 *  CW = CAROUSEL_VW、H = CH，正片居中、旧图全程静止 —— 落定后新旧两张**逐像素重合**，
 *  而且四边正好压到画布边界上。
 *
 *  ⚠️ 走到这一步用户砍了两刀，**别往回退**：
 *    ① 2026-09-27「整个容器就按照图片大小来就行，不用扩展」→ 去掉旧图下沉 14px
 *       （在那之前的版本会按 sink 把画布加高、并把正片朝反方向退半个 sink，
 *        好让被盖住的旧图探出一条 14px；那条连同挂它上面的投影一并删了）。
 *    ② 同一天紧接着「一圈是还有留空是不，进入的方向还是有距离，就不要留空了，
 *       只是在图片大小的范围内滑动切换」→ 连"牌按 k=0.84 缩在画布里"那圈留白也删了。
 *
 *  ⚠️ `enter` = 沿轴的那条边长（牌长）= 画布在那一侧正好被牌占满，所以候场牌**贴着画布边外**
 *  等，推进量一个牌长就整张盖上来，"切换全程只在图的范围内"。别再加 `padAlong` / 容差：
 *  老版 `along + padAlong + 6` 多走的那段，就是用户看到的那截"进入方向的距离"。
 *  ⚠️ 宽度口径没变：SVG 的 width 仍是 CAROUSEL_VW，而这里的 CW 也等于 CAROUSEL_VW，
 *  所以 `viewBox="0 0 375 牌高"` 照旧成立 —— 只是图在正文里**铺满一列**了（不再是 0.84 宽）。
 *  别顺手把 CW 改回 `CAROUSEL_VW * k`：那圈留白会立刻回来。 */
function carDropGeom(o) {
  var CW = CAROUSEL_VW;
  var CH = Math.round(CW / (o.ratio || 1));
  var ax = carDropDir(o.dir);
  var along = (ax.axis === 0) ? CH : CW;      // 沿轴的那条边（= 画布在该轴的尺寸）
  return {
    CW: CW, CH: CH, H: CH, slots: [],
    axis: ax.axis, sign: ax.sign, enter: along, exit: along,
    // 正片静止时的中心（画布坐标）= 画布正中。
    cx: CW / 2,
    cy: CH / 2
  };
}

/** 沿轴位移 → "x y"。d 是「沿进入方向」的带符号距离：
 *  d < 0 = 还没进来（画外）、d = 0 = 正片位。**现在只用得到这两个值** —— 2026-09-27 去掉
 *  旧图下沉后，再没有 d > 0 的用法；符号约定留着，是因为"从哪一侧进场"仍然靠它表达。
 *  ⚠️ 轴上的真实坐标是 `sign * d`，sign 是"进入方向"。dir=1（从下往上）时正的 d 对应负的 y ——
 *  这个符号错一次，八个组合里有一半方向是反的，而且**看起来仍然在动**，只是方向不对，很难发现。 */
function carDropPos(g0, d) {
  var v = carNum(g0.sign * d);
  return g0.axis === 0 ? ("0 " + v) : (v + " 0");
}

/** 关键点整理：按时刻排序，**同一时刻取后加的那个**（这就是"台阶"的实现）。
 *  没有这一步，`[t,"1"],[t,"0"]` 这种同刻异值在 SMIL 里结果是未定义的。 */
function carKt(pairs) {
  pairs.sort(function (a, b) { return a[0] - b[0]; });
  var out = [], i;
  for (i = 0; i < pairs.length; i++) {
    if (out.length && pairs[i][0] - out[out.length - 1][0] < 1e-9) out[out.length - 1] = pairs[i];
    else out.push(pairs[i]);
  }
  return out;
}

/** 折页落的投影：新图**前缘**外侧 3 层等宽实色条，越远越淡（叠出软边，不用渐变）。
 *  参数：每层 6px 高、全宽、#0B1220，不透明度取 **CAR_DROP.shA（用户选定的淡版 10/6/2.5%）**。
 *  ⚠️ 这是本项目**唯一**产出 <rect> 的地方。2026-09-26「产物里一个 rect 都没有」那条是针对
 *  叠卡/并排的（每张牌的牌下都垫投影会叠成一条灰线）；折页落的投影只挂在**正在落下的那一张**
 *  上、随它一起走，压在被盖住的旧图上 —— 那是层次感的来源，不是脏。
 *  ⚠️ 「前缘离牌心多远」和「投影条横跨多宽」**两条都要按轴取**：纵向用牌高、横向用牌宽。
 *  2026-09-27 踩过：只写纵向那一套，四个方向里横着那两档的投影整整飘出牌外 59px。
 *  方向靠 `<g rotate>` 把"向下"的画法旋过去，省掉四套坐标公式。 */
function carDropShadow(o, g0) {
  var n = o.sh | 0;
  var A = o.shA || [];
  if (n <= 0 || !A.length) return "";
  var d0 = carDropDir(o.dir), axisX = d0.axis === 1;
  var halfAlong = (axisX ? g0.CW : g0.CH) / 2;   // 牌心 → 前缘
  var perp = axisX ? g0.CH : g0.CW;              // 投影条横跨的宽度
  var h6 = (o.shH == null ? 6 : o.shH);
  var rot = [0, 180, -90, 90][d0.id] || 0;
  var out = '<g transform="rotate(' + rot + ')">', i, a, y = halfAlong;
  for (i = 0; i < n; i++) {
    a = (A[i] == null) ? A[A.length - 1] : A[i];
    if (!(a > 0)) continue;
    out += '<rect x="' + carNum(-perp / 2) + '" y="' + carNum(y + i * h6)
      + '" width="' + carNum(perp) + '" height="' + carNum(h6)
      + '" fill="' + o.ink + '" opacity="' + carNum(a) + '"/>';
  }
  return out + "</g>";
}

/**
 * 投影的显形窗口：**只在"正在落下的那一张"下落期间**可见（band 1），起手淡入、落定前 25% 淡出。
 *
 *  ⚠️ 为什么非要有这条、而不是让投影跟着牌的显形窗口一直挂着：
 *  投影是挂在**牌前缘外侧**的。画布现在 = 牌本身（见 carDropGeom），落定后前缘**正落在画布边上**，
 *  18px 的投影条整条出画、被 viewBox 裁掉 —— 所以"静止时图下挂一条暗线"在几何上已经不可能了。
 *  但**不能只靠裁剪**：裁剪是硬切，而它真正压在被盖住那张图上的部分是"逐渐冲出去"的，
 *  靠裁剪收尾能看见投影突然没。所以这条淡出轨道仍然保留，让它在行程最后 25% 平滑归零
 *  （用户 2026-09-26 骂过的「每个图下好像有一条线」，就是它在兜底）。
 *
 *  ⚠️ **起手必须是"一小段行程内淡入"，不能写成台阶**（`[t0-S,"0"],[t0,"1"]`）：
 *  画布 = 牌之后，"候场"的含义变了 —— 牌停在画布**外一个牌长**处时，它的前缘**正好压在画布边界上**，
 *  挂在前缘外侧的投影于是有一截（最外层 6px，压暗 13%）**落在画布以内**。台阶写法会在 t0 那一刻
 *  把它从 0 直接跳到 1，画布进入侧边上就凭空冒出一条 6px 暗带。
 *  2026-09-27 用探针实测抓到（`tests/_probe-drop.js` + 逐行扫色，定格 t=0）：
 *  四个方向各自在对侧画布边上量到 `#65663c`（底图 `#6f6f3f`，压暗 13%）——
 *  带 +6px 容差的旧几何里这截正好在画布外，所以那时候台阶是对的，现在不对了。
 *  淡入用的 `CAR_SHADOW_IN`（8% 行程）：牌已经推进画布、影子跟着进来，浓度同步到满。
 *  ⚠️ 也不能等到"落定那一刻"才归零：那是一次瞬间消失，看得见。留 25% 的行程淡出，
 *  此时它已经跟着前缘冲出去大半张牌，淡掉察觉不到。
 *  ⚠️ 下落**结束后**（下落到下一张之前）投影 = 0；下带（被盖住的旧图）根本不挂投影，
 *  给它挂 = 旧图边缘拖出一道暗带，看起来像脏了。
 */
function carDropShadowTrack(i, N, g, trg, o, g0, band) {
  if (band !== 1) return null;
  var t0 = Math.min(1, Math.max(0, i * g));
  var t1 = Math.min(1, t0 + trg);
  var tF = Math.min(1, Math.max(t0, t0 + trg * 0.75));
  var tIn = Math.min(t1, t0 + Math.min(trg * 0.5, CAR_SHADOW_IN));
  return carKt([[0, "0"], [t0, "0"], [tIn, "1"], [tF, "1"], [t1, "0"], [1, "0"]]);
}

/** 折页落轨道（只有这一条 —— 「落法」参数删掉后，A1/A2/A3 的差别一并消失）。
 *  band 1 = 上带（从画外落下 + 落定后停留），band 0 = 下带（静止的旧图，等被下一张盖住）。
 *  ⚠️ 同一张牌在上/下带各有一份副本，交接发生在**同一位置（d=0、逐像素相同）**，所以两层的
 *  不透明度做硬台阶也看不出接缝 —— 这是"两张副本 + 层带"能成立的前提，改成渐变反而会露馅。
 *  ⚠️ 下带的 pos **是常量 P_AT**：旧图不下沉、不动（2026-09-27 去掉 sink）。保留这条
 *  animateTransform 只是为了两个 band 结构对称、渲染端少一个分支；别以为它还会移动。
 *  ⚠️ i = N-1 的下带窗口跨过整轮接缝（t1 = 1 会绕回 0），要提前放到 [0, trg] 里表达，
 *  否则那一张"被第一张盖住"的动作整轮都不会发生。 */
function carTracksDropCover(i, N, g, trg, E, o, g0, band) {
  var t0 = Math.min(1, Math.max(0, i * g)), t1 = Math.min(1, Math.max(0, (i + 1) * g));
  var P_IN = carDropPos(g0, -g0.enter), P_AT = carDropPos(g0, 0);
  // ⚠️ 显形/隐藏**必须写成"同刻异值"的台阶**（`[t-S,"0"],[t,"1"]`），不能只写 `[0,"0"],[t0,"1"]`：
  // 后者在 SMIL 里是**从 0 线性爬到 1**，于是那张牌在整个"还没轮到它"的时段里是半透明的，
  // 压在旧图上就成了重影 —— 实测定格一帧，旧图那侧是「橙 55% + 蓝 45%」的混色，
  // 而且 2/3/4 号牌各带 0.37/0.28/0.2 一层，全糊在一起（2026-09-27 用像素采样抓到）。
  // 台阶宽度用 CAR_STEP（2e-5，必须粗于 carNum 的 5 位小数精度）。
  // 台阶位置是安全的两处：显形那一刻牌还在画外、隐藏那一刻两张副本的位置逐像素相同。
  var S = CAR_STEP, step = function (t) { return Math.max(0, t - S); };
  if (band === 1) {
    return {
      pos: carKt([[0, P_IN], [t0, P_IN], [Math.min(1, t0 + trg), P_AT, E], [t1, P_AT], [1, P_AT]]),
      opa: carKt([[0, "0"], [step(t0), "0"], [t0, "1"],
        [step(t1), "1"], [t1, "0"], [1, "0"]])
    };
  }
  if ((i + 1) * g >= 1) {          // 最后一张：窗口绕回轮首
    var tz = Math.min(1, trg);
    return {
      pos: carKt([[0, P_AT], [1, P_AT]]),
      // 这一份从轮首就是显的（它负责盖住循环点），所以**不需要**爬坡修正，只有收尾的台阶。
      opa: carKt([[0, "1"], [step(tz), "1"], [tz, "0"], [1, "0"]])
    };
  }
  var ts = Math.min(1, (i + 1) * g + trg);
  return {
    pos: carKt([[0, P_AT], [1, P_AT]]),
    opa: carKt([[0, "0"], [step(t1), "0"], [t1, "1"],
      [step(ts), "1"], [ts, "0"], [1, "0"]])
  };
}

/** 一张牌在 N 个周期里经过的槽位：i, i-1, …, 0,（瞬移）N-1, N-2, …, i+1 */
function carSlotsFor(i, N) {
  var seq = [], c, s;
  for (c = 0; c < N; c++) {
    if (c <= i) s = i - c;
    else if (c === i + 1) s = N - 1;
    else s = N - 1 - (c - i - 1);
    seq.push(s);
  }
  return seq;
}

/**
 * 叠卡轨道：4 条（位移 / 旋转 / 缩放 / 不透明度×每层一条）。
 * `at(s) = SL[min(s, LVL-1)]` 就是「第 4 张起同位」；不透明度**全是台阶**。
 */
function carTracksStack(i, N, g, trg, E, o, g0) {
  var SL = g0.slots, LVL = o.lvl, lastS = LVL - 1, NB = LVL + 1;
  var seq = carSlotsFor(i, N), c, b;
  var pos = [], sca = [], rot = [], ops = [];
  for (b = 0; b < NB; b++) ops.push([]);
  var sw = Math.min(CAR_SW, 0.02 * trg);          // 瞬移段必须短于淡出余量，否则关键点会乱序
  function at(s) { return SL[Math.min(s, lastS)]; }
  for (c = 0; c < N; c++) {
    var s = seq[c], t0 = c * g, tH = t0 + g - trg, t1 = t0 + g;
    var a = at(s), d = at(s === 0 ? N - 1 : s - 1);
    var x0 = a.cx - SL[0].cx, y0 = a.cy - SL[0].cy;
    var x1 = d.cx - SL[0].cx, y1 = d.cy - SL[0].cy;
    pos.push([t0, carNum(x0) + " " + carNum(y0)]);
    sca.push([t0, carNum(a.sc)]);
    rot.push([t0, carNum(a.rot)]);
    if (s === 0) {
      // 正片：整张滑出左边 →（画外）瞬移回队尾。缩放与角度**在出画之后**才跳变，
      // 否则会看见「一边往外滑一边缩小转正」的怪动作。
      var tE = t1 - sw;
      pos.push([tH, carNum(x0) + " " + carNum(y0)]);
      pos.push([tE, carNum(-g0.exit) + " 0", E]);
      pos.push([t1, carNum(x1) + " " + carNum(y1)]);
      sca.push([tH, carNum(a.sc)]); sca.push([tE, carNum(a.sc)]); sca.push([t1, carNum(d.sc)]);
      rot.push([tH, carNum(a.rot)]); rot.push([tE, carNum(a.rot)]); rot.push([t1, carNum(d.rot)]);
    } else {
      pos.push([tH, carNum(x0) + " " + carNum(y0)]);
      pos.push([t1, carNum(x1) + " " + carNum(y1), E]);
      sca.push([tH, carNum(a.sc)]); sca.push([t1, carNum(d.sc), E]);
      rot.push([tH, carNum(a.rot)]); rot.push([t1, carNum(d.rot), E]);
    }
    // 不透明度：只有它本轮所属的那一层为 1，其余归 0。
    //
    // ⚠️ 正片那层（s === 0）必须在**整张出画之后、瞬移之前**就归 0 —— 这就是 2026-09-26
    //    用户报的「最前面的图切换出去后最后一下会极短暂的在框内闪一下」。
    //    旧写法是 `[t1-sw,"1"], [t1,"0"]`：淡出**跟瞬移段完全重叠**，于是瞬移扫过画布时
    //    不透明度还在 1→0 之间（中段约 0.5）—— 牌就当着读者的面从画布中间横穿过去。
    //    现在跟**并排式同一口径**：`[tH + CAR_FO*trg,"1"], [t1-sw,"0"]`，
    //    淡出发生在「已经出画、还没瞬移」的那一小段里（几何上用 CAR_OVER 留出这段余量），
    //    瞬移段全程 opacity = 0 → 看不见。**别再把这两条合并成一条。**
    var bd = (s <= LVL) ? (LVL - s) : -1;          // -1 = 比最后一槽还深 → 全程不显形
    for (b = 0; b < NB; b++) {
      if (b === bd && s === 0) {
        ops[b].push([t0, "1"], [tH + CAR_FO * trg, "1"], [t1 - sw, "0"], [t1, "0"]);
      } else if (b === bd) ops[b].push([t0, "1"], [t1, "1"]);
      else ops[b].push([t0, "0"], [t1, "0"]);
    }
  }
  return { pos: pos, sca: sca, rot: rot, ops: ops, seq: seq, NB: NB };
}

/** 并排轨道：一份副本就够（不重叠）。⚠️ dx / exit 在**几何对象**上，别从参数对象读（读到 undefined → NaN） */
function carTracksFilm(i, N, g, trg, E, o, g0) {
  var seq = carSlotsFor(i, N), pos = [], opa = [], sca = [], c;
  var sw = Math.min(CAR_SW, 0.02 * trg);
  var DX = g0.dx, EXIT = g0.exit;
  function X(s) { return s * DX; }
  for (c = 0; c < N; c++) {
    var s = seq[c], t0 = c * g, tH = t0 + g - trg, t1 = t0 + g;
    var sc0 = (s === 0 ? 1 : o.depth), sc1 = ((s - 1) === 0 ? 1 : o.depth);
    pos.push([t0, carNum(X(s)) + " 0"]);
    sca.push([t0, carNum(sc0)]);
    if (s === 0) {
      var tE = t1 - sw;
      pos.push([tH, carNum(X(s)) + " 0"]);
      pos.push([tE, carNum(-EXIT) + " 0", E]);
      pos.push([t1, carNum(X(N - 1)) + " 0"]);
      sca.push([tH, carNum(sc0)]); sca.push([tE, carNum(sc1), E]); sca.push([t1, carNum(sc1)]);
      opa = opa.concat([[t0, "1"], [tH + CAR_FO * trg, "1"], [t1 - sw, "0"], [t1, "0"]]);
    } else {
      pos.push([tH, carNum(X(s)) + " 0"]);
      pos.push([t1, carNum(X(s - 1)) + " 0", E]);
      sca.push([tH, carNum(sc0)]); sca.push([t1, carNum(sc1), E]);
      opa = opa.concat([[t0, "1"], [t1, "1"]]);
    }
  }
  return { pos: pos, sca: sca, opa: opa, seq: seq, rot: [[0, "0"], [1, "0"]], NB: 1 };
}

/* ══ 轮播图释（每张图一条，压在图片下沿） 2026-10-21 ══════════════════════════
 * 用户口径：「每张图可以加一个图释」「图释统一加在图片的下方」「半透明黑 + 白字」
 *           「单行 + 省略号 / 单行可以自适应字体大小吗」。
 *
 * 做法：在每张牌的 `<image>` 之后画「一条带圆角的遮罩 `<path>` + 一行 `<text>`」。
 * 为什么是压在图的下沿、而不是落到图下方：叠卡式三张牌是叠着的，落到图下方那条带是
 * 透明的 —— 文字会压在后一张牌的照片上，直接糊掉。压在图上三种样式才统一（用户已选）。
 *
 * ⚠️ 圆角：圆角是挂在 `<image>` 上的 CSS `clip-path:inset(0 round Npx)`（真裁剪、无 id），
 *    所以遮罩**不能用 clipPath 去裁**（微信删 id ⇒ clipPath 必失效，见上面 carCardArt 的说明）。
 *    这里直接把遮罩画成一个 `<path>`：**底边左右两角 = 与图相同的半径**（且不超过带高的一半），
 *    上边两角是直的（藏在图里看不见）。于是产物里既没有 id、也没有 filter / 渐变。
 *    万一微信把图上的 clip-path 剥了（图变直角、可接受的退化），遮罩仍是圆角 →
 *    底角会露两个极小的透明缺口；比"整条带变直角、把图的圆角盖掉"要好。
 *
 * ⚠️ 字号自适应（用户问的那条）：**逐条**自适应 —— 从 13 起按 0.5 递减，取这条
 *    「放得下」的第一档，下限 10。短图释保持 13、长图释缩到能放下为止；降到 10 还放
 *    不下才用「单行 + 省略号」截断（`motionTextWidth` 逐字量宽，⛔ 不能用 SVG 的
 *    `textLength`：官方结构校验会把它误报成行高重叠，见动效那边的旧账）。
 *    ⚠️ **遮罩带高是统一的**（按基准 13 算），只有字在带内变小 —— 于是同一块里
 *    每条图释的遮罩一样高、圆点导航只需按一个数上移，视觉上也不会"一张一条厚带"。
 * ═══════════════════════════════════════════════════════════════════════════ */
var CAR_CAP = {
  fs: 13,        // 基准字号（设计坐标：画布 375，随正文列宽等比缩放）
  fsMin: 10,     // 自适应下限：再小读者就认不动了，剩下交给省略号
  padX: 12,      // 遮罩左右内边距（也是文字距牌边的安全距）
  padY: 9,       // 遮罩上下内边距
  bg: "#000000", // 遮罩底色（半透明黑）
  bgA: 0.42,     // 遮罩不透明度：白字在任意照片上都 ≥ 4.5:1
  fg: "#FFFFFF",
  font: "PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif",
  max: 30        // 面板输入上限（字）
};

/** 一条图释的规范化：去空白、按上限截断、把换行压成空格（SVG 里一行就是一行）。 */
function carCapClean(v) {
  var s = String(v == null ? "" : v).replace(/[\r\n\t]+/g, " ").replace(/\s+/g, " ").trim();
  return s.slice(0, CAR_CAP.max);
}
/** 这一块里有没有图释（有一条非空就算）。 */
function carCapAny(caps) {
  for (var i = 0; i < (caps || []).length; i++) if (carCapClean(caps[i])) return true;
  return false;
}
/** 遮罩带高（设计坐标）。文字基线按它算，圆点导航也要按它上移。 */
function carCapBandH(fs) { return (fs || CAR_CAP.fs) + CAR_CAP.padY * 2; }
/** 一条图释能用的最大宽度（牌宽减左右内边距）。 */
function carCapMaxW(g0) { return Math.max(0, (g0 && g0.CW ? g0.CW : CAROUSEL_VW) - CAR_CAP.padX * 2); }
/**
 * 一条图释该用多大字号：从基准 13 起按 0.5 递减，取「这条放得下」的第一档；下限 10。
 * 逐条算（不是整块统一）—— 短句保持 13，长句缩到能放下为止；带高另算，见 CAR_CAP 的说明。
 */
function carCapFontSize(text, g0) {
  var s = carCapClean(text), maxW = carCapMaxW(g0);
  if (!s) return CAR_CAP.fs;
  for (var fs = CAR_CAP.fs; fs >= CAR_CAP.fsMin - 1e-6; fs -= 0.5) {
    if (motionTextWidth(s, fs) <= maxW) return Math.round(fs * 10) / 10;
  }
  return CAR_CAP.fsMin;
}
/** 单行 + 省略号：按逐字宽表量，放不下就截到放得下为止（放不下一颗字时返回空串）。 */
function carCapFit(text, fs, maxW) {
  var s = String(text || "");
  if (!s) return "";
  if (motionTextWidth(s, fs) <= maxW) return s;
  var chars = motionChars(s), ell = "\u2026", ellW = motionTextWidth(ell, fs), out = "";
  if (maxW < ellW) return "";
  for (var i = 0; i < chars.length; i++) {
    if (motionTextWidth(out + chars[i], fs) + ellW > maxW) break;
    out += chars[i];
  }
  return out ? out + ell : "";
}
/**
 * 一张牌的图释美术：遮罩 `<path>` + 一行 `<text>`。没有文字时返回 ""（产物与从前逐字节一致）。
 * @param {string} cap 文案
 * @param {object} o   牌参数（只用 o.rc）
 * @param {object} g0  几何（CW / CH）
 * @param {number} fs  整块共用的字号（见 carCapFontSize）
 */
function carCapArt(cap, o, g0) {
  var text = carCapClean(cap);
  if (!text) return "";
  var w = g0 && g0.CW, h = g0 && g0.CH;
  if (!(w > 0 && h > 0)) return "";
  // 字逐条自适应；**带高固定**按基准字号算（同一块里每条遮罩一样高，见 CAR_CAP 那段说明）
  var fs = carCapFontSize(text, g0);
  var bandH = Math.min(h, carCapBandH(CAR_CAP.fs));
  var shown = carCapFit(text, fs, carCapMaxW(g0));
  if (!shown) return "";
  var hw = w / 2, hh = h / 2;
  var top = hh - bandH, bot = hh;
  // 底角半径：跟着图的圆角，但不超过带高的一半（否则两段弧会打架）
  var r = Math.min(o && o.rc ? +o.rc : 0, bandH / 2, w / 2);
  var d;
  if (r > 0.01) {
    d = "M " + carNum(-hw) + " " + carNum(top)
      + " H " + carNum(hw)
      + " V " + carNum(bot - r)
      + " A " + carNum(r) + " " + carNum(r) + " 0 0 1 " + carNum(hw - r) + " " + carNum(bot)
      + " H " + carNum(-hw + r)
      + " A " + carNum(r) + " " + carNum(r) + " 0 0 1 " + carNum(-hw) + " " + carNum(bot - r)
      + " Z";
  } else {
    d = "M " + carNum(-hw) + " " + carNum(top)
      + " H " + carNum(hw) + " V " + carNum(bot) + " H " + carNum(-hw) + " Z";
  }
  // 基线：带内垂直居中。CJK 的视觉中心约在基线以上 0.35em（不是一个精确的字体度量，
  // 但对"一行小字压在图下沿"足够；要精确到字体就得读 metrics，微信里也拿不到）。
  var baseY = bot - bandH / 2 + fs * 0.35;
  return '<path d="' + d + '" fill="' + CAR_CAP.bg + '" fill-opacity="' + carNum(CAR_CAP.bgA) + '"/>'
    + '<text x="0" y="' + carNum(baseY) + '" text-anchor="middle" font-family="' + CAR_CAP.font
    + '" font-size="' + carNum(fs) + '" fill="' + CAR_CAP.fg + '">' + motionEsc(shown) + "</text>";
}

/**
 * 单张牌：以牌心为原点 → rotate / scale 都可绕心直接做。
 *
 * 圆角 = **真裁剪**（CSS `clip-path:inset(0 round Npx)`），不是「四角补底色」。
 *   ① 为什么不能用 `<clipPath>`：微信服务端会删 `id`，而 clipPath 元素必须 `url(#id)` → 必失效。
 *   ② 为什么不能补底色：补色是**涂上一层不透明色**。亮色 + 牌背后就是页面时看不出问题，
 *      但叠卡式里**正片右后方压着后一张牌** → 白角盖在人家的牌面上 = 用户看到的 4 个白点；
 *      读者开暗色时（微信算法不处理 SVG）那 4 个角也还是白的。
 *   ③ clip-path 不需要 id，角是真的透明：亮色露白页面、暗色露深页面、叠卡式里露后一张牌。
 *   ④ 万一微信把 `<image>` 上的 style 剥了：角变直角 —— 不变形、更不会出现白点，可接受。
 *   ⑤ 圆角设 0 时**连 clip-path 都不生成**（要绝对干净、或要核对老版效果时的退路）。
 * ⚠️ 不画投影底：牌下压一块 y 偏移的暗色圆角矩形，会在叠卡式里从每张牌下沿露出一条横线。
 */
function carCardArt(url, o, g0, cap) {
  var w = g0.CW, h = g0.CH, hw = w / 2, hh = h / 2, rc = o.rc || 0;
  if (!isFinite(w) || !isFinite(h) || w <= 0 || h <= 0) return "";
  var clip = rc > 0
    ? ' style="-webkit-clip-path:inset(0 round ' + carNum(rc) + "px);clip-path:inset(0 round "
      + carNum(rc) + 'px)"'
    : "";
  // 图释压在图的下沿（2026-10-21）：画在 <image> **之后** = 压在图上；
  // 没有图释时一个字都不多写（老产物逐字节不变）。
  return '<image x="' + carNum(-hw) + '" y="' + carNum(-hh) + '" width="' + carNum(w)
    + '" height="' + carNum(h) + '" preserveAspectRatio="xMidYMid slice" href="' + carUrl(url) + '"'
    + clip + "/>"
    + carCapArt(cap, o, g0);
}

/**
 * 牌数：补到 n 的整数倍且不小于「可见数 + 1」。
 *   ① 补成整数倍 → 每张图在同一周期里当正片的次数一样多（轮转顺序就是 1,2,…,n 循环，不跳号）；
 *   ② 不小于 LVL+1 → 最后一槽**身后永远还压着一张**，它才是切换时接管右侧那条缝的人。
 *      牌数正好等于可见张数时，槽 LVL-1 的牌一走，那个位置没人接，会扫过一条背景色。
 *   并排式不重叠、也不需要候场层，牌数就取 n。
 */
function carDeckSize(n, lvl, mode) {
  // 折页落与并排式一样**不补齐**：折页落整轮里每张图只落一次（不像叠卡式要"身后永远
  // 还压着一张"来接住那条缝），补齐反而会让同一张图连落两次。
  var need = (mode === "film" || mode === "drop") ? n : Math.max(n, lvl + 1);
  return Math.ceil(need / n) * n;
}

/**
 * 生成轮播 SVG。
 * @param {string} style  "stack" | "film" | "drop"
 * @param {string[]} urls 2~10 张图的地址（微信图床 https 地址）
 * @param {object} [opts] { gap, stay, tr, rc, ratio, lvl, card }
 *        gap/stay/tr/rc 就是弹窗里那四个滑杆（见 CAROUSEL_SLIDERS）；
 *        gap 按样式落到不同字段（叠卡式 = 每层错开的 dr，并排式 = 图间距）；
 *        card 是留给测试/设计稿对账的逐字段覆盖（优先级最高）。
 * @returns {string} SVG 源码（含 xmlns）；入参不合法时返回 ""
 */
function carouselSvg(style, urls, opts) {
  opts = opts || {};
  var mode = carouselNormalizeStyle(style);
  var list = (urls || []).filter(function (u) { return !!String(u || "").trim(); });
  if (list.length < CAROUSEL_MIN) return "";

  var o = {
    mode: mode, ratio: carouselRatioClamp(opts.ratio), rc: 0,
    lvl: (mode === "film" || mode === "drop") ? 1 : (opts.lvl || CAROUSEL_LVL),
    dur: opts.stay || CAROUSEL_STAY, tr: opts.tr || CAROUSEL_TR
  };
  var preset = (mode === "film") ? CAR_FILM : (mode === "drop" ? CAR_DROP : CAR_STACK);
  for (var k in preset) if (Object.prototype.hasOwnProperty.call(preset, k)) o[k] = preset[k];
  if (opts.rc != null) o.rc = Math.max(0, +opts.rc || 0);
  // 折页落只需要把方向传下去：投影层数/浓度都来自 CAR_DROP 预设（`sh` / `shA` / `shH` / `ink`）。
  if (mode === "drop") o.dir = opts.dir;
  // `gap` 是 2026-09-27 之前的旧键（那时水平/垂直还混在一起），保留兼容：
  // 老配置里只有 gap，读新键读不到就会静默回默认值。
  var gxIn = (opts.gapX != null) ? opts.gapX : opts.gap;
  if (gxIn != null) {
    var g0v = Math.max(0, +gxIn || 0);
    if (mode === "film") o.gap = g0v; else o.dr = g0v;
  }
  if (opts.gapY != null && mode === "stack") o.td = Math.max(0, +opts.gapY || 0);
  if (opts.card) for (var k2 in opts.card) if (Object.prototype.hasOwnProperty.call(opts.card, k2)) o[k2] = opts.card[k2];

  var n = list.length;
  var N = carDeckSize(n, o.lvl, mode);
  var T = o.dur, P = N * T, g = 1 / N;
  var trg = Math.min(0.42, g * 0.9, (o.tr / 1000) / P);
  var E = CAR_EASE;
  if (!(trg > 0)) trg = 0.02;
  var g0 = carGeom(o);
  /* 图释（2026-10-21）：按图序对齐、逐条规范化；**整块共用一个字号**（见 carCapFontSize）。
     opts.caps 缺省 / 全空 ⇒ 产物与从前逐字节一致（老块、老用例、老截图都不受影响）。 */
  var caps = [], ci;
  for (ci = 0; ci < n; ci++) caps.push(carCapClean((opts.caps || [])[ci]));
  var capBand = carCapAny(caps) ? carCapBandH(CAR_CAP.fs) : 0;
  var out = '<svg xmlns="http://www.w3.org/2000/svg" width="' + CAROUSEL_VW + '" height="' + g0.H
    + '" viewBox="0 0 ' + CAROUSEL_VW + " " + g0.H + '" role="img" aria-label="多图轮播：' + n + ' 张">';
  // ⚠️ 这里**不画整幅底色**：卡片外必须是正文背景（暗色下才不会出现一整条白带）。
  // 基准点是「正片槽位中心」：位移轨道给的都是相对它的偏移，所以基准取错 = 整叠平移错位。
  // 折页落的正片中心由 carDropGeom 给（画布高度/居中口径都在那边），别在这儿另算一份。
  var baseX = (mode === "drop") ? g0.cx : (CAROUSEL_INS + g0.CW / 2);
  var baseY = (mode === "drop") ? g0.cy
    : ((mode === "film") ? (CAROUSEL_PAD + g0.CH / 2) : g0.slots[0].cy);
  var i, b, NB;

  if (mode === "film") {
    for (i = 0; i < N; i++) {
      var tkf = carTracksFilm(i, N, g, trg, E, o, g0);
      out += '<g transform="translate(' + carNum(baseX) + " " + carNum(baseY) + ')">'
        + "<g>" + carAnimEl("transform", tkf.pos, P, 'type="translate"')
        + "<g>" + carAnimEl("transform", tkf.sca, P, 'type="scale"') + "<g>"
        + carAnimEl("opacity", tkf.opa, P) + carCardArt(list[i % n], o, g0, caps[i % n])
        + "</g></g></g></g>";
    }
    return out + "</svg>";
  }

  if (mode === "drop") {
    // 2 条层带。下带先画（低）、上带后画（高）——
    // "后来者在上"是这套 z 序的全部依据，别对调这两个循环。
    var dBands = [[], []];
    for (i = 0; i < N; i++) {
      for (b = 0; b < 2; b++) {
        var tkD = carTracksDropCover(i, N, g, trg, E, o, g0, b);
        // 投影只挂**上带**（正在落下的那一张），而且单独套一层显形组（见 carDropShadowTrack）。
        // 下带是"已被盖住的旧图"，给它也挂投影 = 旧图边缘拖出一道暗带，看起来像脏了。
        var artD = carCardArt(list[i], o, g0, caps[i]);
        var tkSh = carDropShadowTrack(i, N, g, trg, o, g0, b);
        if (tkSh) artD += "<g>" + carAnimEl("opacity", tkSh, P) + carDropShadow(o, g0) + "</g>";
        dBands[b].push('<g transform="translate(' + carNum(baseX) + " " + carNum(baseY) + ')">'
          + "<g>" + carAnimEl("transform", tkD.pos, P, 'type="translate"')
          + "<g>" + carAnimEl("opacity", tkD.opa, P) + artD
          + "</g></g></g>");
      }
    }
    for (b = 0; b < 2; b++) out += dBands[b].join("");

    // 底部圆点导航（仅折页落）：与正片同步的圆点，纯 SMIL 跟随、无需 JS。
    // ⚠️ 2026-09-28 用户拍板：**不加遮罩、也不加阴影**，就要干净的圆点。保留最终形态：
    //    圆点本体 <circle> + 两条 <animate>（opacity / fill，discrete）按正片窗口步进。
    //    演进史（改前先读）：整条压暗遮罩 → 每颗点垫半透明黑圆当阴影（太厚重）→ **全拿掉**。
    //    若日后觉得亮底图上白点不够清楚，可选手段：给点加描边、或垫一圈极淡黑圆；
    //    注意微信会删 id，`filter:drop-shadow` / `feDropShadow` 都要 url(#…) 用不了，
    //    任何「真阴影」都只能靠「叠 flat 形状」假造。
    if (opts.navDots !== false) {
      var dotAccent = normalizeHex(opts.accent || DEFAULT_ACCENT);
      // ⚠️ 有图释时圆点必须上移：图释遮罩就在画布下沿（高 capBand），圆点原位置 H-14
      //    正好落在遮罩上 —— 白点压在白字上，两样都看不清。
      var dotN = n, dotGap = 10, dotR = 3, dotY = g0.H - 14 - (capBand ? capBand + 4 : 0);
      var dotW = (dotN - 1) * dotGap;
      var dotX0 = g0.CW / 2 - dotW / 2;
      for (var di = 0; di < dotN; di++) {
        var dx = carNum(dotX0 + di * dotGap);
        var a0 = di * g, a1 = (di + 1) * g;
        var kt = [0], op = [di === 0 ? 1 : 0.5], fl = [di === 0 ? dotAccent : "#ffffff"];
        if (a0 > 0) { kt.push(carNum(a0)); op.push(1); fl.push(dotAccent); }
        if (a1 < 1) { kt.push(carNum(a1)); op.push(0.5); fl.push("#ffffff"); }
        // 末值补到 1：离散模式下「末值可以 < 1，最后一个值一直保持到周期结束」是规范允许的
        // （Chrome / WebKit 实测就是这么做，已用 setCurrentTime 逐帧验证过跟随正确）；
        // 补一个**等值**末帧语义完全不变，却能避开某些实现「keyTimes 末值必须是 1」的严格解读。
        if (Number(kt[kt.length - 1]) < 1) {
          kt.push(1); op.push(op[op.length - 1]); fl.push(fl[fl.length - 1]);
        }
        var opAnim = '<animate attributeName="opacity" calcMode="discrete" dur="' + carNum(P)
          + 's" repeatCount="indefinite" keyTimes="' + kt.join(";") + '" values="' + op.map(function (v) { return carNum(v); }).join(";") + '"/>';
        var fillAnim = '<animate attributeName="fill" calcMode="discrete" dur="' + carNum(P)
          + 's" repeatCount="indefinite" keyTimes="' + kt.join(";") + '" values="' + fl.join(";") + '"/>';
        out += '<circle cx="' + dx + '" cy="' + dotY + '" r="' + dotR + '" fill="#ffffff" opacity="0.5">'
          + opAnim + fillAnim + '</circle>';
      }
    }
    return out + "</svg>";
  }

  // 叠卡式：层 0（候场，最下）→ 层 LVL（正片，最上）**逐层**画完；
  // 同一时刻每层只有一张显形，所以层内顺序不影响谁压谁。
  NB = o.lvl + 1;
  var bands = [];
  for (b = 0; b < NB; b++) bands.push([]);
  for (i = 0; i < N; i++) {
    var tk = carTracksStack(i, N, g, trg, E, o, g0);
    var art = carCardArt(list[i % n], o, g0, caps[i % n]);
    for (b = 0; b < NB; b++) {
      bands[b].push('<g transform="translate(' + carNum(baseX) + " " + carNum(baseY) + ')">'

// ---------- 颜色工具：与效果稿同一套口径（WCAG 4.5:1） ----------
/**
 * 归一成 {r,g,b} —— 同时接受十六进制串与已经是 {r,g,b} 的**对象**。
 * ⚠️ 必须收对象：内部一路都在传对象（semContrast(c, bg)），而 hexToRgb 收到对象时
 *    会把 "[object Object]" 当色值解析、失败后返回 null ⇒ 被兜底成**黑色**。
 *    2026-10-12 这一段真踩过：压深判定拿「黑 vs 底」去算（必定 ≥ 4.5），于是
 *    semDeepen 一次性返回原色、五套主题色的文字全都不压深（红 3.59 / 橙 2.62…）。

function semDeepen(hex, bgHex, minRatio) {
  var c = semAsRgb(hex);
  if (semContrast(c, bgHex) >= minRatio) return normalizeHex(hex);
  for (var t = 0.02; t < 0.8; t += 0.02) {
    var d = { r: c.r * (1 - t), g: c.g * (1 - t), b: c.b * (1 - t) };

/**
 * 主题色**当底**用：返回 { bg, fg } —— 原色够深配白字、够亮配深字，
 * 两头都不够的（红 / 紫）把底压深一点再配白字。目标只有一个：五套主题色下都过 AA。
 */

var CARD_LABEL_ATTR = "data-bluevibe-card-label";
var CARD_BG_ATTR = "data-bluevibe-card-bg";
var CARD_FG_ATTR = "data-bluevibe-card-fg";

/**
 * 「清理格式」按钮的处置：**拆掉卡壳、正文原样留下**（段落数与行内样式一个字都不动）。

 *    里面本来就是用户的正文，**不重建**（重建会把行内加粗 / 链接 / 图片全冲掉）。

 * 「清理格式」按钮的处置：**拆容器、保内容** —— 每个 slot 落成一个普通段落，一句话都不丢。
 * （与布局块 clearLayoutToBlocks 一个思路；⛔ 不能留给 cleanFormat 的通用重建，
 *   那会把整个块塞进一个 <p>、出非法嵌套。）

  var nodes;
  try { nodes = root.querySelectorAll(SEM_BLOCK_SEL); } catch (e) { return; }

/** 把范围内所有图片地址（含懒加载属性）升级为 https。 */

/** 元素的「纯文本」：去掉空白（半角 / 全角 / &nbsp;）后剩下的内容。 */

/**
 * 「图片块」判定：块级元素里**只有图片、没有任何文字**。
 *   <p><span leaf><img></span></p>        ← 导入 / 清理后的常见形态
 *   <section nodeleaf><img></section>     ← 编辑器原生的块级图片容器

/**
 * ---------- 单张图片的装饰：圆角 / 边框 / 阴影（浮板「图片」那一行的三个按钮）----------
 *
 * 为什么要在图上记一个 `data-bluevibe-img` 属性，而不是「读样式反推当前档位」：
 *   ① 套主题那一步必须能认出「这张图是用户单独设过的」。`t.styles.img.borderRadius`
 *      来自面板的「图片圆角」滑杆（见 buildTheme 里 `opts.imgRadius`），而 mergeStyle 是
 *      **先 removeProperty 再 setProperty** —— 不豁免的话，用户给单张图设的圆角
 *      一「应用主题」就被滑杆值冲掉。光看样式值认不出来（可能恰好等于滑杆值）。
 *   ② 档位循环（点一次换下一档）要有个准数，解析 "2px solid rgb(200, 208, 222)"
 *      这种被浏览器规范化过的字符串很脆。

/** ⚠️ 历史遗留：第 48 / 49 轮把让位写进 width 时，在这里记原写法。新代码不再写它，
 *  只在「清除装饰」时读它，用来还原那时留下的 `calc(100% - Npx)`。 */

var IMG_DECOR_ORIGH_ATTR = "data-bluevibe-imgh";
/** 让位写在图片的**父容器** padding 上，标记也记在容器上（值 = 单侧让位量，如 "22"）。
 *  为什么记在容器而不是图片上：见 setImgDecor 里那一大段（图片自己的宽度属性守不住，微信会改）。 */

var IMG_DECOR_BORDER = ["", "1px solid #E6E9EF", "2px solid #C8D0DE"];

/**
 * 三组档位的**显示文案**（唯一一份）。
 * 浮板（blockbar 的 IMG_SUB_STEPS）与面板（content.js 的「图片样式」按钮组）都从这里取 ——
 * 抄第二份必然漂：改档位的人只改一张表，另一处就悄悄停在旧文案上。
 */

  if (kind === "b") return IMG_DECOR_BORDER;
  if (kind === "s") return IMG_DECOR_SHADOW;
  return [];

/**
 * **不是正文**的五类标记块 —— 唯一一份判据，两个消费方共用：
 *   ① 中文排版规范化（normalizeCjkInDom）：这些块的内容是用户自己填的或已排好版的，改了就越权；
 *   ② 面板那颗「套用到所有正文图」：只作用于正文单图，跳过的就是这五类。
 *   · 文首块 / 来源块 / 往期推荐 / 往期回顾：用户填的或已排好版的；
 *   · 布局块（并排 / 横滑 / 纵滚）：横向排版结构，位 padding 一挤就散（用户 2026-10-14 决定排除）。
 * ⚠️ 别再抄第二份选择器字符串：抄了必然漂（一处加了新块、另一处还在按老判据跳）。

var NON_BODY_SKIP_SEL = "[data-bluevibe-head],[data-bluevibe-source],[data-bluevibe-promo],"

/**
 * 面板那套「图片样式」→ { hasR, rPx, b, s }。
 *
 * ⚠️ 圆角是**任意 px**（`state.imgRadius` 语义不变，历史值可能是 18 这种非档位值 ——
 *    见方案 §6 第 3 条「显示『当前 18（自定义）』、不偷偷改」），边框 / 阴影才是**档位下标**。

    hasR: hasR,

/**
 * 同心推荐的图片圆角：**外层 − 内边距**（图片是内层，与背景那片相反）。
 * 口径见 docs/设计稿/图片样式-改版方案.md §6第2条。
 *
 * ⛔ 2026-10-14 用户撤销：「同心圆建议就不要了」—— 面板那条提示与它的用例一起删了，
 *    这个算式**没有任何调用方**。留着是为了口径留档（他当时确认过口径），要恢复那条提示

var IMG_DECOR_SHADOW_IN = [0, 10, 22];

/** 所有装饰档位组合可能写出的让位量（去重、升序、不含 0）。清除装饰的兜底判据要用。 */

/*
 * 这里曾有一个 `imgFluidWidth(el)` 判据，用来决定「要不要把让位写进 width」。2026-09-22 第三轮删掉，
 * 因为它先后写出的两种形态都被真机否掉了：
 *   ① 只看字符串写法（`%` / `calc` 算自适应）→ 真机上图片的内联宽度是**绝对像素**
 *      （微信往返一次会把 `width:100%` 规范化成 `width:578px`），满宽图被误判成窄图，让位整条被跳过；
 *   ② 补一层几何量测（渲染宽 ≈ 容器内容宽）→ **在真机运行环境里永远返回 false**：装饰是在**离屏克隆体**上

 *      克隆体没挂进文档，`getBoundingClientRect()` / `clientWidth` 一律是 0。

/**

  try {
    return !!(el.getAttribute
      && (el.getAttribute(IMG_DECOR_ATTR) || el.getAttribute("data-wxmd-img")));
  } catch (e) { return false; }
}

/**
 * 颜色 → 统一的 `rgb(r, g, b)` 键（认不出就原样返回小写）。
 * ⚠️ 为什么不能直接比字符串：我们表里写的是 `#E6E9EF`，而浏览器从行内样式读回来的是
 *    `rgb(230, 233, 239)` —— 同一个颜色、两种写法。**测试当场抓到过这个**（边框认不出来，

/** 边框档位：按 **宽度 + 线型 + 颜色** 三项比 —— 简写会被展开成 border-*-width/style/color。 */

/** 阴影的规范化键：去空白、颜色里的空格去掉、alpha 数值化（.18 / 0.18 / 0.180 视为同一个）。 */

/**

      if (!out.b && (mm = /b(\d+)/.exec(raw)) && +mm[1] < IMG_DECOR_BORDER.length) out.b = +mm[1];

/**
 * 把全篇图片样式刷到 root 里的所有图上，返回改了几张。

 * @param opt.bodyOnly true = 跳过五类非正文块（NON_BODY_SKIP_SEL）。**面板那三项永远传它** ——

 *                     各有自己的用途（用户 2026-10-14 拍板：「套用到所有图把文首图也改了」）。
 * @param opt.force    true = 连**老文章里"浮板单独设过"的图**也一起统一（先把那张的单图装饰

 *                     浮板的单图装饰入口已经撤掉，留着旧覆盖就等于"改面板改不动那一张"

      keepB = perImageBorderOf(im);

/** 往上找最近的「图片块」（图片常被 <span leaf> 包一层，所以要越过行内包装）。 */

    n = n.parentElement;
  }
  return null;

 *

 * 带 `!important` 的声明、还会把 `width` 规范化回去，**图片自己的宽度属性和它争不过**。
 *

 *   · 我们自己生成的多图布局（`data-bluevibe-layout`）—— 那是横向排版结构，不是「一张图的容器」；
 *   · 编辑器根（`data-bluevibe-root`）—— 给它加 padding 会波及整篇。

        // 混进来 —— 给它加 padding 会把整篇挤窄。宁可找不到宿主（不让位），也不能误伤别人的排版。

/**

 * 属性剥掉（第 49 轮实测图片上的 `data-bluevibe-imgw` 一个都不剩），那时得靠数值特征兜底：
 * 左右相等、且正好是我们某个装饰档位会写出的让位量。
 * 下界取 10px：1~2px 的左右对称 padding 在别人的稿子里太常见，认它反而更容易误伤。

function imgDecorPadIsOurs(host) {
  try {
    var pl = parseFloat(host.style.getPropertyValue("padding-left")) || 0;
    var pr = parseFloat(host.style.getPropertyValue("padding-right")) || 0;
    if (!(pl >= 10) || Math.abs(pl - pr) > 0.5) return false;
    var vals = imgDecorInsetValues();
    for (var i = 0; i < vals.length; i++) if (Math.abs(pl - vals[i]) < 0.5) return true;

/**
 * 数值兜底（**全篇路径**的让位）：左 = 单侧让位 − 边框宽、右 = 单侧让位 + 边框宽
 *（为什么不对称见 syncImgDecorPad）。标记被编辑器吃掉时按这个特征反推：
 *   半差 = 边框宽（必须是档位表里的某一档）、均值 = 单侧让位（必须是某个「边框+阴影」组合）。
 * ⚠️ 别再退回"左右相等"那条判据 —— 全篇路径的 26/22 那种写法它认不出来，
 *    结果是「边框改回无」清了标记却留下 padding（图片被永久挤窄）。
 */
function imgGlobalPadIsOurs(host) {
  try {
    var pl = parseFloat(host.style.getPropertyValue("padding-left")) || 0;
    var pr = parseFloat(host.style.getPropertyValue("padding-right")) || 0;

    var bw = (pr - pl) / 2;
    var inset = (pr + pl) / 2;

    for (var j = 0; j < vals.length; j++) if (Math.abs(inset - vals[j]) < 0.5) return true;

}

/**
 * 清掉「图片块」里编辑器留下的占位产物。只处理与图片同块、且**图片之后没有文字**的产物 ——
 * 有意留空的空段落（整块只有一个 trailingBreak 的换行）不动，否则会把用户用来分段的空行删掉。
 */

  if (!root || !root.querySelectorAll) return;
  var boxes = root.querySelectorAll("p,section,div,h1,h2,h3,h4,h5,h6,li,blockquote");
  for (var i = 0; i < boxes.length; i++) {
    var box = boxes[i];
    if (!box.querySelector("img")) continue;
    var noText = !plainTextOf(box);
    var lastImg = null, imgs = box.querySelectorAll("img");
    for (var k = 0; k < imgs.length; k++) {

    for (var j = arts.length - 1; j >= 0; j--) {
      var a = arts[j];

    // （「图片下面多一个空行」的另一种形态，2026-09-21）。有文字的块一律不动 ——
    // 那里面的 `<br>` 可能是用户自己要的换行。
    if (noText) {

      for (var b = brs.length - 1; b >= 0; b--) {

/**
 * 布局容器（多图并排 / 横向滑动 / 纵向滚动）识别。
 *
 * 这三种布局靠**结构性样式**成立（display:flex / gap / overflow-x|y / max-height），
 * 一旦被「套主题重排」「剥格式」「提取稳定源」抹掉 style，布局就等于被取消了
 * —— 用户改背景色、改图片圆角都会触发重排，布局随即消失。

  //   · 第三方横滑容器是 overflow-x + display:flex + white-space:nowrap
  //   · 第三方轮播容器带 overflow-y:auto

  const st = el.getAttribute("style") || "";

function isProtectedWidget(el) {

  var st = "";
  try { st = String(el.getAttribute("style") || ""); } catch (e) {}

  // 不能因为带 overflow-x 就被当成受保护组件跳过，否则改主题色时代码块背景/边框无法更新。
  if (!isCodeBlock(el) && /overflow-x\s*:\s*(scroll|auto)/i.test(st)) return true;
  var imgCount = 0;
  try { imgCount = el.querySelectorAll ? el.querySelectorAll("img").length : 0; } catch (e) {}
  if (imgCount >= 2) {
    if (/overflow\s*:\s*(scroll|auto)/i.test(st)) return true;
    if (/display\s*:\s*(-webkit-)?(inline-)?flex/i.test(st)) return true;
    if (/white-space\s*:\s*nowrap/i.test(st)) return true;
  }

}

// 颜色相关属性（用于「只换颜色」模式：字号/行距/对齐/间距一律不动）
// 注意 border* 也带颜色（如 H3 的左侧竖线 border-left、表格/代码块的边框），

//
// 需求原话：「能判断出那种每段文字很少，结尾没有标点符号，居中排列的段落，超过三行及以上的，
//   可以保留他的居中效果，然后段落前后间距都改成上下8px吗？」

var KEEP_CENTER_MAX_CHARS = 20; // 每段字数上限（去掉空白后）。上一档就是「一行短句」
// 连续段数下限。
// ⚠️ 2026-09-27 由 3 改成 2 —— 用户把成稿贴回来核对时问「降到两段怕把有些两段的标题也算进去不？
//    因为正常标题最多两段很少有三段」。这句顾虑是对的，所以不是「裸降」：同时加了下面那条

//    「不少网友看到这里 / 心里咯噔一下」这种**两行组**是保留居中的；实测真稿 45 → 47 段，只多这两行。
var KEEP_CENTER_MIN_RUN = 2;
var KEEP_CENTER_GAP = "8px";    // 组内段距；相邻段 margin 会折叠 → 组内净间距就是 8px

//
// 原判据：段落末尾出现 `。，！？…` 等任一字符就算「有标点」，整段不算短句。
// 触发修订的是用户自己的问话：「居中短句组有标点这个也放开是不是也还好？」
//
// 放开前先量过真稿（tests/probes/probe-center-punct.js 的量化，结果已锁进 test-keep-center-real.js）：
//   收紧 47 段 → 放开 52 段，**没有一段从「保住」变成「丢掉」**，多出来的 5 段是

// 但实际稿件里居中短句流中间常夹着带标点的行（「是不是一碰就会被感染？」），
// 一条判据就把整串切碎，反而漏掉作者真正的意图。真正在挡「普通正文」的是

  if (!el || !el.style || !el.style.removeProperty) return;
  gradStyleProps().forEach(function (p) {
    try { el.style.removeProperty(p); } catch (e) {}
  });
}

/** 某个标题元素该带哪一级的 first/mid/last 角色（新名优先，兼容旧名）。 */
function headPartOf(node) {
  if (!node || !node.getAttribute) return null;
  var p = null;
  try { p = node.getAttribute(HEAD_PART_ATTR); } catch (e) { p = null; }
  return (p === "first" || p === "mid" || p === "last") ? p : null;
}

/**
 * 标题（一级 / 二级）该用哪一条样式。
 * 差别只在两处：① 取表里的哪一档（h1 / h2）；② 相邻多段时要按 first/mid/last 收间距与边框。
 */
function headStyleFor(node, t, level) {
  const base = (level === "h2" ? t.styles.h2 : t.styles.h1) || {};
  const part = headPartOf(node);
  return part ? headPartStyle(base, part) : base;
}

/** 主题当前的标题变体名（新名优先；兼容合并前存下、只有 h1Variant 的旧配置）。 */
function themeTitleVariant(theme) {
  return (theme && (theme.titleVariant || theme.h1Variant)) || "";
}

/** 二级标题的变体名；空串 = 跟随一级（2026-10-27 起两级可各选一套）。 */
function themeTitleVariantH2(theme) {
  return (theme && theme.titleVariantH2) || "";
}

/** 当前标题变体要不要内层色块 span（老 themes.js 没有 titleNeedsInner 时退回 h1NeedsInner）。 */
function themeNeedsHeadInner(theme) {
  const v = themeTitleVariant(theme);
  if (typeof titleNeedsInner === "function") return titleNeedsInner(v);
  if (typeof h1NeedsInner === "function") return h1NeedsInner(v);
  return true;
}

/** 二级标题要不要内层色块 span：有独立变体就按它算，否则跟一级。 */
function themeNeedsHeadInnerH2(theme) {
  const v2 = themeTitleVariantH2(theme);
  if (!v2) return themeNeedsHeadInner(theme);
  if (typeof titleNeedsInner === "function") return titleNeedsInner(v2);
  if (typeof h1NeedsInner === "function") return h1NeedsInner(v2);
  return true;
}

/* ---------- 标题**内部**的行内元素：颜色一律继承标题本身 ----------
   为什么需要这一段（2026-09-26 修的用户反馈「设置好 H1、一切主题色，前面的标题文字
   全变黑，最后那个 H2 不变」）：

   默认变体「色块刊头」的观感是**白字压主题色块**（h1/h2.color = {white}，
   span.color = {white}），而 `styles.strong.color` 是**正文墨色**（#242A26，看起来
   就是黑的）。正文里出现 <strong> 是再正常不过的事，可它一旦落在标题**里面**
   （作者自己加粗过、或从 Markdown「# **标题**」进来），styleForNode 就会把墨色写到
   它头上 —— mergeStyle 是「先删再写」，内层 span 上那层白字当场被盖掉，整条标题变黑。
   用户那篇里两个 H1 的文字被 <strong> 包着、最后那个 H2 没有 → 只有 H1 变黑，完全对上。

   规则：**标题是一整块样式，块内文字只有标题自己的那一个颜色。**
   · 想在一句话里做强调 → 用「加粗 + 高亮」（data-bluevibe-accent，跟随主题色）
     或荧光标记（data-bluevibe-mark，色块垫字底），这两个标记的样式在下面提前返回、不受影响；
   · 其余行内元素（strong / b / em / i / a / del / s）的颜色一律换成标题自己的颜色。

   顺带是**自愈**的：旧版本已经把墨色写进 strong 里了，重套主题 / 换主题色时会在这里
   用正确的颜色覆盖回去（写值而不是删值 —— mergeStyle 只删不写会留下旧的墨色），
   用户不需要先「清理格式」。
   ------------------------------------------------------------------ */

/** 标题块判定：一级 / 二级（含将来用 role 承载变体名的 h1:boxed 这类写法），外加真实标题标签。 */
var HEAD_HOST_SEL = "h1,h2,h3,h4,h5,h6,"
  + '[data-bluevibe-role="h1"],[data-bluevibe-role="h2"],[data-bluevibe-role="h3"],[data-bluevibe-role="h4"],'
  + '[data-bluevibe-role^="h1:"],[data-bluevibe-role^="h2:"]';

/** 该节点所在的标题块；节点自己就是标题块时返回 null（标题自身的样式另走 headStyleFor）。 */
function headHostOf(node) {
  if (!node || !node.closest) return null;
  var host = null;
  try { host = node.closest(HEAD_HOST_SEL); } catch (e) { host = null; }
  return host && host !== node ? host : null;
}

/**
 * 标题块**实际的文字颜色**：优先内层色块 span（色块刊头把色块与白字都写在内层），
 * 其次外层块自身的 color，最后回落到主题表里该级标题的 color。
 *
 * 顺序很重要：applyStylesRecursive 按文档序（父 → 子）处理，走到标题内部的 strong 时，
 * 外层块与内层 span 都已经写好了本轮的新颜色，所以这里读到的永远是**当前主题**的颜色 ——
 * 换主题色时标题里的加粗也跟着一起换，不会停在上一轮的旧色上。
 */
function headTextColor(host, t) {
  var inner = null;
  try { inner = host.querySelector("[" + HEAD_INNER_ATTR + "]"); } catch (e) { inner = null; }
  var c = "";
  try {
    if (inner) c = inner.style.getPropertyValue("color") || "";
    if (!c) c = host.style.getPropertyValue("color") || "";
  } catch (e) { c = ""; }
  if (c) return c;
  var role = "";
  try { role = host.getAttribute("data-bluevibe-role") || ""; } catch (e) { role = ""; }
  var lvl = /^h2/.test(role) ? "h2" : (/^h3/.test(role) ? "h3" : (/^h4/.test(role) ? "h4" : "h1"));
  var st = (t && t.styles && (t.styles[lvl] || t.styles.h1)) || {};
  return st.color || null;
}

/** 行内元素在标题里的样式 = 主题那条样式（字重 / 字体风格 / 删除线照旧），只把颜色换成标题自己的。 */
function headInlineStyle(base, host, t) {
  var out = Object.assign({}, base || {});
  var c = headTextColor(host, t);
  if (c) out.color = c; else delete out.color; // 取不到颜色时宁可不写，让它自然继承
  return out;
}

function styleForNode(node, t) {
  if (isProtectedWidget(node)) return null;
  // 段落卡（2026-10-14）：**卡容器写自己的容器样式**，卡内段落照旧走下面的正文分支
  //（这正是「卡片只是一层壳」的落点：底 / 圆角 / 阴影 / 内边距由卡管，字号与段距由正文管）。
  // ⚠️ 必须排在下面「图片块 / 角色」这些分支**之前** —— 卡容器是 <section>，
  //    落到下面那些分支会拿不到样式（旧版本实测是「卡一贴出来就没有底」）。
  if (typeof isCardBlock === "function" && isCardBlock(node)) {
    return cardContainerStyle(t, cardVariantOf(node), cardOverridesOf(node));
  }
  // 卡里那枚小标签：外层壳只占一行，内层胶囊才是那枚「主题色小标签」。
  // ⚠️ 它虽然长在卡里，却**不是**正文段落（正文字号不许套到它身上），所以在这里单独给样式。
  if (typeof cardLabelRowOf === "function") {
    var lrow = cardLabelRowOf(node);
    if (lrow) {
      if (lrow === node) return cardLabelRowStyle();
      try {
        if (node.parentNode === lrow) {
          var lcard = cardRootOf(lrow);
          return cardLabelPillStyle(t, lcard ? cardBgOf(lcard, t) : SEM_NEUTRAL);
        }
      } catch (e) {}
    }
  }
  // 一级标题的「色块」内层：display:inline-block 只能放在内层 span 上，
  // 外层 p 必须是块级，否则编辑器会把两段 H1 并进同一行。
  // 内层色块 span。t.styles.h1Inner 为 null / undefined（当前变体不需要内层 span）时
  // 返回空对象 —— 不能返回 null，那会让上层认为「这个节点没有样式」而跳过（虽然此时
  // span 已被 wrapHeadInner 卸掉，这里只是兜底）。
  if (node.getAttribute && node.getAttribute("data-bluevibe-h1-inner")) {
    // 二级标题可能用了另一套变体（2026-10-27）→ 内层色块样式优先取 h2Inner；
    // 老主题对象 / 只带 h1Inner 的调用方自动回退（否则 color-only 重排会保留旧底色）。
    // ⚠️ 级别判断**就地写正则**、不调 headLevelOf：有些用例是按函数名切片载入的
    //    （tests/test-grad-text.js 的 FN 白名单），跨函数引用会让那条用例直接崩。
    var _hp = node.parentElement;
    var _hrole = (_hp && _hp.getAttribute)
      ? String(_hp.getAttribute("data-bluevibe-role") || _hp.getAttribute("data-wxmd-role") || "") : "";
    var _isH2 = /^h2/i.test(_hrole);
    // 二级有独立变体时**只认 h2Inner**：那一套不需要内层色块时它就是空，
    // 回退 h1Inner 会把一级的色块样式硬套到二级上（2026-10-27 一起修）。
    var _si = _isH2
      ? ((t.titleVariantH2 ? t.styles.h2Inner : (t.styles.h2Inner || t.styles.h1Inner)))
      : t.styles.h1Inner;
    return _si || {};
  }
  // 标题的**前导图形**（井号前缀）：它也是一个裸 <span>，没有角色标记，
  // 落到下面 switch 的 default 会返回 null → mergeStyle 直接 return →
  // **样式一个字都写不上**，正文里那颗「◆」/「1」会是裸字符（无主题色 / 无字号 / 无尺寸）。
  // 2026-09-24 实测发现：span 建出来了、文字也写进去了，但 style 属性是 null。
  // 返回 {} 兜底而不是 null —— 老主题表没有 headMark 时，标记仍应保留它自己的行内样式。
  if (node.getAttribute && node.getAttribute("data-bluevibe-head-mark")) {
    // 前导图形也要**按级别**取样式（2026-10-27）：二级有自己的变体时只认 h2 那份，
    // 否则「H1 色块刊头 + H2 编号实心块」里那颗编号会是**裸字符**（没有实心底色 / 圆角 / 字号）。
    var _mp = node.parentElement;
    var _mrole = (_mp && _mp.getAttribute)
      ? String(_mp.getAttribute("data-bluevibe-role") || _mp.getAttribute("data-wxmd-role") || "") : "";
    if (/^h2/i.test(_mrole)) {
      return (t.titleVariantH2 ? t.styles.headMarkH2 : (t.styles.headMarkH2 || t.styles.headMark)) || {};
    }
    return t.styles.headMark || {};
  }
  // 列表项的文字：li 自身的 color 是主题色（只用来染前面的三角/序号），
  // 文字必须单独包一层 span 用 liText，否则列表文字永远是主题色，
  // 改「正文文字色」时列表不会跟着变。
  if (node.getAttribute && node.getAttribute("data-bluevibe-li-text")) return t.styles.liText;
  // 列表的符号 / 序号：字号、颜色、挂角盒子都来自当前列表变体。
  // 有序列表用 olMarker、无序用 listMarker（同一个标记属性，两套样式）。
  // ⚠️ 必须**向上找最近的 ul/ol** 才能判断：符号 / 序号只是「一行文字」里的一段，
  // 直接父级是 li 或内层 p（见 wrapListMarkers 的 markerHostOf），永远不是 ul/ol。
  // 早先只看直接父级 → 有序序号一直拿的是无序符号那一套（盒子 17px、居中），
  // 中文「一、」会被挤在 17px 里、右对齐也丢了（2026-09-24 修）。
  // 返回 {} 兜底而不是 null —— 老主题表没有这两条时，标记仍应保留它自己的行内样式。
  // ⚠️ isMarkerLike 是结构兜底：整篇写回后编辑器重建 DOM，标记属性未必还在，
  //    但「li 的第一个 span」认得出符号 —— 少了它，恢复默认时 `base` 取不到主题色，
  //    符号色就清不掉（2026-10-05 用户真机报的那条）。
  if (node.getAttribute && (node.getAttribute(LIST_MARKER_ATTR) || isMarkerLike(node))) {
    var listEl = null;
    try { listEl = node.closest("ul,ol"); } catch (e) { listEl = null; }
    var ordered = !!listEl && String(listEl.tagName || "").toLowerCase() === "ol";
    return (ordered ? (t.styles.olMarker || t.styles.listMarker) : t.styles.listMarker) || {};
  }
  // 角色标记优先：浮板「不换标签、只注入样式」时，用 data-bluevibe-role 记录用户意图。
  // 正文无此标记；标题/引用/代码块等靠它让「换主题后仍能套上对应样式」——
  // 否则元素还是 p/section，引擎会把它当成正文打回正文样式。
  const role = node.getAttribute && node.getAttribute("data-bluevibe-role");
  const tag = role || node.tagName.toLowerCase();
  // 图片块（只装图、无文字）：上下 40px 留白统一放在**块**上。
  // 块与块是相邻兄弟，margin 会折叠 —— 连续两张图之间正好 40px，不会叠成 80px；
  // 图片自己那一层则归零（见下面 img 分支）。用户在浮板上显式指定过角色的块不参与。
  if (!role && enclosingImageBox(node) === node) return { margin: "40px 0" };
  switch (tag) {
    // 一级 / 二级标题：同一张变体表的两档（t.styles.h1 / h2 结构同构、字号不同），
    // 都走 headStyleFor —— 相邻多段时按 first/mid/last 收间距与边框（见 headPartStyle）。
    case "h1": return headStyleFor(node, t, "h1");
    case "h2": return headStyleFor(node, t, "h2");
    case "h3": return t.styles.h3;
    case "h4": return t.styles.h4;
    case "h5":
    case "h6": return t.styles.h4;
    case "p": {
      const parent = node.parentElement && node.parentElement.tagName.toLowerCase();
      if (parent === "li") return keepCenterStyle(node, t.styles.pInLi);
      if (parent === "blockquote") return keepCenterStyle(node, t.styles.pInBlockquote);
      return keepCenterStyle(node, t.styles.p);
    }
    case "strong":
    case "b": {
      // 「加粗 + 高亮」标记过的 strong：颜色跟随当前主题主色。
      // 主题里 strong 默认是黑色，若不做区分，重排时会被覆盖成黑色，
      // 于是切换主题 / 改自定义色后高亮色既不更新、还会变黑。
      if (node.getAttribute && node.getAttribute("data-bluevibe-accent")) {
        // 主色走 themeAccentInk（= 主题色**当字色**用的那一版）——
        // ⚠️ 淡色主题色必须压深，否则「加粗高亮」在纸白上根本看不见（2026-09-30 淡色主题色，用户点名要的）。
        //    铺底色那种用法才用原色（比如下面荧光标记的底），两者别混。
        // 曾经这里从 styles.h2.color 取，合并二级标题后 h2 默认变白字，强调色于是成了 #FFFFFF（2026-09-24 修）。
        return Object.assign({}, t.styles.strong, { fontWeight: "700", color: themeAccentInk(t) });
      }
      if (node.getAttribute && node.getAttribute("data-bluevibe-mark")) {
        // 荧光标记：加粗 + 文字中下方的底色块（上 60% 透明，视觉是「色块垫在字底」）。
        //
        // 底色用「主题主色的低透明度」而不是不透明浅色块：Dark Mode 下微信会把正文
        // 文字反白，若底块是不透明浅色（比如引用块的 #e6eeff），就成了白字压浅底、
        // 对比度不足看不清。半透明会随背景一起变暗，白字依然清晰。
        // 而在白底上 rgba(主色,.1) 呈现约 #e8efff，与引用块底色 #e6eeff 几乎一致。
        //
        // 用 background-image 而非 background：不覆盖底色，各环境支持也更稳。
        // 渐变会触发规范 4.1.2 的提示，豁免由 ensureMarkExempt 补 data-ignore-dm。
        // 同上：荧光底的色也来自 themeMainColor（从 h2 取会取到白色，底就白了）。
        // ⚠️ 这里**故意用原色、不压深**（2026-09-30 淡色主题色特意确认过）：荧光标记是一个**底色**，
        //    跟「引用块浅底 / 色块刊头」同一族 —— 主题色淡，垫在字底的荧光笔痕就该是淡的；
        //    字本身走 styles.strong（正文墨色），压上去照样清楚。把底色也压深反而会
        //    让这块「荧光」看起来像一块水泥补丁，与主题色脱钩。
        var markMain = (typeof themeMainColor === "function") ? themeMainColor(t)
          : ((t && t.accent) || "#0052FF");
        return Object.assign({}, t.styles.strong, {
          fontWeight: "700",
          backgroundImage: "linear-gradient(to top," + markFill(markMain) + " 40%,transparent 40%)",
        });
      }
      // 标题**内部**的加粗：换成标题自己的颜色，不能套正文墨色（否则白字标题变黑）。
      // 上面两个带标记的分支（加粗+高亮 / 荧光标记）是用户显式指定的强调，保持原样。
      var headHost = headHostOf(node);
      if (headHost) return headInlineStyle(t.styles.strong, headHost, t);
      return t.styles.strong;
    }
    case "em":
    case "i": {
      var emHost = headHostOf(node);
      return emHost ? headInlineStyle(t.styles.em, emHost, t) : t.styles.em;
    }
    case "a": {
      // 链接色是主题主色；落在色块刊头里就是「主题色字压主题色块」等于看不见，同样继承标题色。
      var aHost = headHostOf(node);
      return aHost ? headInlineStyle(t.styles.a, aHost, t) : t.styles.a;
    }
    case "blockquote": {
      // 多段合并引用是一组首/中/末无缝拼接的块（拆法见 quotePartStyle），按角色拆样式；
      // 单段引用（无 qpart）保持原样。
      var qpart = node.getAttribute && node.getAttribute("data-bluevibe-qpart");
      return qpart ? quotePartStyle(t.styles.blockquote, qpart) : t.styles.blockquote;
    }
    case "ul": return t.styles.ul;
    case "ol": return t.styles.ol;
    case "li": return t.styles.li;
    case "pre": return t.styles.pre;
    case "code": {
      const parent = node.parentElement && node.parentElement.tagName.toLowerCase();
      return parent === "pre" ? t.styles.codeBlock : t.styles.codeInline;
    }
    case "hr": return t.styles.hr;
    case "table": return t.styles.table;
    case "th": return t.styles.th;
    case "td": return t.styles.td;
    // 图片圆角由「图片圆角」滑杆统一控制，作用于排版区内的所有配图。
    // 引导图 / 二维码放在排版区之外，不参与排版，因此不会被加圆角。
    case "img": {
      // 图片块里的图片：上下留白已由外层块负责（块级兄弟的 margin 会折叠），
      // 自己只保留水平居中，否则两层叠加会空出 80px+。
      if (enclosingImageBox(node)) return Object.assign({}, t.styles.img, { margin: "0 auto" });
      return t.styles.img;
    }
    case "figure": return t.styles.figure;
    case "figcaption":
    case "caption": return t.styles.caption || t.styles.figcaption;
    case "del":
    case "s": {
      var delHost = headHostOf(node);
      return delHost ? headInlineStyle(t.styles.del, delHost, t) : t.styles.del;
    }
    case "section": {
      // 公众号编辑器常把段落包在 section 里，有两种形态：
      //  1) <section><p>…</p></section> —— 内层已有真正的内容块，由内层块负责样式，
      //     section 保持中立，避免重复打样式（双层 margin/字号叠加）。
      //  2) <section>文字…</section> —— section 直接装文本/行内元素，没有内容块，

        p.insertBefore(span, p.firstChild);

      // 留着会让那一套的图形（比如井号前缀）也躲过校验，以后真出问题就查不出来了。

}

/**

/** decoratePunct 的内部：在一个宿主节点里把 `。` 逐个包成 span（跳过 code / a / 图形）。 */

/* ────────────────────────────────────────────────────────────────────────────
   段首标点悬挂（光学左边距）
   ────────────────────────────────────────────────────────────────────────────
   用户口径（2026-10-21）：「第一个字符是《 书名号或者其他左侧比较空的字符，
   可以让他顶到左侧不留空吗」。

   为什么会有这个空：CJK 的全角标点是**等宽方盒**，但开括号 / 开引号的墨迹只画在
   盒子**右半边**（`《` 的墨迹从 0.46~0.51em 才开始）⇒ 段首那颗标点的左边天然空出

   「左侧空白量」。于是墨迹贴住版心左边缘，它后面的文字也跟着回到正常起点附近 ——
   就是中文排版里的「标点悬挂 / 光学对齐」。（只是行首；跨行折行位置浏览器给不了钩子，
   要真按行处理得靠 `hanging-punctuation`，微信不认。）

   `【` 0.58~0.66、`〈` 0.61~0.65、`“` 0.12（引号是半宽字形，留白本来就小）。

     · 只处理**没有角色标记的正文段落**（`p`）。标题 / 引用 / 列表 / 图释 / 卡片 / 代码块

   其余四类（文首引导图 / 文末引导 / 往期回顾 / 布局块）仍然不做：它们是卡片 / 图片结构，

function punctHtmlOf(html, spec) {

    if (el.getAttribute("data-bluevibe-role") === "caption") return true;
  } catch (e) {}

}

/**
 * 往后找图释，允许它被**无文字的纯包裹层**再包一层。
 * 只下钻「单元素子节点且自己没有文字」的层 —— 一旦碰到有文字的块，
 * 说明那就是普通正文（不是被包起来的图释），立刻停手，避免误判。

function captionInTree(el) {

    var kids = n.children;
    // 只下钻「唯一元素子节点」的纯包裹层：有多个子节点说明里面还夹着别的内容，
    // 那就不是「被包起来的图释」，直接停手（注意不能拿 textContent 判 ——
    // 包裹层的 textContent 天然包含里面图释的文字，一判就把正常情况也挡掉了）
    if (!kids || kids.length !== 1) return null;

/** el 之后是否没有别的**实体内容**了（空段落不算）。 */

    n = n.nextElementSibling;

/**
 * 找 el **之后紧邻**的图释。
 *
 * 这里必须从「最外层的图片容器」往外看，不能只看最内层 —— 真实文章里一张图常被
 * 5~6 层 `<section>` 包着（第三方编辑器 / 飞书导入的典型结构），最内层的
 * `nextElementSibling` 是 null，看起来「后面什么都没了」，于是判定不出图释。
 * 这也是「点了图释要再点一次应用主题、间距才变」的原因：套主题时结构会被拍平，
 * 那条路走的是扁平 DOM，一找就中。
 *
 * 往外走的条件收紧成「**这一支是父层的最后一块内容**」——否则说明图片和后面还隔着别的东西，

/**

 *
 * 嵌套时每个纯图片容器都会被 `applyStylesRecursive` 打上 `margin:40px 0`，
 * 所以间距要改就得**整链一起改**：只改最内层，外边那几层的 40px 照样把图和图释撑开。
 * 布局容器（并排 / 横滑 / 纵滚）内部不参与 —— 那是专门的版式，间距另有规则。
 */

      chain.push(n);
    }

/**

 *
 * 为什么改的是图片块、而不是图释自己：相邻兄弟的 margin 会折叠取较大值 ——
 * 图片块那 40px 会直接吃掉图释的 margin-top（6px），图释那边怎么设都还是 40。
 * 只有把图片块的下边距压下去才有效，压到 10 之后折叠结果正好是 10（max(10, 6)）。
 * 嵌套多层的图，整条链一起改（见 imageBoxChain）。
 *

 * 只认**紧邻**的后继 —— 中间隔着别的实体内容说明两者本来就分开，不动。
 *
 * 这个函数是**双向自愈**的：图片下面没有图释时会把下边距恢复成 40，

      el.style.setProperty("margin", want === 40 ? "40px 0" : "40px 0 " + want + "px");

}

/**
 * 一组**连续图片**之间的间距收到 10px（2026-10-24 用户口径）。
 *
 * 用户原话：「多张图一起中间的图的间距要么改小，第一张图的下间距改成 10，中间图的上下间距
 * 都是 10，最后一张图的上间距也改成 10，这样感觉更舒服些」。
 *
 * 为什么只改「组内」那几条边：图片块的标准留白是 40px（上下各 40），相邻两块会折叠成 40 ——
 * 连着三张图就是两条 40px 的沟。组内收到 10 之后：视觉上是一串图，但**组的外侧仍是 40**，
 * 不会和正文黏在一起。组与组之间隔着一个正文段落，自然断开。
 *
 * 只认我们自己写的 `margin: 40px 0` / `40px 0 10px` / `10px 0 40px` / `10px 0`
 * （左右必须是 0、上下只能是 10 或 40）—— 用户手调的其它间距一律不碰。
 */
var IMG_RUN_GAP = 10;

/** 解析「我们自己写的」图片块 margin，返回 [上, 下]；不是我们写的 → null */

/** 同层的「上一张 / 下一张纯图片块」；中间只允许空壳 / 分隔图 / 光标占位 / 空白 */

      } else if (IMG_BOX_TAG.test(tag) && isPureImageBox(n)) {
        return n;
      } else {
        return null;                                        // 别的实体内容 → 断开
      }

    n = dir < 0 ? n.previousSibling : n.nextSibling;

/**
 * 把「连续图片」组内的间距收到 IMG_RUN_GAP：
 * 第一张只收下距、中间收上下、最后一张只收上距。
 * @returns {number} 改了几块（给用例断言用）
 */
function fixImageRunGaps(root) {

  try { list = root.querySelectorAll("p,section,div"); } catch (e) { return 0; }
  var n = 0;
  for (var i = 0; i < list.length; i++) {
    var el = list[i];

    if (typeof isLayoutBlock === "function" && isLayoutBlock(el)) continue;
    var prev = imgRunSibling(el, -1), next = imgRunSibling(el, 1);
    if (!prev && !next) continue;
    var gap = imgBoxGapOf(el.getAttribute("style"));
    if (!gap) continue;
    var wantTop = prev ? IMG_RUN_GAP : gap[0];
    var wantBottom = next ? IMG_RUN_GAP : gap[1];
    if (wantTop === gap[0] && wantBottom === gap[1]) continue;

}

/**
 * 净化「外来样式」：剥掉粘贴 / Word 带进来的内联脏样式，但**只剥没有我们标记的那些**。
 *
 * 为什么需要它：
 *   「套用主题」走 stableBodySource，会把**块级**元素的 style 收敛成「对齐 + 段间距」，
 *   但**内联残留**不在那一刀范围内 —— `<span style="color:…;font-size:20px">` 会原样留下，
 *   表现就是「套了主题，可那几个字还是花的、还是大的」。这正是原来必须先点一次「清理格式」的原因。

 *   · 带 ``data-bluevibe-*`` 标记的 → **我们的产物**，一律不动（容器 / 布局 / 往期卡片 / 三段内容 /

 *   · 块级元素与图片 → 不在这里处理（块级的样式归 stableBodySource 收敛）；
 *   · 剩下的**内联元素**（span / font / b / i / u / s / sub / sup / a …）→ 只去 style 与 class，
 *     标签和文字都留着。``strong / em / del / code / mark`` 同理，只去样式、保留标签（是用户的语义）。
 *
 * 另外还做一件事：**把原文的加粗统一成我们的加粗标记**（与段落浮板的「B / B+」同款）。
 * 原文加粗有两种写法 —— `<strong>/<b>` 语义标签，或 `<span style="font-weight:700">` 内联样式；
 * 只剥样式的话：标签写的加粗侥幸留下、内联写的整段丢掉，颜色一律被剥掉，
 * 于是「加粗」在套主题后既不一致、也对不上浮板效果（用户要求统一）。
 * 规则见下方「第一步」的注释。
 */
/**
 * 把「原文的加粗」统一成我们的加粗标记（与段落浮板同款）。
 * 「清理格式」与「应用主题」两条链路**共用**这一个实现，保证两边对加粗的判断完全一致：
 *   加粗              → <strong>（重排时套主题加粗样式 = 浮板「B」）
 *   加粗 + 非中性颜色 → <strong data-bluevibe-accent="1">（着主题主色 = 浮板「B+」加粗高亮）
 * 为什么判「非中性」：原稿常把正文色显式写一遍（第三方排版工具导出会写 color:#242A26），
 * 那种不是作者特意上的颜色；若一律当“有颜色”，满篇加粗都会变成主题色。
 * 加粗载体分两类处理：
 *  · REPLACE_ON_BOLD —— 无独立语义（或本就该归一），整段归一成 <strong>；
 *  · KEEP_ON_BOLD   —— 有独立语义（链接 / 下划线 / 斜体 …），保留原标签、把内容包进 <strong>，
 *    粗体与加粗高亮都留住，链接/下划线/斜体也不丢。

 * @param {Document} doc  用于 createElement 的文档对象
 */

    // 段落卡里那枚小标签（2026-10-14）：它 `font-weight:600` ⇒ 会被下面的 MIN_BOLD 判成"加粗"，
    // 整颗 span 被换成 `<strong data-bluevibe-accent>`。视觉上无害（标签分支随后把样式原样重写），
    // 但那是每次净化都改一次节点类型 —— 标签的文字是用户写的，别让它跟着抖。
    + "[data-bluevibe-card-label],[name='wxmd-cardlabel'],svg";

  var OUR_ATTR = ["data-bluevibe-role", "data-bluevibe-h1-inner", "data-bluevibe-li-text",
    "data-bluevibe-marker", "data-bluevibe-head-mark", "data-bluevibe-ignore-dm", "data-bluevibe-radius",
    "data-bluevibe-accent"];

  var KEEP_ON_BOLD = /^(a|u|i|em|s|sub|sup|code|del|mark|bdi|bdo|small|big|label)$/;
  var MIN_BOLD = 600; // font-weight ≥600 视为加粗（正文 300/400，中等 500）
  function tg(el) { return String((el && el.tagName) || "").toLowerCase(); }
  function styleOf(el) { return (el && el.getAttribute && el.getAttribute("style")) || ""; }
  function fontWeightOf(el) {
    var m = /(?:^|;)\s*font-weight\s*:\s*([^;]+)/i.exec(styleOf(el));

  function accentColorOf(el) {
    var BLOCK = /^(p|div|section|h[1-6]|ul|ol|li|blockquote|pre|table|thead|tbody|tr|th|td|figure|figcaption|hr|img|br)$/;
    var cands = [];
    var c = declColor(el);
    if (c) cands.push(c);
    var p = el.parentElement;
    while (p && p !== root && !BLOCK.test(tg(p))) {
      if (p.closest && p.closest(SKIP)) break;
      c = declColor(p);
      if (c) cands.push(c);
      p = p.parentElement;
    }
    var kids = el.querySelectorAll("[style],font[color]");
    for (var i = 0; i < kids.length; i++) {
      if (kids[i].closest && kids[i].closest(SKIP)) continue;
      c = declColor(kids[i]);
      if (c) cands.push(c);
    }
    for (var j = 0; j < cands.length; j++) if (!isNeutralInk(cands[j])) return cands[j];

  }
  Array.prototype.slice.call(root.querySelectorAll(
    "b,strong,span,font,a,u,i,em,s,sub,sup,code,del,mark,small,big,label,bdi,bdo"
  )).forEach(function (el) {
    try {
      if (el.closest && el.closest(SKIP)) return;
      for (var i = 0; i < OUR_ATTR.length; i++) if (el.hasAttribute(OUR_ATTR[i])) return;
      if (!isBoldEl(el)) return;
      var accent = accentColorOf(el);
      if (tg(el) === "strong" && !el.attributes.length && !accent) return;

      if (pt === "b" || pt === "strong") return;

        el.appendChild(s2);

/**
 * 「应用主题」链路的源清洗：做与「清理格式」按钮完全一致的彻底重建，
 * 但保留原文加粗（加粗 → <strong>，加粗 + 非中性颜色 → <strong data-bluevibe-accent>）。
 * 与单独「清理格式」按钮的区别只有两处：keepBold（保留加粗）与 centerRuns（留住居中短句组）——
 * 其余共用同一套重建逻辑，保证结果一致。
 * 仅在还没排过版（raw 稿件）时由 content.js 调用，已排过版则跳过（由 themedBefore 守卫）。
 * @param {string} html 原始稿 innerHTML
 * @returns {string} 干净底（结构 / 文字 / 图片 / 加粗，无其余样式）
 */
function purifyForeignStyles(html) {
  // keepOurs：我们自己的产物（浮板标的标题 / 引用 / 列表 / 已排好的块）一律整块放行 ——
  // 净化只该剥**外来的**脏样式，不该毁用户已经标好的东西（2026-09-25 修，见 PURIFY_KEEP_SEL）。
  // centerRuns：「居中短句组」留住居中 + 段距 8px（2026-09-27 用户需求，见 KEEP_CENTER_ATTR）。
  // ⚠️ 只有这条链路打开它 —— 「清理格式」按钮的定位是彻底洗，对齐本来就该被洗掉。
  return cleanFormat(html, { keepBold: true, keepOurs: true, centerRuns: true });
}

/* 「应用主题」链路的净化必须放行的块：**我们自己的产物**（带块级 data-bluevibe-* 标记）。
   为什么非有这一条不可（2026-09-25 用户报的 bug）：
     用户用浮板把一段设成 H1（默认变体「色块刊头」= 白字 + 主题色底），接着在面板里
     换主题色 → **H1 的文字从白色变成黑色**；用户补了一句「其他操作似乎也会引起这样的变动」。
   根因：净化把我们的产物当成外来样式洗了 —— 彻底重建时**故意**把
   `<p data-bluevibe-role="h1">` 降级成纯 `<p>`、把内层色块 span 脱壳，于是重排时这一段
   被当成正文着色（t.styles.p = 墨色 #242A26），色块也一起没了。
   为什么会走到净化：净化只在「还没排过版」时跑，而「排过版」的判据是**有没有排版容器**
   （content.js 的 themedBefore）—— **浮板只写块、不建容器**，所以「刚导入 + 只用浮板标了
   几个标题」的文章被误判成原始稿，一改颜色就把用户标好的角色全洗掉。
   判据只认**我们自己的数据属性**，不认标签：外来的 `<h1>` / `<blockquote>` 照旧降级
   （那是 emitBlock 里写明的设计 —— 不少公众号模板整篇用 h1 包着，保留角色会让全文变成色块刊头）。
   ⚠️ 「清理格式」按钮**不使用**这一条：它的定位就是「彻底洗」，连加粗都剥（见 cleanFormat）。 */
var PURIFY_KEEP_SEL = "[data-bluevibe-role],[data-bluevibe-layout],[data-bluevibe-review],"
  + "[data-bluevibe-promo],[data-bluevibe-source],[data-bluevibe-head],[data-bluevibe-placeholder],"
  // 自产 SVG 块（动效 / 轮播 / 点击展开 / 点击切换图片）从 OWN_BLOCK_ATTRS 派生。
  // ⚠️ 2026-10-08：这一条原来是把 `[data-bluevibe-motion]` 和 `[data-bluevibe-carousel]`
  //    手写在这里的（motion 还写了两遍）。加第三种块时**必漏** —— 那时正是这样漏掉了
  //    点击展开 / 点击切换图片：面板插得进去、一按「套主题」整块就被重建没了。
  //    改派生之后，加新块只动 OWN_BLOCK_ATTRS 一处。
  + OWN_BLOCK_SEL + ","
  // 正文快照的 name 兜底（数据属性被剥时的第二处认法，见 SNAP_NAME_SEL）
  + SNAP_NAME_SEL + ","
  // 信息块（提示框 / 步骤条 / 时间轴 / 卡片组）：同样是我们自己的产物，而且**不在**
  // OWN_BLOCK_ATTRS 里，所以单独放行；放行之后由 regenSemBlocks 按当前主题**重新生成**
  // —— 是「重新生成」不是「冻住」，两者的区别见 OWN_BLOCK_ATTRS 上的说明。
  + SEM_BLOCK_SEL + ","
  // 段落卡（2026-10-14）：卡容器 + 里面那枚小标签都是我们的产物，净化必须整块放行。
  // ⚠️ 与信息块**不同**：放行之后**不重新生成**（卡里装的是用户的正文，重生成就冲掉了），
  //    容器样式由 applyStylesRecursive → styleForNode 的卡分支就地重写。
  + CARD_BLOCK_SEL + ",[name='wxmd-cardlabel'],"
  // 手动改过色 / 对齐 / 线型的块（见 OVR_ATTRS）：同样是「用户的显式创作」，
  // 净化时原样放行。列表必须靠这一条 —— <ul>/<ol> 没有 data-bluevibe-role，
  // 走普通重建会把它的 data-bluevibe-ink（符号色）丢掉。
  + "[data-bluevibe-ink],[data-bluevibe-bg],[data-bluevibe-align],[data-bluevibe-bar],[data-bluevibe-hrw],[data-bluevibe-hrs],"
  // 标题字号（2026-10-14）：与上面几条同理 —— 是用户的显式创作，净化时整块原样放行
  + "[data-bluevibe-size]";

/** 这一块是不是我们自己的产物（带块级标记）—— 净化时整块原样放行，不重建。 */
function isOurMarkedBlock(el) {
  try { return !!(el && el.matches && el.matches(PURIFY_KEEP_SEL)); } catch (e) { return false; }
}

/**
 * 清理格式 / 应用主题共用的「彻底重建」：把正文重建成干净底，只留结构、文字、图片与加粗。
 *
 * 两种用法（唯一区别是 keepBold）：
 *   · 单独「清理格式」按钮：cleanFormat(html)                  —— keepBold 默认 false，连加粗也一并剥掉
 *   · 「应用主题」链路：      cleanFormat(html, { keepBold: true })
 *     —— 同样彻底重建，但把原文加粗归一成我们的浮板加粗（<strong>）、
 *        加粗 + 非中性颜色归一成加粗高亮（<strong data-bluevibe-accent>），其余格式一概洗掉。
 *
 * 彻底重建会：删空行 / 把 h1~h6 降级成普通段落 / 丢对齐与段间距 / 剥掉一切内联标签与 style/class
 * （链接、颜色、字体、下划线、斜体…一律脱壳留文字，仅加粗例外），保留文字、图片、布局与官方组件。
 * 用于解决公众号自带清理不干净、残留 span 导致套用主题错乱的问题。
 * @param {string} html 现有正文 innerHTML
 * @param {object} [opts]
 * @param {boolean} [opts.keepBold=false] true 时保留原文加粗（应用主题链路用）
 * @returns {string} 干净的 HTML（无样式、无多余标签，最多保留结构与加粗）
 */
function cleanFormat(html, opts) {
  const keepBold = !!(opts && opts.keepBold);
  // keepOurs：我们自己的产物整块放行（只有「应用主题」链路的净化打开；清理按钮不开）。
  const keepOurs = !!(opts && opts.keepOurs);
  // centerRuns：「居中短句组」识别 + 打标记（同上，只有「应用主题」链路打开）。
  const centerRuns = !!(opts && opts.centerRuns);
  const doc = new DOMParser().parseFromString('<div id="root">' + bvUpgrade(html) + "</div>", "text/html");
  const root = doc.getElementById("root");
  // ⭐ 巨大句号：**清理链路也必须回退**（2026-10-13 修）。
  //    「清理格式」= 剥成干净底 —— 那颗 `〇` 属于**我们换上去的产物**，必须还原成 `。`。
  //    ⛔ 原来这条链路完全不碰 punct span：实测「清理格式」之后**文本还是 `〇`**，
  //       而它的标记 span 反而被这一链路的解包弄丢了 ⇒ **从此再也认不出来、永久固化**
  //       （用户 2026-10-13 问「清理成 p 正文能不能回退」时暴露的就是这一类）。
  //    `decoratePunct(root, null)` 的语义正是「只拆旧的、写回全角句号」。
  //    ⚠️ 必须放在**下面那些解包 / 剥壳之前**：标记 span 一旦被解包就找不回来了。
  decoratePunct(root, null);
  // 「应用主题」链路（keepBold）需要先把原文加粗归一成我们的加粗标记；
  // 单独「清理主题」按钮（keepBold 默认 false）连加粗也一并剥掉，不归一。
  // 归一必须在 walk / cleanInner 剥壳之前做，否则 style / 颜色被清掉就判不出加粗了。
  if (keepBold) normalizeBoldMarkup(root, doc);

  // 信息块（提示框 / 步骤条 / 时间轴 / 卡片组）走哪条路，由调用方决定：
  //   · 「应用主题」链路（keepOurs）→ 整块放行（在 PURIFY_KEEP_SEL 里），随后由
  //     regenSemBlocks 按当前主题重新生成；
  //   · 「清理格式」按钮（!keepOurs）→ **拆容器、保内容**：每个字段落成一个普通段落。
  //     ⛔ 不能留给下面的通用重建 —— 那会把整个块塞进一个 <p>、出非法嵌套。
  if (!keepOurs) unwrapSemBlocks(root);
  // 段落卡：清理格式 = **拆掉卡壳、正文原样留下**（与信息块 / 布局块同一条语义）。
  // ⚠️ 顺序在 unwrapSemBlocks **之后**：卡里可能装着信息块，先把块拆成段落、再拆卡壳，
  //    两步的结果才是「一沓干净段落」。
  if (!keepOurs) unwrapCards(root);

  // 图片可能是 p 内的子节点，也可能是 section/div 的直接子节点。
  // 直接子节点不能走普通 emitBlock 的 cleanInner(img)，否则 img 没有子节点会被判空丢弃。
  function cleanImg(img) {
    /*
     * 保留哪些属性：地址类 + **尺寸元数据**。
     *
     * data-w / data-ratio / data-s / data-type 是微信给图片记的「原始宽 / 比例 / 候选源 /
     * 格式」，官方规范 §1.4.3 明确建议 img 带 data-w（检测引擎在小屏拿它兜底算宽度，
     * 否则图片没加载完就可能误报；读者端也靠 data-ratio 预留比例、避免加载抖动）。
     * 以前这份白名单只有地址，套一次主题就把它们洗掉了（2026-10-19 补）。
     * 注意：它们**不是样式**，保留不会让「清理格式」失效 —— 该洗的 class/style 照旧洗。
     */
    const attrs = ["src", "data-src", "data-original", "data-original-src",
      "data-w", "data-ratio", "data-s", "data-type", "alt", "title"];
    const kept = [];
    attrs.forEach(function (name) {
      const value = httpsifyUrl(img.getAttribute(name)); // 微信域名统一 https（发布后服务端才抓得到图）
      if (value !== null && value !== "") kept.push(name + '=\"' + value.replace(/&/g, "&amp;").replace(/\"/g, "&quot;") + '\"');
    });
    // 公众号懒加载图片通常至少有 data-src；src 为空时也保留其它定位属性。
    return kept.length ? "<img " + kept.join(" ") + ">" : "";
  }

  // 提取块内干净内容：文本 + 换行(br) + 图片，递归剥掉内联标签
  function cleanInner(el) {
    let s = "";
    el.childNodes.forEach(function (n) { s += cleanNode(n, el); });
    return s;
  }

  // 单个子节点的干净内容 —— cleanInner 的「逐节点版」。
  // 抽出来是为了让 walk 的「行内暂存」复用同一套剥壳规则：两条路必须产出一致，
  // 否则「同一个 span 走 emitBlock」和「走暂存」会得到两种结果。
  function cleanNode(n, parent) {
      if (n.nodeType === 3) return n.nodeValue;
      if (n.nodeType !== 1) return "";
      const tag = n.tagName.toLowerCase();
      // 编辑器占位产物（separator 占位图 / trailingBreak 换行）不是文章内容，一律丢掉。
      // 不清就会留在图片后面，变成空行、还会连累图片被误删。
      if (isEditorArtifact(n)) return "";
      // 列表符号（我们排的，或第三方排版工具塞进 li 的装饰字符）不是文章内容：
      // 剥壳留文字的话，它会和浏览器默认的项目符号叠成「• ▸ 文字」两份。
      // 只认 li 的第一子节点，避免误删正文里段落开头的 ▸ 装饰。
      // 符号现在可能落在 li 里那个 <p> 上（见 converter 的 markerHostOf），
      // 所以判据是「它在自己的父层里排第一」，而不是「它必须是 li 的第一子节点」。
      if (isListMarkerSpan(n, parent) && (parent.tagName || "").toLowerCase() !== "span") return "";
      if (tag === "br") return "<br>";
      // 动效块整块原样保留（必须在 cleanImg 之前 —— 它也是 <img>，走 cleanImg 会丢掉宽度样式）
      if (isMotionBlock(n)) return n.outerHTML || "";
      if (tag === "img") return cleanImg(n);
      // 加粗：仅「应用主题」链路（keepBold）保留，归一成我们的浮板加粗（<strong>），
      // 带非中性强调色时保留加粗高亮（data-bluevibe-accent）。单独「清理格式」按钮不保留——
      // keepBold 关闭时连加粗也一并剥成纯文字（<strong> 当作普通容器递归进去即可）。
      if (tag === "strong") {
        if (!keepBold) return cleanInner(n);
        const accent = n.getAttribute && n.getAttribute("data-bluevibe-accent");
        const innerHtml = cleanInner(n);
        if (!innerHtml) return ""; // 空加粗不保留
        return "<strong" + (accent ? ' data-bluevibe-accent="1"' : "") + ">" + innerHtml + "</strong>";
      }
      // 官方组件（视频 / 视频号 / 音频 / 小程序 …）、SVG 组件（第三方排版工具 轮播、图文卡）
      // 整块 outerHTML 保留，剥成纯文本就丢内容了。判定统一走 isWxComponent / isSvgComponent。
      if (isWxComponent(n) || isSvgComponent(n)) return n.outerHTML || "";
      return cleanInner(n); // 其余内联标签（span/b/i/a/font…）剥壳留文字
  }

  // 块级标签表（净化重建时用来判断「这是内容块，还是装内容的容器」）
  //
  // ⚠️ 这张表只是**起点**，不是唯一判据。曾经这里就是全部判据，于是「要不要下钻」变成了
  // **标签白名单**测试 —— 第三方编辑器的标签是无穷的（<center>、<font>、<label>、<a>、
  // <span style="display:block">、各家自定义 <xxx-yyy>…），白名单永远会漏。
  // 现在的判据是**结构驱动**：只要子层套着块级元素，就是「包装层」，一律下钻（见 isBlockContainer）。
  // 下面这张表只用来回答「这个标签自身算不算独占一行」。
  const BLOCK_TAG = /^(p|div|section|h[1-6]|blockquote|article|aside|header|footer|main|nav|address|figure|figcaption|dl|dd|dt|details|summary|fieldset|form|ul|ol|li|pre|table|thead|tbody|tr|td|th|hr)$/i;

  // ── 结构体：列表 / 表格 / 定义列表 ──
  // 这类**不能**当普通包装层下钻（下钻会把骨架拆成一堆散段落），也**不能**整体压平
  // （压平会丢行 / 列 / 嵌套，实测 <table> 会连标签一起消失、整张表拍成一段纯文本）。
  // 处理方式是第三条路：**保留骨架 + 只在内容层递归**（见 structHtml）。
  const STRUCT_TAG = /^(ul|ol|table|thead|tbody|tfoot|tr|dl)$/i;
  const CELL_TAG = /^(li|td|th|dt|dd)$/i;
  // 明确「不下钻、整块按内容出」的标签：pre 的换行/等宽靠标签本身，拆开就毁内容
  const NO_DESCEND_TAG = /^pre$/i;

  // 元素自身内联声明了**块级 display** 时也当块 —— 第三方编辑器常拿行内标签当块使
  // （`<span style="display:block">` 就是一块「视觉上的段落」）。
  // 只看孩子是判不出来的：这种 span 的孩子全是行内内容，纯结构上它和行内 span 一模一样。
  // 只认明确的块级关键字；`inline-block` / `inline` 不算（那在公众号里多用于居中小挂件）。
  const BLOCK_DISPLAY_RE = /(?:^|;)\s*display\s*:\s*(?:block|flex|grid|table|list-item|flow-root)\s*(?:;|!|$)/i;
  function hasBlockDisplay(el) {
    if (!el || !el.getAttribute) return false;
    const st = el.getAttribute("style");
    return !!st && BLOCK_DISPLAY_RE.test(st);
  }

  // 自身就「独占一行」的标签（不看子元素）：块级标签 + 图片 / svg / iframe / 自定义组件。
  function isSelfBlockTag(t) {
    if (!t) return false;
    if (t === "img" || t === "svg" || t === "iframe" || t.indexOf("-") >= 0) return true;
    return BLOCK_TAG.test(t);
  }

  // 「孩子里有没有块级元素」—— 判断一个块是「包装层」还是「内容本身」的依据。
  // 用的是 walk 的**块级边界**语义（见 isBlockBoundary），不是 BLOCK_TAG：
  // 图片 / svg / iframe / mp-* 组件虽然不在 BLOCK_TAG 里，但在文档流里同样独占一块。
  // 漏掉它们会踩坑：<section><img><mp-common-video></section> 会被误判成「纯行内容器」，
  // 走 cleanInner 压平 → 图片和视频号挤进同一个 <p>。
  // 递归往下找是必要的：行内壳里还套着块级（`<a><div>…</div></a>` / `<span><p>…</p></span>`）
  // 在第三方产物里很常见，只看一层会漏。
  function hasBlockChild(el) {
    const kids = el.children || [];
    for (let i = 0; i < kids.length; i++) {
      const c = kids[i];
      if (isBlockBoundary(c)) return true;
    }
    return false;
  }
  // walk 用的「块级边界」判定：文档流里独占一行的节点。
  // 三条来源：① 块级标签 / 图片 / svg / iframe / 自定义组件（isSelfBlockTag）；
  //          ② 自身声明了块级 display 的行内标签（hasBlockDisplay）；
  //          ③ 行内壳里直接套着块级（hasBlockChild 递归）。
  // 边界的作用：边界到来之前暂存的行内内容，必须先落成独立段落。
  function isBlockBoundary(n) {
    if (!n || n.nodeType !== 1) return false;
    if (isSelfBlockTag(String(n.tagName || "").toLowerCase())) return true;
    if (hasBlockDisplay(n)) return true;
    return hasBlockChild(n);
  }
  // 容器 = **子层套着块级元素**（不管它自己叫什么标签）。
  // 这种节点不是「内容」而是「包装」（第三方图文编辑器常把整篇文章都塞进一个
  // `<h2 placeholder="请输入标题">`、Word 常把多段塞进 `<li>` / `<td>`）。
  // 遇到容器就下钻递归，让里面的每段各自成段 —— 直接 cleanInner 会把它们压成一段。
  // 例外：结构体（列表/表格/定义列表）走 structHtml 保留骨架；pre 整块出。
  function isBlockContainer(el) {
    if (!el) return false;
    const t = String(el.tagName || "").toLowerCase();
    if (NO_DESCEND_TAG.test(t)) return false;
    if (STRUCT_TAG.test(t) || CELL_TAG.test(t)) return false;
    return hasBlockChild(el);
  }

  // 空行判定：去掉换行/图片/空格（含 &nbsp; 与全角空格）后没有任何内容，就是空行
  // 官方组件（视频/视频号/音频/小程序…）不算空，必须留下 —— 统一走 htmlHasWxComponent
  function isEmptyInner(inner) {
    if (htmlHasWxComponent(inner)) return false;
    const plain = String(inner || "")
      .replace(/<br\s*\/?>/gi, "")
      .replace(/<img[^>]*>/gi, "")
      .replace(/&nbsp;/gi, " ")
      .replace(/[\s\u00a0\u3000]/g, "");
    return plain.length === 0 && !/<img[^>]*>/i.test(inner || "");
  }

  // 把单个块节点净化成 HTML 字符串（没有内容时返回空串）。
  // 与 walk 一样**返回字符串而不是直接落结果** —— walk 可能被嵌套调用
  //（列表单元格 / 包装层下钻），结果必须能被子层包壳；若直接落进一个共享数组，会串到顶层、顺序错乱。
  function emitBlock(el) {
    const tag = (el.tagName || "").toLowerCase();
    // 我们自己的产物（浮板标的角色 / 动效 / 布局 / 往期回顾 / 文首文末）整块原样放行 ——
    // 「净化只剥外来的脏样式」那条铁律在这里补上（见 PURIFY_KEEP_SEL 的说明）。
    if (keepOurs && isOurMarkedBlock(el)) return el.outerHTML || "";
    // 视频号 / 视频 / 不可编辑卡片 / **SVG 组件（第三方排版工具 轮播、图文卡）**：整块原样保留
    // （SVG 组件的图片靠 background-image 承载，拆开就变空、随即被空行清理丢掉）。
    // 注意：横向滚动多图「不」在此列——清理格式要保留图片、去掉滚动样式，回到一图一段。
    if (isMotionBlock(el) || isHardWidget(el) || isSvgComponent(el)) return el.outerHTML || "";
    // 官方组件（视频 / 视频号 / 音频 / 小程序 / 投票 …）整块保留
    // （iframe 自己没有子节点，必须取 outerHTML），判定统一走 isWxComponent
    if (isWxComponent(el)) {
      const oh = el.outerHTML || "";
      // `data-bluevibe-widget` = 「这是我们给组件造的块壳」：应用主题时上下留白只落在这层壳上
      //（见 applyWidgetSpacing）—— 没有这个标记的容器（视频号美化那几层 section / 轮播内部层）一律不碰。
      return oh ? '<p data-bluevibe-widget="1">' + oh + "</p>" : "";
    }
    // 布局容器（并排 / 横滑 / 纵滚）：整块原样保留 —— 清理格式不该拆掉用户主动排好的布局
    if (isLayoutBlock(el)) return el.outerHTML || "";
    // 【关键】块里套块 = 包装层，不是内容本身。
    // 某些第三方编辑器导出时常把整篇正文塞进一个 <h2 placeholder="请输入标题">（或别的块）里，
    // 若在这里直接 cleanInner，内层所有段落会被压平成**一个** <p> —— 这就是"相邻正文段落合并成一段"。
    // 判出容器就下钻递归，让里面的每段各自成段。
    if (isBlockContainer(el)) return walk(el);
    const inner = cleanInner(el).trim();
    // 直接传入 img 时 cleanInner 返回自身 HTML；空文本图片也必须保留。
    if (!inner && tag !== "img") return "";
    // 顺带清掉空行：<p><br></p> / <p>&nbsp;</p> / 纯空白段落，含图片的块保留
    if (tag !== "img" && isEmptyInner(inner)) return "";
    if (tag === "img") { const img = cleanImg(el); return img ? "<p>" + img + "</p>" : ""; }
    // 标题 / 引用一律降成**纯 p，不带角色标记**（不再输出 data-bluevibe-role）。
    //
    // 为什么不再保留角色：不少公众号模板整篇正文都用 <h1>（或 <blockquote>）包着，
    // 若清理后仍带着 h1 角色，套主题时全文都会被套上「H1 白字色块」样式 —— 一整篇变成大标题块。
    // 清理格式的定位就是「剥成干净底」，语义交给用户在浮板上手动指定
    //（浮板加角色是显式意图），不该由清理环节替用户猜。
    // 代码块例外：<pre> 是真实结构，降成 p 会丢掉换行与等宽，反而破坏内容，故保留。
    if (tag === "pre") return "<pre><code>" + inner + "</code></pre>";
    // 「居中短句组」的标记跟着走到产物上（识别见 keepCenterMark，样式见 keepCenterStyle）。
    // 这里是唯一落点 —— 上面所有 return 分支（我们的产物 / 组件 / 布局容器 / 包装层下钻）
    // 都不是「一段短句」。只在 centerRuns 打开时透传：否则「清理格式」会把上一轮
    // 应用主题留下的标记又搬一遍，那就不是「彻底洗」了。
    const kc = (centerRuns && el.getAttribute && el.getAttribute(KEEP_CENTER_ATTR))
      ? " " + KEEP_CENTER_ATTR + '="1"' : "";
    return "<p" + kc + ">" + inner + "</p>"; // p/div/section/li 等一律归为干净段落
  }

  // 结构体（列表 / 表格 / 定义列表）的净化：**保留骨架 + 只在内容层递归**。
  // 为什么走第三条路：整体压平会丢行/列/嵌套（实测 <table> 连标签一起消失、整张表拍成一段纯文本）；
  // 整块丢壳下钻会把 li/td 的边界也丢掉。骨架标签本身不带样式（净化本来就要剥样式），
  // 所以这里直接重建标签名，不用 outerHTML（否则会把外来的脏 style 一起留下）。
  // 内容层（li / td / th / dt / dd）：内部**有块级孩子就逐段重建**（Word 导入、第三方编辑器
  // 都爱把多段正文塞进 li / td —— 压平就成了一行），否则照旧按行内内容出（保持 `<li>纯文本</li>`）。
  function structHtml(el) {
    const tag = String(el.tagName || "").toLowerCase();
    if (CELL_TAG.test(tag)) {
      const inner = hasBlockChild(el) ? walk(el) : cleanInner(el).trim();
      if (!inner || isEmptyInner(inner)) return ""; // 空项丢掉（原行为）
      return "<" + tag + ">" + inner + "</" + tag + ">";
    }
    // 骨架层：只保留同类的结构孩子，丢掉装饰性内容
    // （第三方编辑器常在 table / ul 里塞空 div、空 section 做间距，留着就成了空行）
    const keep = Array.prototype.slice.call(el.children).filter(function (k) {
      const kt = String(k.tagName || "").toLowerCase();
      return STRUCT_TAG.test(kt) || CELL_TAG.test(kt);
    });
    const inner = keep.map(function (k) { return structHtml(k); }).join("");
    if (!inner) return ""; // 骨架空了就整块丢掉（原来是块空表格 / 空列表）
    // `<ol start>` 要留住（v2.48.9 补）：它表达「从第几项开始」——
    // 原文里续接的编号、以及浮板把多段 li 拆成多个 ol 时靠它让编号跨块连续，
    // 全靠这个属性（见 wrapListMarkers 的说明）。丢了就一律从 1 重数。
    // 只留 `start`：序号格式由主题前缀决定（`type` 传下去也不会生效，不留）。
    let startAttr = "";
    if (tag === "ol" && el.getAttribute) {
      const s0 = parseInt(el.getAttribute("start"), 10);
      if (s0 > 0) startAttr = ' start="' + s0 + '"';
    }
    return "<" + tag + startAttr + ">" + inner + "</" + tag + ">";
  }

  // 净化重建的主体。**返回字符串** —— 因为列表 / 表格要把子结果**包壳**，
  // 扁平的数组表达不了「这几段在同一个 <li> 里」。
  function walk(el) {
    const parts = [];
    // 行内暂存：容器层级上的裸文本 / span / br / 加粗 等先攒起来，
    // 遇到块级边界（或容器结束）再整段落成一个 <p>。
    // 老实现只遍历 el.children，容器里的裸文本会被直接丢掉；
    // 且对 <h2> 这类「块里套块」的包装层走 emitBlock，把整棵子树压成一段 —— 已修。
    let buf = "";
    function flush() {
      const s = buf.trim();
      buf = "";
      if (!s || isEmptyInner(s)) return; // 空行（<br> / 空白）照旧清掉
      parts.push("<p>" + s + "</p>");
    }
    // 收一个块节点的净化结果（空则不落）
    function emit(n) { const s = emitBlock(n); if (s) parts.push(s); }
    const kids = Array.prototype.slice.call(el.childNodes);
    kids.forEach(function (n) {
      if (n.nodeType === 3) { buf += n.nodeValue; return; } // 文本节点：暂存
      if (n.nodeType !== 1) return;
      const tag = n.tagName.toLowerCase();
      // 我们自己的产物整块放行（同 emitBlock）：包装层不带标记时靠这一层兜住。
      if (keepOurs && isOurMarkedBlock(n)) {
        flush();
        const ohOwn2 = n.outerHTML || "";
        if (ohOwn2) parts.push(ohOwn2);
        return;
      }
      // 只有硬组件（视频号/视频/卡片）与 SVG 组件（第三方排版工具 轮播、图文卡）才整块保留；
      // 横向滚动多图继续往下递归，让每张图各自成段，
      // overflow-x / flex / nowrap 等滚动样式随之被清掉。
      if (isMotionBlock(n) || isHardWidget(n) || isSvgComponent(n)) {
        flush();
        const oh = n.outerHTML || "";
        if (oh) parts.push(oh);
        return;
      }
      // 布局容器整块保留（不递归进去，否则 flex / overflow 会被当场清掉）
      if (isLayoutBlock(n)) {
        flush();
        const ohL = n.outerHTML || "";
        if (ohL) parts.push(ohL);
        return;
      }
      // 还没到块级边界 —— 行内节点（span / strong / b / i / a / br / font…）先暂存，
      // 与 cleanNode 走同一套剥壳规则，保证「走暂存」和「走 emitBlock」结果一致。
      if (!isBlockBoundary(n)) { buf += cleanNode(n, el); return; }

      // ---- 以下都是块级边界：先把已暂存的行内内容落成独立段落 ----
      flush();
      if (STRUCT_TAG.test(tag) || CELL_TAG.test(tag)) {
        // 列表 / 表格 / 定义列表：保留骨架，只在内容层递归
        const s = structHtml(n);
        if (s) parts.push(s);
      } else if (tag === "section" || tag === "div") {
        // 包装层自身也可能是 SVG 组件（轮播容器），先判组件再决定是否继续拆
        if (isSvgComponent(n)) { const oh2 = n.outerHTML || ""; if (oh2) parts.push(oh2); return; }
        // 块里套块 → 下钻，保住里面的段落结构（别整棵压成一段）
        if (isBlockContainer(n)) { const s = walk(n); if (s) parts.push(s); return; }
        emit(n); // 纯行内的 div/section：自己就是一段内容
      } else if (tag === "img") {
        emit(n);
      } else if (tag === "svg") {
        // 外部排版工具用 svg 背景图承载图片（横滑多图就是这种）：
        // 还原成真正的图片段落，否则拆开容器后整片图会丢失。
        const bg = svgBgUrl(n);
        if (bg) parts.push("<p><img src=\"" + bg.replace(/"/g, "&quot;") + "\"></p>");
      } else if (tag === "iframe" || tag.indexOf("-") >= 0) {
        emit(n); // 视频（公众号视频 iframe / 视频号 mp-* 自定义元素）整块保留
      } else {
        // 块里套块就下钻 —— 这里是**结构驱动**的兜底：不认标签、只认「子层有没有块级元素」，
        // 所以 <center> / <font> / <label> / <a> / <span style="display:block"> /
        // 各家自定义标签包块的写法都会被正确拆开（白名单时代这些全被压成一段）。
        if (isBlockContainer(n)) { const s = walk(n); if (s) parts.push(s); return; }
        emit(n);
      }
    });
    flush(); // 收尾：容器末尾还有暂存的行内内容，落成最后一段
    return parts.join("");
  }

  // ── 「居中短句组」识别（只有 centerRuns 打开时跑；口径见 KEEP_CENTER_ATTR 那段注释）──
  //
  // 必须在**重建之前**做：text-align 锚在 DOM 上，重建完就没了（cleanFormat 刻意剥它）。
  // 做法：按文档顺序收集「会各自变成一个 <p> 的候选块」→ 找连续 ≥ KEEP_CENTER_MIN_RUN 段、
  // 每段都「居中 + 短」的极大段组 → 在**源节点**上打标记。
  //
  // ⚠️ 标记打在源节点上、而不是「先记住文本再按文本找回来」：文本会重复（同一句出现两次很常见），
  //    按文本回填会把另一处不居中的同文段落一起标上。
  function keepCenterMark() {
    // 上一轮留下的标记先清掉：标记是「每一轮重新识别」的结论 ——
    // 不清的话，用户把那句改成带句号了，旧标记还会跟着重建（正文里留着脏标记）。
    Array.prototype.slice.call(root.querySelectorAll("[" + KEEP_CENTER_ATTR + "]"))
      .forEach(function (n) { n.removeAttribute(KEEP_CENTER_ATTR); });

    const cands = []; // 候选；null = 「这一格不是短句候选」= 连续组必须在这里断开
    const sizeSamples = []; // 候选段各自的字号（px），用来推「正文基准字号」（众数）
    // 可见文字（空白 / 零宽 / BOM 都不算）：字数按它算
    function visibleText(el) {
      return String(el.textContent || "").replace(/[\s\u00a0\u200b\u3000\ufeff]+/g, "");
    }
    // 这一段「看上去多大」：自己/祖先里最近的 px 字号，与行内后代里出现过的最大 px 字号，
    // 取大的那个（小标题常把字号写在 <strong>/<span> 上，只看自己会漏）。
    function sizeOf(node) {
      let own = 0;
      let n = node;
      while (n && n.nodeType === 1) {
        const st = (n.getAttribute && n.getAttribute("style")) || "";
        const m = /(?:^|;)\s*font-size\s*:\s*([\d.]+)px/i.exec(st);
        if (m) { own = parseFloat(m[1]); break; }
        if (n === root) break;
        n = n.parentElement;
      }
      let inner = 0;
      const re = /font-size\s*:\s*([\d.]+)px/gi;
      let m2;
      const html = String(node.innerHTML || "");
      while ((m2 = re.exec(html))) { const v = parseFloat(m2[1]); if (v > inner) inner = v; }
      return Math.max(own, inner);
    }
    // 正文基准字号 = 候选段的众数（见 KEEP_CENTER_MAX_SIZE_RATIO 那段注释）
    let refSize = 0;
    // 段落自身的对齐：先看自己，再沿祖先链找 —— 外层容器整体居中同样算「居中排列」
    function centerOf(node) {
      let n = node;
      while (n && n.nodeType === 1) {
        const st = (n.getAttribute && n.getAttribute("style")) || "";
        const m = /(?:^|;)\s*text-align\s*:\s*([^;!]+)/i.exec(st);
        if (m) return String(m[1]).trim().toLowerCase();
        if (n === root) break;
        n = n.parentElement;
      }
      return "";
    }
    // 整块保留 / 不是文字段落的：既不是候选，也**打断**连续性
    function isCenterBarrier(n) {
      const tag = String(n.tagName || "").toLowerCase();
      if (keepOurs && isOurMarkedBlock(n)) return true;
      if (isMotionBlock(n) || isHardWidget(n) || isSvgComponent(n) || isWxComponent(n)) return true;
      if (isLayoutBlock(n)) return true;
      if (STRUCT_TAG.test(tag) || CELL_TAG.test(tag) || NO_DESCEND_TAG.test(tag)) return true;
      return tag === "img" || tag === "svg" || tag === "iframe" || tag === "hr" || tag === "figure";
    }
    function collect(host) {
      Array.prototype.slice.call(host.childNodes).forEach(function (n) {
        if (n.nodeType === 3) { if (String(n.nodeValue || "").trim()) cands.push(null); return; }
        if (n.nodeType !== 1) return;
        if (isCenterBarrier(n)) { cands.push(null); return; }
        // 包装层（块里套块）自己不成段，下钻看里面的块 —— 与 emitBlock 同一套判据
        if (isBlockContainer(n)) { collect(n); return; }
        // 空段落（<p><br></p> / <p>&nbsp;</p>，原稿常拿它撑段距）透明跳过：
        // 净化本来就会把它删掉，所以它不该把一组短句拆成两截（既不是候选、也不算障碍）。
        if (!visibleText(n) && !/<(img|svg|iframe|video|audio|canvas|picture|hr)\b/i.test(n.innerHTML || "")) return;
        cands.push(n);
        sizeSamples.push(sizeOf(n));
      });
    }
    function isShortCentered(node) {
      if (KEEP_CENTER_SKIP_TAG.test(String(node.tagName || "").toLowerCase())) return false;
      // 带图 / 带组件的段落不是「一行短句」：图块有自己的 40px 留白，不该被压成 8px
      try { if (node.querySelector("img,svg,iframe,video,audio,canvas,picture,hr")) return false; } catch (e) {}
      if (centerOf(node) !== "center") return false;
      // 字号护栏：明显比正文大的一律不算（小标题）。只在两边都量到字号时才判
      if (refSize > 0) {
        const fs = sizeOf(node);
        if (fs > 0 && fs > refSize * KEEP_CENTER_MAX_SIZE_RATIO) return false;
      }
      const txt = visibleText(node);
      if (!txt || txt.length > KEEP_CENTER_MAX_CHARS) return false;
      // 结尾标点不再排除（2026-09-27 放开，理由与实测数据见 KEEP_CENTER_GAP 下方那段）
      return true;
    }
    collect(root);
    // 基准字号必须在 collect 之后才算得出来（要先知道全文有哪些候选段）
    {
      const tally = {};
      sizeSamples.forEach(function (v) { if (v > 0) tally[v] = (tally[v] || 0) + 1; });
      let bestN = 0;
      Object.keys(tally).forEach(function (k) {
        // 同票时取小的那个：基准偏小 ⇒ 护栏更严 ⇒ 宁可漏判也不把正文误挡
        if (tally[k] > bestN || (tally[k] === bestN && parseFloat(k) < refSize)) {
          bestN = tally[k];
          refSize = parseFloat(k);
        }
      });
    }
    let i = 0;
    while (i < cands.length) {
      if (!cands[i] || !isShortCentered(cands[i])) { i++; continue; }
      let j = i;
      while (j < cands.length && cands[j] && isShortCentered(cands[j])) j++;
      if (j - i >= KEEP_CENTER_MIN_RUN) {
        for (let k = i; k < j; k++) cands[k].setAttribute(KEEP_CENTER_ATTR, "1");
      }
      i = j;
    }
  }
  if (centerRuns) keepCenterMark();
  return walk(root);
}


/**
 * 当前主题「**当文字墨用**」的主题色 —— 淡色主题色会自动压深的那一版（2026-09-30 淡色主题色）。
 *
 * 为什么需要它：主题色有一半的用法是**不铺底、直接当字**（加粗高亮 / 主题色标题 / 链接 /
 * 列表符号 / 行内代码 / 往期回顾卡片的栏目头与序号…）。淡色主题色（#FFD400 在纸白上只有
 * 1.4:1）在这些地方就是看不见 —— 所以「当字色」这条路必须走 themes.js 的 accentInk。
 *
 * ⚠️ 与「**色块底**」泾渭分明：铺底色（色块刊头 / 通栏 / 荧光标记的底 / 往期回顾的实心色块）
 *    永远用 themeMainColor 的**原色**，绝不能过这一道 —— 底加深了，压在它上面的字反而没对比度。
 *
 * 优先读主题上预挂好的 `accentInk`：那是 inheritTypography 按**本次重排的正文底色**算好放上去的。
 * 正文底色只有那里拿得到（styleForNode 的签名里没有 opts，也不该为这个去改签名），
 * 所以「挂在主题上传下去」是最省事又不会漂的做法。
 * 没挂（单独加载 converter.js 的测试 / 没走 inheritTypography 的老路径）→ 退回按纸白算，
 * 绝大多数文章本来就是纸白，够用。
 */
function themeAccentInk(t) {
  if (t && typeof t.accentInk === "string" && t.accentInk) return t.accentInk;
  var base = (typeof themeMainColor === "function") ? themeMainColor(t) : ((t && t.accent) || "#0052FF");
  return (typeof accentInk === "function") ? accentInk(base, "") : base;
}

/**
 * 把面板上的「正文字号 / 行距 / 字间距」叠加到主题的文本类样式上。
 * 只影响正文与派生文本（正文、列表项、引用），标题/代码保留各自的设计字号。
 */
/**
