/**
 * 写回编辑器前的「残渣清洗」—— 给**从编辑器实时 DOM 整篇写回**的那几条路用。
 *
 * 为什么必须有它（2026-09-21 用户报「点了图片注释之后，其他图后面多一个空行」）：
 *   点图释、并排/横滑/纵滚布局、拖圆角这三类操作都只改一个块或几个属性，但都走
 *   `set_content` **整篇写回**，而且写的是**编辑器当前渲染出来的 DOM**（`ed` 的克隆）。
 *   那份 DOM 里混着编辑器自己的行内渲染产物，它们**不在编辑器的文档模型里**：
 *     · 无源空 `<img>`（`class="rich_pages wxw-img"`，没有 src/data-src）—— 一个行盒；
 *     · `.ProseMirror-separator` / `.ProseMirror-trailingBreak` —— 光标占位与空块撑高。
 *   一旦被当成正文序列化回去，编辑器重新解析时就把它们**变成真内容** → 图片下面多一个空行，
 *   而且与真图同处一个段落（用户把光标放那按删除，整段连同图片一起没）。
 *   这就是「图释」看起来跟空行有关的真因：**不是它改的那 10px 边距**（边距只会变间距，
 *   不会凭空多出一个行盒，而且那边距只会 40→10、永远不会变大），而是**只有它这一类操作
 *   会整篇写回**。套主题 / 清理格式那两条路早已清过（见 stripSourcelessImages），
 *   这几条写回的路此前漏了。
 *
 * 判定收紧在这里：
 *   · `.ProseMirror-(separator|trailingBreak|gapcursor)` 这三种**纯占位**类一律删
 *     （用户自己按 Shift+Enter 换行得到的 `<br>` 没有这个类，不会被误删）；
 *   · **只有图片、没有文字**的块里那些孤立 `<br>` 也删（无意义的换行，只在图下面多撑一行）；
 *     有文字的块一律不动（那可能是用户自己要的换行）；
 *   · 无源空图的判定沿用 stripSourcelessImages（只写 data-src / srcset / <picture> / svg 里的一律保留）。
 */
function scrubEditorArtifacts(root) {
  if (!root || !root.querySelectorAll) return;
  // ① 图片块里的占位产物（含「无文字的图片块」里那些孤立 <br>，见 stripEditorArtifactsInImageBoxes）
  stripEditorArtifactsInImageBoxes(root);
  // ② 光标占位类：不管落在哪儿都不算内容（渲染时编辑器会自己补回来）
  var junk;
  try { junk = root.querySelectorAll(".ProseMirror-separator,.ProseMirror-trailingBreak,.ProseMirror-gapcursor"); } catch (e) { junk = []; }
  for (var i = junk.length - 1; i >= 0; i--) {
    var n = junk[i];
    if (n && n.parentNode) n.parentNode.removeChild(n);
  }
  // ③ 无源空图壳
  stripSourcelessImages(root);
}

/**
 * 把官方组件放进 `<section nodeleaf="">`（微信原生壳），2026-10-24。
 *
 * 用户报：导入的公众号文章里有公众号视频，**应用主题后**视频外面多了一层
 * `<span leaf="">`，点「设置段后距」会把全篇段距一起改掉（span 是行内叶，整篇被当成一行）。
 *
 * 根因：微信编辑器把「块级组件」的合法容器认成 `section[nodeleaf]`（它自己的文章就是这样）。
 * 我们重排后把组件放在了裸 `<section>` / `<p>` 里 ⇒ ProseMirror 解析时按行内内容处理，
 * 于是给组件套一个 `span[leaf]` 行内叶。所以**输出时就要给它原生壳**，别等编辑器去猜。
 *
 * 幂等：已经在 section[nodeleaf] 里的不再包；跑第二遍什么都不做。
 * 只处理「组件本体」：iframe / video / audio / mp-* / div.videoWrapper / div[data-node-view-root]。
 * ⚠️ 手机端没有「组件」这个概念的老文章不受影响（它们本来就没有这些节点）。
 */
function wrapWidgetsInNodeleaf(root) {
  if (!root || !root.querySelectorAll) return;
  var SEL = "iframe,video,audio,object,embed,mp-common-video,mp-common-videosnap,mpvideo,"
    + "mp-common-mpaudio,mpvoice,mp-miniprogram,mp-common-vote,mp-common-product,mp-common-profile,"
    + "mp-common-music,mp-common-search,mp-common-poi,mp-common-clmusic,"
    + "div.videoWrapper,div[data-node-view-root]";
  var list = [];
  try { list = root.querySelectorAll(SEL); } catch (e) { return; }
  for (var i = 0; i < list.length; i++) {
    var el = list[i];
    if (!el || !el.parentNode) continue;
    // 找「这一坨组件」的最外层：div.videoWrapper / [data-node-view-root] 里面还有 iframe，
    // 从 iframe 往上找一格就够（再多会把整篇段落也卷进来）。
    var host = el;
    var up = el.parentElement;
    if (up && up !== root && up.matches
        && up.matches("div.videoWrapper,div[data-node-view-root]")) host = up;
    var p = host.parentNode;
    if (!p) continue;
    if (p.matches && p.matches("section[nodeleaf]")) continue;   // 已经是原生壳
    // 「看这个视频：<组件>吧」这类**真段落里的内嵌组件**：不许拆段落（拆了文字和组件就分家）。
    // 判据：组件外的文字（父容器文字 − 组件自己的文字）非空 ⇒ 当段落处理，整条跳过。
    var probe = host.parentElement, pg = 0;
    while (probe && probe !== root && pg++ < 3) {
      if (probe.matches && probe.matches("p,span[leaf]")) {
        var allText = String(probe.textContent || "").replace(/[\s\u00a0\u200b\u200c\u200d\ufeff]+/g, "");
        var ownText = String(host.textContent || "").replace(/[\s\u00a0\u200b\u200c\u200d\ufeff]+/g, "");
        if (allText && allText !== ownText) { probe = null; p = null; break; }
      }
      probe = probe.parentElement;
    }
    if (!p) continue;
    // 记下这条包装链（原稿常见 `<p><span leaf><组件></span></p>`）：组件挪走后它们会变空壳，
    // 留着就是一条空行 —— 挪完统一清掉。
    var chain = [], q0 = host.parentElement, gq = 0;
    while (q0 && q0 !== root && gq++ < 4) { chain.push(q0); q0 = q0.parentElement; }
    // 父级若是行内叶（span[leaf]）或段落，说明结构已经坏了：先把组件挪到它们外面
    while (p && p !== root && p.matches && p.matches("span[leaf],span,p")) {
      var pp = p.parentNode;
      if (!pp) break;
      pp.insertBefore(host, p.nextSibling);
      if (p.matches("span[leaf]") && !String(p.textContent || "").replace(/[\s\u00a0\u200b]+/g, "")
          && !p.querySelector("img:not(.ProseMirror-separator)")) {
        pp.removeChild(p);
      }
      p = host.parentNode;
      if (!p) break;
    }
    if (!p) continue;
    if (p.matches && p.matches("section[nodeleaf]")) continue;
    var shell = root.ownerDocument.createElement("section");
    shell.setAttribute("nodeleaf", "");
    p.insertBefore(shell, host);
    shell.appendChild(host);
    // 清掉被搬空的包装层（空 <p> / 空 span[leaf] 都会变成一条空行）
    for (var ci = 0; ci < chain.length; ci++) {
      var c = chain[ci];
      if (!c || !c.parentNode || c === root) continue;
      var txt = String(c.textContent || "").replace(/[\s\u00a0\u200b\u200c\u200d\ufeff]+/g, "");
      var keepImg = c.querySelector && c.querySelector("img:not(.ProseMirror-separator)");
      var keepAny = c.querySelector && c.querySelector("iframe,video,audio,mp-common-video,mp-common-videosnap,mpvideo,mp-common-vote,mp-common-profile,mp-common-search,mp-common-poi,mp-common-clmusic,div.videoWrapper");
      if (!txt && !keepImg && !keepAny) c.parentNode.removeChild(c);
    }
  }
}

function normalizeStructure(root, limit) {
  if (!root) return;
  httpsifyWechatUrls(root);               // 微信图床地址统一 https（http 在 https 页面会被拦）
  stripEditorArtifactsInImageBoxes(root); // 先去掉编辑器占位产物，再按规范修结构
  stripSourcelessImages(root);            // 无源空图（空行 + 删空行会连图删掉，见函数说明）
  fixLeafContainers(root);
  wrapWidgetsInNodeleaf(root);   // 组件要有微信原生壳，否则编辑器会套一层 span[leaf]
  flattenDeepNesting(root, limit || 10);
}

/**
 * 官方规范 4.6「豁免机制」：给节点加 data-ignore-dm 可跳过指定 Dark Mode 规则检测。
 * 荧光标记用渐变做文字底块，会触发「文字背景尽量不要使用渐变」提示 —— 这里补上豁免。
 * 幂等：属性已存在就补规则、不重复添加。编辑器若把属性剥掉了，重排时也会补回来。
 */
function ensureMarkExempt(root) {
  if (!root || !root.querySelectorAll) return;
  var nodes = root.querySelectorAll("[data-bluevibe-mark]");
  for (var i = 0; i < nodes.length; i++) {
    try {
      var cur = String(nodes[i].getAttribute("data-ignore-dm") || "");
      var want = "text-bg-gradient";
      if (cur.split(/\s+/).indexOf(want) >= 0) continue;
      nodes[i].setAttribute("data-ignore-dm", (cur ? cur + " " : "") + want);
    } catch (e) {}
  }
}

/** 展开 root 内所有我们之前套用的外层 section（含嵌套），只留裸内容。 */
function unwrapRootSections(root) {
  var guard = 0;
  while (guard++ < 20) {
    var secs = root.querySelectorAll("section[" + ROOT_MARK + "]");
    if (!secs.length) break;
    for (var i = 0; i < secs.length; i++) {
      var s = secs[i], p = s.parentNode;
      while (s.firstChild) p.insertBefore(s.firstChild, s);
      p.removeChild(s);
    }
  }
}

/**
 * 将 Markdown 转为公众号可直接粘贴的 HTML 字符串。
 * @param {string} md Markdown 源文本
 * @param {object} theme WECHAT_THEMES 中的某个主题
 * @param {object} [opts] 可选覆盖项
 * @param {number} [opts.fontSize] 正文字号(px)
 * @param {number} [opts.lineHeight] 行高倍数
 * @param {number} [opts.letterSpacing] 字间距(px)
 * @param {boolean} [opts.stripFirstH1] 是否去掉开头的第一个 H1（当作标题用）
 */
/**
 * 中文排版规范化（面板「中文排版规范」三个开关；在套用主题 / 清理格式的重排链上生效）
 *
 * 只改**文本**，不碰标签、不碰结构、不碰样式：
 *   space —— 中英文（含数字）之间补一个空格：`用Figma做图` → `用 Figma 做图`
 *   punct —— 中文语境里的半角标点换全角：`你好,世界.` → `你好，世界。`
 *   tidy  —— 连续多个空格收成一个
 *
 * 标点规则刻意保守：只有「前一个字符是汉字」且「后面是汉字 / 结尾 / 空格+汉字」才换，
 * 所以 `他说：Hello, world.` 里的英文标点、`3.5` 里的小数点、`U.S.` 都不会被误改。
 */
var CJK_HAN = "\\u3400-\\u4dbf\\u4e00-\\u9fff\\uf900-\\ufaff\\u3040-\\u30ff";
var CJK_HAN_RE = new RegExp("[" + CJK_HAN + "]");
var CJK_SPACE_L2R = new RegExp("([" + CJK_HAN + "])([A-Za-z0-9])", "g");
var CJK_SPACE_R2L = new RegExp("([A-Za-z0-9])([" + CJK_HAN + "])", "g");
var CJK_HALF_TO_FULL = { ",": "\uff0c", ";": "\uff1b", ":": "\uff1a", "?": "\uff1f", "!": "\uff01", ".": "\u3002" };

function cjkNormalizeText(s, o) {
  if (!s || !o || (!o.space && !o.punct && !o.tidy)) return s;
  var out = String(s);
  if (o.space) {
    out = out.replace(CJK_SPACE_L2R, "$1 $2").replace(CJK_SPACE_R2L, "$1 $2");
  }
  if (o.punct) {
    var buf = "";
    for (var i = 0; i < out.length; i++) {
      var ch = out.charAt(i), full = CJK_HALF_TO_FULL[ch];
      if (!full) { buf += ch; continue; }
      var prev = i > 0 ? out.charAt(i - 1) : "";
      if (!CJK_HAN_RE.test(prev)) { buf += ch; continue; } // 前面不是汉字 → 是英文语境，别动
      var n1 = i + 1 < out.length ? out.charAt(i + 1) : "";
      var n2 = i + 2 < out.length ? out.charAt(i + 2) : "";
      var nextCjk = n1 === "" || CJK_HAN_RE.test(n1) || ((n1 === " " || n1 === "\u3000") && CJK_HAN_RE.test(n2));
      buf += nextCjk ? full : ch;
    }
    out = buf;
  }
  if (o.tidy) {
    out = out.replace(/[ \u3000\t]{2,}/g, " ").replace(/^[ \u3000]+/, "").replace(/[ \u3000]+$/, "");
  }
  return out;
}

/**
 * 在离屏 DOM 上就地规范化正文文本节点。
 *
 * 必须跳过的三类：
 *   1. 代码（pre/code）—— 里面的中英文空格和标点是代码本身；
 *   2. 链接（a）—— 链接文字常是英文标题，改了容易和跳转目标不一致；
 *   3. 文首 / 来源信息 / 文末引导 / 往期回顾 / 布局容器 —— 这几块的内容是用户自己填的
 *      或已排好版的，不属于「正文文字」，改了就是越权。
 */
function normalizeCjkInDom(root, o) {
  if (!root || !o || (!o.space && !o.punct && !o.tidy)) return;
  var doc = root.ownerDocument;
  if (!doc || !doc.createTreeWalker) return;
  var SKIP_TAG = { PRE: 1, CODE: 1, SCRIPT: 1, STYLE: 1, A: 1, TEXTAREA: 1 };
  // 五类「不是正文」的标记块 —— 选择器只有一份（见 NON_BODY_SKIP_SEL：面板那颗
  //「套用到所有正文图」跳过的也是同一套标记）。
  var SKIP_SEL = NON_BODY_SKIP_SEL;
  var texts = [];
  try {
    var walker = doc.createTreeWalker(root, 4, null); // 4 = SHOW_TEXT
    var n;
    while ((n = walker.nextNode())) texts.push(n);
  } catch (e) { return; }
  texts.forEach(function (tn) {
    var p = tn.parentNode;
    if (!p || SKIP_TAG[p.tagName]) return;
    try { if (p.closest && p.closest(SKIP_SEL)) return; } catch (e) {}
    var before = tn.nodeValue;
    if (!before || !/[A-Za-z0-9\u3400-\u9fff]/.test(before)) return; // 纯符号/空白，白跑一趟
    var after = cjkNormalizeText(before, o);
    if (after !== before) tn.nodeValue = after;
  });
}

function markdownToWechat(md, theme, opts) {
  opts = opts || {};

  // 1. 解析 Markdown
  let html = marked.parse(md || "");

  // 2. 装入临时 DOM（bvUpgrade：Markdown 里可能直接嵌着我们自家产物的 HTML）
  const doc = new DOMParser().parseFromString(
    '<div id="root">' + bvUpgrade(html) + "</div>",
    "text/html"
  );
  const root = doc.getElementById("root");

  // 3. 可选：去掉开头的第一个 H1
  if (opts.stripFirstH1) {
    const first = root.querySelector("h1");
    if (first) first.remove();
  }

  // 4. 代码块语法高亮（在打样式之前，替换 code 内部为带颜色 span）
  if (typeof highlightCodeBlocks === "function") {
    highlightCodeBlocks(root);
  }

  normalizeCjkInDom(root, opts.cjk); // 中文排版规范：中英文空格 / 标点 / 多余空格
  normalizeStructure(root); // 官方规范 2.1/2.2/2.3（导入内容常踩，必须在打样式之前修掉）
  // 4.5 语义标签降级为角色标记段落（避免编辑器调和 h1 / 合并短引用）
  demoteSemanticBlocks(root);
  markCodeBlocks(root); // 代码块打角色标记（编辑器可能不保留 <pre> 标签）
  // 标题（一级 / 二级）：按当前变体决定包 / 卸内层色块 span（外层保持块级，两段相邻标题才不会被并成一行）
  // 以及插 / 卸前导图形（井号前缀）。顺序：先内层 span，再前导图形。
  var needH1 = themeNeedsHeadInner(theme), needH2 = themeNeedsHeadInnerH2(theme);
  wrapHeadInner(root, function (lv) { return lv === "h2" ? needH2 : needH1; }, gradAttrFor(theme));
  wrapHeadMarks(root, theme);
  wrapLiText(root);  // 列表文字包内层 span（跟随正文色，前缀仍用主题色）
  wrapListMarkers(root, theme); // 列表前缀做成真实文本（必须在 wrapLiText 之后，见该函数说明）
  ensureMarkExempt(root); // 荧光标记补 data-ignore-dm 豁免（官方规范 4.6）

  // 5. 递归打内联样式（字号/行距/字间距由面板参数覆盖到文本类样式）
  applyStylesRecursive(root, inheritTypography(theme, opts));
  // 组件（视频号 / 公众号视频 / 音频 / 小程序 / SVG 组件）的 40px 上下留白 ——
  // 必须在打样式之后：块壳先被套成正文段（16px），再被这里改成 40px。
  applyWidgetSpacing(root);
  // 巨大句号：必须在 applyStylesRecursive **之后** —— 它自己带内联样式，先包的话会被
  // 样式回填补上一堆正文属性（行高 / 字号都被盖掉，放大就失效了）。
  decoratePunct(root, (theme.styles || {}).punct);
  // 段首标点悬挂（2026-10-21）：`《「（` 这类左侧留白的标点顶到版心左边缘。
  // 放在 decoratePunct 之后：那颗巨大句号已经换过字符，这里的首字判断才准。
  hangLeftPunct(root, !!(opts.cjk && opts.cjk.hang));
  fixCaptionImageGap(root); // 图下有图释 → 这张图的下边距收到 10
  fixImageRunGaps(root);    // 连续的几张图：组内间距收到 10（2026-10-24 用户口径）

  // 6. 构造外层 section（携带正文字体/字号/行距/字距等全局样式），打标记供幂等解包
  const section = doc.createElement("section");
  section.setAttribute(ROOT_MARK, "1");
  section.setAttribute("data-bluevibe-editor", "蓝调排版");
  const sectionStyle = Object.assign({}, theme.styles.section);
  applySectionTypography(sectionStyle, opts);
  // 用户在编辑器里设的对齐（居中/居右）要跟着走，不能被主题默认值盖掉
  if (opts.textAlign) sectionStyle.textAlign = opts.textAlign;
  section.setAttribute("style", styleToCss(sectionStyle));
  section.innerHTML = root.innerHTML;

  return section.outerHTML;
}

/**
 * 归一化后台「已发布文章列表」接口返回。兼容两种接口：
 *   · appmsgpublish（新）：publish_page.publish_list[].publish_info 是 JSON 字符串
 *   · appmsg?action=list_ex（旧）：app_msg_list[]
 * 返回 [{ title, link, cover }]
 */
/* ────────────────────────────────────────────────────────────────
   封面比例：微信一篇文章同时有好几张封面，字段名带比例后缀 ——
     · `cdn_url_1_1`   / `CoverImgUrl_1_1`    = **1:1 方形封面**
     · `cdn_url_235_1` / `CoverImgUrl_235_1`  = **2.35:1 首图**
     · 另有 `CoverImgUrl_16_9` / `coverimgurl_3_4` 等
   列表接口给的 `cover` 是**方形**那张（①的 104×76 近方形缩略图裁一下看不出来，
   ③满宽一铺就露馅了 —— 用户 2026-09-25 反馈）。③ 要用 2.35:1 的那张。

   ⚠️ **不要写死某一个字段名**：raw 里见过 `cdn_url_235_1` / `CoverImgUrl_235_1` /
   `cover_235_1` / `cdn_url_235x1` 等写法，且有的版本把它塞在 `SuggestedCoverImg` 里、
   只用 `width_hint: 235 / height_hint: 100` 标比例。所以一律**按键名的 235 特征找**，
   找不到就**回落到 `cover`** —— 宁可还是方形，也绝不让卡片少一张图。
   ──────────────────────────────────────────────────────────────── */

/** 从一篇文章对象里挑「2.35:1 封面」的地址；挑不到返回 ""（由调用方回落 cover） */
function pickCover235(o) {
  if (!o || typeof o !== "object") return "";
  var isUrl = function (v) { return typeof v === "string" && /^https?:\/\//i.test(v); };
  var keys = Object.keys(o), i, v;
  // ① 键名里带 235 的（大小写、下划线 / 连字符 / 无分隔都算）
  for (i = 0; i < keys.length; i++) {
    if (/235/.test(keys[i]) && isUrl(o[keys[i]])) return o[keys[i]];
  }
  // ② 嵌一层的对象里带 width_hint / height_hint（微信的 SuggestedCoverImg 就这么标）
  for (i = 0; i < keys.length; i++) {
    v = o[keys[i]];
    if (!v || typeof v !== "object" || Array.isArray(v)) continue;
    var hw = Number(v.width_hint != null ? v.width_hint : v.widthHint);
    var hh = Number(v.height_hint != null ? v.height_hint : v.heightHint);
    if (hw > 0 && hh > 0 && Math.abs(hw / hh - 2.35) < 0.12) {
      var u = v.url || v.cdn_url || v.cover;
      if (isUrl(u)) return u;
    }
  }
  // ③ 最后兜一层：值本身就是带 235 的图床地址（有的版本把比例编在 URL 路径里）
  for (i = 0; i < keys.length; i++) {
    v = o[keys[i]];
    if (isUrl(v) && /235/.test(v) && /mmbiz|qpic/i.test(v)) return v;
  }
  return "";
}

/** 从「二次编码的 JSON 字符串」里按「键名含 235」抓值（走不到结构化解析时的兜底层） */
function allRxKeyLike235(str) {
  var out = [], m;
  var re = new RegExp('"([A-Za-z0-9_]*235[A-Za-z0-9_]*)"\\s*:\\s*"((?:[^"\\\\]|\\\\.)*)"', "gi");
  while ((m = re.exec(str || "")) !== null) out.push(m[2]);
  return out;
}

function normalizePublished(data) {
  var items = [];
  if (!data || typeof data !== "object") return items;
  // 保留未解析的原文，最后一层兜底要用
  var rawPage = typeof data.publish_page === "string" ? data.publish_page : "";
  // 关键：后台返回的 publish_page 是「二次编码的 JSON 字符串」，要再 parse 一次
  if (typeof data.publish_page === "string") {
    try { data = Object.assign({}, data, { publish_page: JSON.parse(data.publish_page) }); } catch (e) {}
  }
  function push(o) {
    if (!o || !o.title) return;
    var d = o.date || o.create_time || o.update_time || o.time || o.pub_time;
    // appmsgid / itemidx / 发布时间：**只为「往期回顾读阅读量」而留**。
    // 单篇数据接口要 msgid（= appmsgid_itemidx）与 publish_date（由发布时间折算），
    // 列表接口本身不带阅读数，只能拿着这两样逐篇去问（见 background 的 fetchReadStat）。
    // 只有「结构化解析」这条路拿得到；deepCollect / 正则兜底拿不到 → 那些行不显示阅读量。
    items.push({ title: String(o.title), link: o.link || "", cover: o.cover || "",
                 cover235: o.cover235 || "", date: d || "",
                 appmsgid: (o.appmsgid == null ? "" : String(o.appmsgid)),
                 itemidx: (o.itemidx == null ? "" : String(o.itemidx)) });
  }
  // 深挖兜底：不管标题藏在多少层里，递归找出所有带 title 的对象
  function deepCollect(node, out, depth) {
    if (!node || typeof node !== "object" || depth > 8) return;
    if (Array.isArray(node)) {
      node.forEach(function (n) { deepCollect(n, out, depth + 1); });
      return;
    }
    var t = node.title || node.appmsg_title || node.article_title || node.name;
    if (t && typeof t === "string" && t.length) {
      out.push({
        title: t,
        link: node.link || node.content_url || node.url || node.content_url_1 || "",
        cover: node.cover || node.cover_img || node.cover_url || node.pic || node.picurl || "",
        cover235: pickCover235(node),
        date: node.create_time || node.update_time || node.time || node.pub_time,
        appmsgid: node.appmsgid, itemidx: node.itemidx,
      });
      return; // 已取到就不再深入，避免重复
    }
    Object.keys(node).forEach(function (k) { deepCollect(node[k], out, depth + 1); });
  }

  // 兜底：直接按顺序抽 key（有些版本 publish_info 内部结构不固定，JSON 解析路线拿不到）
  function allRx(s, key) {
    var out = [], re = new RegExp('"' + key + '"\\s*:\\s*"((?:[^"\\\\]|\\\\.)*)"', "g"), m;
    while ((m = re.exec(s || "")) !== null) out.push(m[1]);
    return out;
  }

  var page = data.publish_page || data;
  var list = (page && page.publish_list) || data.publish_list || [];
  (list || []).forEach(function (p) {
    var rawInfo = (p && typeof p.publish_info === "string") ? p.publish_info : "";
    var info = p && p.publish_info;
    if (typeof info === "string") { try { info = JSON.parse(info); } catch (e) { info = null; } }
    var got = 0;
    if (info) {
      // 注意：空数组 [] 在 JS 里是「真值」，不能用 || 串联，否则 appmsg_info 为空时
      // 永远不会回落到 appmsgex（type=9 群发就常出现 appmsg_info 为空、数据在 appmsgex）
      var cands = [info.appmsg_info, info.appmsgex, info.appmsg_list, info.article_info];
      var apps = [];
      for (var ci = 0; ci < cands.length; ci++) {
        var c = cands[ci];
        if (Array.isArray(c) ? c.length > 0 : (c && typeof c === "object")) {
          apps = Array.isArray(c) ? c : [c];
          break;
        }
      }
      // 单图文群发时，有的版本把比例封面挂在 publish_info 这一层而不是文章对象上 ——
      // 只有「这一波就一篇文章」时才敢这么回落（多图文下这个字段对不上是哪一篇）。
      var info235 = (apps.length === 1) ? pickCover235(info) : "";
      apps.forEach(function (a) {
        if (!a || !a.title) return;
        push({
          title: a.title,
          link: a.content_url || a.link || a.url || "",
          cover: a.cover || a.cover_img || a.cover_url || "",
          cover235: pickCover235(a) || info235,
          date: a.create_time || a.update_time || a.time || a.pub_time,
          appmsgid: a.appmsgid,
          itemidx: a.itemidx,
        });
        got++;
      });
      if (!got && info.title) {
        push({ title: info.title, link: info.content_url || info.link || "",
               cover: info.cover || "", cover235: pickCover235(info),
               date: info.create_time || info.update_time,
               appmsgid: info.appmsgid, itemidx: info.itemidx });
        got++;
      }
    }
    if (!got && info) {
      var deep = [];
      deepCollect(info, deep, 0);
      deep.forEach(function (d) { push(d); got++; });
    }
    if (!got && rawInfo) {
      var titles = allRx(rawInfo, "title");
      var links = allRx(rawInfo, "link").concat(allRx(rawInfo, "content_url"));
      var covers = allRx(rawInfo, "cover");
      var covers235 = allRxKeyLike235(rawInfo);
      for (var i = 0; i < titles.length; i++) {
        push({ title: titles[i], link: links[i] || "", cover: covers[i] || "",
               cover235: covers235[i] || "" });
        got++;
      }
    }
    if (!got && p && p.title) {
      push({ title: p.title, link: p.link || p.content_url || "", cover: p.cover || p.cover_img || "" });
    }
  });
  ((data && data.app_msg_list) || []).forEach(function (a) {
    push({ title: a.title, link: a.link || a.content_url || "", cover: a.cover || "",
           cover235: pickCover235(a) });
  });

  // 最后一层兜底：前面的结构化解析全落空时，直接对整段原文做全局正则，
  // 抓出所有标题、/s/ 文章链接与 mmbiz 封面图，按顺序配对。
  if (!items.length && rawPage) {
    // 同样要先还原转义引号，否则 /"title"/ 匹配不到
    var flatPage = rawPage.replace(/\\"/g, '"');
    var unesc = function (s) { return String(s || "").replace(/\\+\//g, "/"); };
    var ts = allRx(flatPage, "title");
    var ls = allRx(flatPage, "link");
    var cs = allRx(flatPage, "cover");
    var cs235 = allRxKeyLike235(flatPage);
    for (var i = 0; i < ts.length; i++) {
      push({ title: unesc(ts[i]), link: ls[i] || "", cover: cs[i] || "", cover235: cs235[i] || "" });
    }
  }
  return items;
}

/* ────────────────────────────────────────────────────────────────
   往期回顾：三套「插入正文」的样式
   ────────────────────────────────────────────────────────────────
   ① thumb  图文 · 缩略图（原有形态）：左文右图 104×76，每条一张浅灰卡
   ② text   纯文字 · 索引（新增）：整块一个浅灰容器 + 序号 + 标题 + 日期，完全不用图
   ③ big    大图（新增）：封面满宽在上、文字在下，按封面原比例 2.35:1 自适应

   三套共用同一句栏目头文案与同一套文字规格，只有「条目怎么排」不同 ——
   所以换样式不会牵动别的东西。栏目头按样式各做了一点区分
   （实心色块 / 荧光底 / 两侧装饰线），但颜色一律取当前主题主色 themeMainColor，
   换主题色三套一起变。
*/

/** 样式名归一：不认识的（含老调用传进来的数字）一律回退到原有样式 */
var REVIEW_STYLES = ["thumb", "text", "big"];
function normalizeReviewStyle(k) {
  return REVIEW_STYLES.indexOf(k) >= 0 ? k : "thumb";
}

/** #RGB / #RRGGBB / rgb() → [r,g,b]；解析不出来给主题蓝 */
function hexRgb(hex) {
  var c = String(hex || "#0052FF");
  var m6 = /^#?([0-9a-f]{6})$/i.exec(c);
  if (m6) { var n = parseInt(m6[1], 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  var m3 = /^#?([0-9a-f]{3})$/i.exec(c);
  if (m3) {
    var h = m3[1];
    return [parseInt(h[0] + h[0], 16), parseInt(h[1] + h[1], 16), parseInt(h[2] + h[2], 16)];
  }
  var mr = /rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/i.exec(c);
  if (mr) return [+mr[1], +mr[2], +mr[3]];
  return [0, 82, 255];
}

/**
 * 主题色块上的可读字色。
 * 主题色是用户自己挑的（取色器能给任意颜色），浅色底上白字会直接看不见
 * （例如 #FFD400 上白字只有 1.2:1），所以按感知亮度分流：
 * ≥150 给墨色、否则给白色（150 ≈ WCAG 3:1 大字号的分界）。
 * 感知亮度 = 0.299R + 0.587G + 0.114B（与官方暗色算法同一口径）。
 *
 * ⚠️ 这个 150 是**「色块上的白字」那一条线**（ACCENT_TEXT_MIN_PB），与「主题色自己当墨」
 *    那一条（ACCENT_INK_MIN_PB = 190）是两回事 —— 别看着 190 就把这里也改上去：
 *    150~190 这段色块上的白字只有 1.9:1，正是第五轮专门修掉的「看不清」。
 *
 * ⚠️ 判据的**唯一来源是 themes.js 的 textOnAccent** —— 这里只做委托。
 *    themes.js 与 converter.js 同属一个隔离世界、顶层函数共用一个作用域，
 *    所以绝不能两边各写一份同名函数（后加载的会**悄悄覆盖**前一个）。
 *    本地这份只是 converter.js 被单独加载（测试里）时的兜底，两边口径必须一致。
 */
function onAccentText(hex) {
  if (typeof textOnAccent === "function") return textOnAccent(hex);
  var c = hexRgb(hex);
  var b = c[0] * 0.299 + c[1] * 0.587 + c[2] * 0.114;
  return b >= 150 ? "#242A26" : "#FFFFFF";
}

/**
 * 微信 CDN 的地址末段是「要多少宽」：`/0` = 原图，`/640` / `/300` / `/132` 是档位。
 * ③ 大图要满宽铺（编辑器正文列宽约 677px），拿到 `/300` 这种会糊 ——
 * **只在「比 640 小」时升到 `/640`**，不动 `/0`（原图可能好几 MB，一屏 20 张会拖慢），
 * 也不动已经 ≥640 的。非图床地址（占位图 / 本地路径 / 别的域名）原样返回。
 */
function wxImgUpgrade(url) {
  if (typeof url !== "string" || !/^https?:\/\/[^/]*mmbiz\./i.test(url)) return url;
  return url.replace(/\/(\d{1,4})(\?|$)/, function (m, n, tail) {
    var w = parseInt(n, 10);
    return (w > 0 && w < 640) ? "/640" + tail : m;
  });
}

/**
 * 生成「往期回顾」卡片：每条 = 封面缩略图 + 标题（整条可点，跳原文）
 * @param {Array} items [{title, link, cover, date}]
 * @param {object} theme 当前主题
 * @param {string} [styleKey] "thumb"(默认) | "text" | "big"，三套插入样式
 */
function buildReviewHtml(items, theme, styleKey) {
  var style = normalizeReviewStyle(styleKey);
  // 主色只从 themeMainColor 取（= theme.accent）。**绝不要再从 styles.h2.color 取** ——
  // 合并标题表之后默认变体的 h2.color 是白色，取它栏目头会整块变白（见 themes.js 说明）。
  var main = (typeof themeMainColor === "function") ? themeMainColor(theme)
    : ((theme && theme.accent) || "#0052FF");
  // 卡片里「当字色用」的那一版（淡色主题色自动压深，2026-09-30 淡色主题色）。
  // ⚠️ 卡片内部三种落点必须分开：**文字**（栏目头字 / 中央短横 / 序号）走 ink；
  //    **铺底**（thumb 那个实心色块 + 它上面的 onAccentText 字色、text 样式的 10% 浅底）走原色。
  //    卡片本身的底是白 / 浅灰（#F5F5F5 那一档），所以按纸白算 —— 不必传底色。
  var mainInk = (typeof accentInk === "function") ? accentInk(main, "") : main;
  // 栏目头的「浅底」：与标题变体的 {soft} 令牌**同一条规则** ——
  // 淡色主题色下 10% 透明等于没有（#FFD400 的 10% 在白卡上与白卡无异），直接用原色。
  // 见 themes.js 的 h1PaletteOf 里那段「淡版令牌」说明。
  var mainSoft = (typeof accentIsPale === "function" && accentIsPale(main)) ? main : hexToRgba(main, 0.10);

  // 缩略图圆角：**固定 4px，不跟「图片圆角」滑杆走**。
  // 那个滑杆是给正文配图用的；卡片缩略图跟着滑杆一起变圆角会很突兀（用户反馈）。
  var radius = "4px";
  // 日期色：原来写 #9AA2B6，压在浅灰卡 #F5F5F5 上只有 2.34:1（12px 小字要 4.5:1）。
  // #474F5E 是同时过「亮卡 / 亮页 / 暗卡 / 暗页」四种生效底的那个
  // （7.56 / 8.24 / 5.43 / 6.07，按 wechatjs/mp-darkmode v1.2.2 实算）。
  var DATE_COLOR = "#474F5E";
  var TITLE_COLOR = "#2B3040";
  var HEAD_TEXT = "大家都在看";
  // 时间戳 -> "YYYY-MM-DD"；没时间戳就空字符串
  function fmtDate(ts) {
    if (!ts) return "";
    var d = new Date(ts > 1e12 ? ts : (ts * 1000));
    if (isNaN(d.getTime())) return "";
    return d.toISOString().slice(0, 10);
  }
  function escT(v) {
    return String(v == null ? "" : v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // ── 栏目头：三套各有一点区分，颜色一律取主题主色 ──
  function headerHtml() {
    if (style === "text") {
      // 居中 + 加粗 + 荧光底。底用**主题色的低透明度**而不是不透明浅色块：
      // 不透明浅色在暗色下会被官方算法钳到亮度 190（中浅灰浮岛），主题色字压上去就糊了；
      // 半透明会随背景一起变暗，两端都成立。
      // α 取 0.10（= 引用块浅底 {soft} 那个值，也就是「主题色下引用板块的颜色」），
      // **不是**荧光标记的 0.22：实算过 0.22 的底上主题色字只有 4.05:1，
      // 15px 加粗要 4.5:1；0.10 是 4.94:1，暗色端 7.42:1。
      return '<p style="text-align:center;margin:0 0 14px;">'
        + '<span style="display:inline-block;background:' + mainSoft
        + ';color:' + mainInk + ';font-size:15px;font-weight:700;letter-spacing:0.5px;padding:5px 16px;">'
        + HEAD_TEXT + '</span></p>';
    }
    if (style === "big") {
      // 居中 + 两侧对称短线（装饰线用主题色的色块：background，暗色下不被放大）。
      //
      // ⚠️ 装饰线里**必须塞一个可见字符（em dash）**，不能是空 span ——
      // 时间：2026-09-25 用户真机反馈「预览里两根线有，插进正文就没了」。
      // 原因：插入走的是「合成 paste 事件 → 微信 ProseMirror 自己的解析管线」，
      // PM 是**按内容建节点**的 —— 一个只有样式、没有任何内容的 <span> 没有节点可承载，
      // 解析时直接丢掉。所以凡「纯装饰、无文字」的内联元素都活不过插入。
      // 反证：① 的 ▼ 是个字符、② 的荧光底 span 里有文字 → 都活着，只有 ③ 的线消失。
      // 与本文件 wrapHeadMarks（前导图形）是同一条约束：伪元素不可用，装饰只能是**带内容的真元素**。
      //
      // 字符用 em dash（&#8212;）而不是 &nbsp;/零宽：后两者都会被当「空白」清掉
      //（本文件清理流程与部分编辑器都把纯空白 span 视作空元素），零宽空格还会触发行高误报。
      // 靠 font-size:0 让它不可见 —— 盒子仍是 26×2 的主题色块。
      //
      // ⚠️ 行高必须写成**具体像素值 2px**，不能省、更不能写 0 ——
      //   时间：2026-09-25，用户真机插入时被微信编辑器报「行间距（line-height）设置较小，
      //   多行文本可能存在重叠，请核实阅读效果是否正常（参考文档 #2.3.2 line-height-overlapping）」。
      //   查过官方校验器（wechatjs/verify-article-structure-spec 的 engine/rules/line-height.ts）：
      //   · 「有文字」的元素**一律**进体检（只有「没文字 + line-height:0」才豁免，那条是给无缝拼图留的），
      //     盒子里塞了 em dash 就算「有文字」，所以它必然被查；
      //   · 体检第一条规则（Rule A）= **计算后的 line-height 等于 0 就判重叠**。
      //   于是「省掉行高声明」根本不够：正文的行高是无单位倍数（1.75），本盒 font-size:0
      //   → 计算出来仍是 0px → 照样报（本机跑官方 CLI 复现过：改前红、只删声明仍红）。
      //   写死 `line-height:2px` 才落成非零像素值，规则不再有话说；盒子高度本来就由 height:2px 定死，
      //   行高不是这里的布局因素（实测栏目头高度 23.4px 分毫未变）。
      // 本机复跑官方 CLI：改前 1 条违规（就是这根线）、改后 isValid：true。
      // 万一哪天 font-size:0 被环境剥掉，退化成一根 em dash，仍是「装饰线」，不会难看。
      var rule = '<span style="display:inline-block;width:26px;height:2px;background:' + mainInk
        + ';font-size:0;line-height:2px;vertical-align:middle;">&#8212;</span>';
      return '<p style="text-align:center;margin:0 0 16px;">' + rule
        + '<span style="display:inline-block;color:' + mainInk + ';font-size:15px;font-weight:700;'
        + 'letter-spacing:1px;margin:0 12px;vertical-align:middle;">' + HEAD_TEXT + '</span>'
        + rule + '</p>';
    }
    // thumb：左对齐实心色块 + 倒三角（原有形态），底色改为跟随主题色
    return '<p style="background:' + main + ';color:' + onAccentText(main)
      + ';padding:7px 14px;display:inline-block;font-size:15px;font-weight:700;letter-spacing:0.5px;'
      + 'margin:0 0 14px;">' + HEAD_TEXT + ' &#9660;</p>';
  }

  var out = [];
  out.push('<section data-bluevibe-review="1" data-bluevibe-review-style="' + style
    + '" style="margin:34px 0 10px;">');
  out.push(headerHtml());

  var rows = [];
  (items || []).forEach(function (it, idx) {
    var last = idx === (items.length - 1);
    var title = escT(it.title);
    var date = fmtDate(it.date);
    var href = it.link || "";

    // 标题：放在 <p> 里、链接包在 <p> 内部。
    // 不要把两行截断样式挂到 <a> 上 —— 编辑器会重写文章链接（换 class、加图标），
    // 挂在链接上的样式容易被冲掉。
    //
    // ① 的标题**固定占两行高**（15px × 1.55 × 2 ≈ 46px）：文字块要与右侧 104×76 的缩略图
    // 对齐，不定高的话 1 行标题与 2 行标题会把日期顶到不同位置、多条之间看着像时间错位。
    // ② ③ 没有图要对齐，就**不要**再按两行预留（否则 1 行标题底下会空出一块 23px 的白）：
    // 走 line-height:23px 自适应，1 行 23px、两行恰好 46px。
    var titlePThumb =
      '<p style="margin:0;font-size:15px;line-height:1.55;color:' + TITLE_COLOR + ';overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;height:46px;">' +
        '<a href="' + href + '" style="color:' + TITLE_COLOR + ';text-decoration:none;">' + title + "</a>" +
      "</p>";
    var titlePFree =
      '<p style="margin:0;font-size:15px;line-height:23px;color:' + TITLE_COLOR + ';overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;">' +
        '<a href="' + href + '" style="color:' + TITLE_COLOR + ';text-decoration:none;">' + title + "</a>" +
      "</p>";
    var dateP = date
      ? '<p style="margin:0;font-size:12px;color:' + DATE_COLOR + ';line-height:16px;">' + date + "</p>"
      : "";

    if (style === "text") {
      // 序号用主题色（亮卡 5.28:1；暗色下算法把它提亮到 #0079FF，对暗卡 3.88:1）
      rows.push('<section style="padding:11px 0;display:flex;align-items:flex-start;">'
        + '<span style="flex:0 0 26px;font-size:13px;font-weight:600;line-height:23px;color:' + mainInk + ';">'
        + ("0" + (idx + 1)).slice(-2)
        + "</span>"
        + '<section style="flex:1;min-width:0;">' + titlePFree + dateP + "</section>"
        + "</section>");
      return;
    }

    if (style === "big") {
      // ③ 大图 · 标题压图（v2.48.4 起；v2.48.5 把布局挪到链接上 → 整卡可点；
      //    v2.48.6 圆角改成两层同值）。
      // 整条 = 一张 2.35:1 的首图 + 底部渐变压字，**不带日期**。
      //
      // 目标：**整张卡片看上去就是封面图的原生比例 2.35:1**，标题压在下半部分。
      // 结构：外层背景图 + 内层文档流渐变块 —— 微信不认 position:absolute / 负 margin，
      // 照片只能由背景承载（外部排版工具的横滑多图正是这么带图的）。
      //
      // ⚠️ 布局内边距挂在**文字链接 <a> 自己**身上（v2.48.5 起），不挂在 <section> 上。
      //   原因：`<a>` 的可点区域 = 它自己的 border box（**含 padding**）。把图区那 28% 做成 <a> 的
      //   `padding-top`，整张卡（含照片）就都进了链接热区；挂在 <section> 上则链接盒子只剩文字那一条
      //   → 真机反馈「图片上好像没法点链接」。
      //   为什么非得用**百分比** padding：它是唯一能表达「高度跟着宽度走」的手段
      //   （absolute / 负 margin 微信不认；height 的百分比在 auto 高度父盒里等于 auto）。
      //   证据（改之前先看这条，别推倒）：用户贴回的**保存后产物**里，我们 <a> 的
      //   `text-decoration:none;display:block` 一字不差地活在微信生成的文字链接上，且**没有**出现
      //   编辑器 UI 亲手建链接时注入的 `margin:0;padding:0;outline:0` 那套重置 ⇒ 粘贴进去的链接，
      //   作者内联样式是保留的。官方仓库 wechatjs/verify-article-structure-spec 的真实文章样本也印证：
      //   作者自定义 `font-family` 的链接完整活到了发布页。
      //   整卡高 = 顶部内边距 + 底部内边距(14px) + 标题(2 行 × 22px = 44px)
      //     → 要「整卡 = 宽 ÷ 2.35」→ 顶部内边距应为 42.5%×宽 − 58px，但**微信会把 calc() 整条丢掉**
      //     （真机实测：产物里 `padding-top:calc(42.5% - 58px)` 不见、只剩 28%）→ **只写 28%**：
      //     它正是「手机正文列宽 ≈402」时那道算式的解，实测 402 宽 = **2.357:1** ≈ 原生 2.35；
      //     375 / 414 / 677 宽分别是 2.301 / 2.381 / 2.735（宽容器偏扁，因为 58px 文字带占比变小）。
      //     **别再写 calc** —— 它活不到真机，只会让本插件预览页与真机不一致、反把调参带偏。
      //   （复盘：v2.48.3 只写 42.5%、漏了减文字带 → 真机 402 宽量出 1.72:1，用户「看着有点高」。）
      // 封面 `background-size:cover`：整卡已是 2.35:1、封面也是 2.35:1 → 正好铺满，不裁不变形。
      //
      // 遮罩（scrim）三条硬约束，改之前先读 —— 都是实算出来的，不是审美取舍
      //（推导见 docs/效果图/蓝调-大图压图效果图.html：官方算法 wechatjs/mp-darkmode + WCAG）：
      // ① 只能用**中性墨色**，不能用主题色：橙 #E4572E / 绿 #1FA971 即使 α=1.0 也只有
      //    3.68 / 3.01:1，白字压上去结构性不达标。
      // ② 文字带（最底 34%，两行 16px 标题恰好全落在里面）保持 α≈0.60~0.62 → 近白图上白字 5.02:1
      //    （16px 正文级要 4.5:1）；再往上到 56% 就渐隐到 0。
      //    v2.48.3 是 0.78 → 0.70 一路拖到 100%（整张照片都蒙一层灰），
      //    用户要「遮罩只占一半高度、再淡一些」—— 于是改成「下半段平台 + 56% 处收干净」。
      // ③ 遮罩必须走 `background-image` 渐变（**不是** background-color）：官方暗色算法只重算
      //    color / background-color / border-color，`background-image` 原样保留；白字亮度 255 ≥ 250
      //    也被原样保留 → 暗色端同样稳。外层那个 background-color 只是「万一背景图没活过编辑器」的
      //    兜底深底（#0B0E14 亮度 13.8，远低于会触发算法改写的 190），不参与压字对比度。
      // 渐变当文字背景会撞规范 4.1.2「文字背景尽量不要使用渐变」→ 内外两层都补 data-ignore-dm。
      //
      // 标题 = 16px / 常规字重 / 行高 22px / 字距 0.5px。用户原话：「文字有点粗，字体间距也可以小一点，
      // 标题要么改成 16 吧和正文一样，不要加粗」—— 字距**必须显式写**：不写就继承正文那一档（实测 ≈1px）。
      //
      // ⚠️ 整条**只允许一个 <a>**（HTML 解析器不允许 <a> 嵌套，里层再写一个会把外层提前闭合、
      //   预览当场散架）—— 所以这一个 <a> 现在**直接包标题文字**，顺带承担卡片的布局内边距。
      //   v2.48.4 及以前是拿一个**块级 <a> 包住整个 <section>**，那个写法是**白写的**：微信保存时会把
      //   块级 <a> 拆掉、把链接降级成段落内的「文字链接」（`mp_article_text_link` / `linktype="text"`），
      //   于是只有标题文字可点 —— 这就是「图片上没法点链接」的根因。现在直接写在微信想要的位置，
      //   少一次改写，行为更可预测。
      var bigCover = it.cover235 || it.cover;
      if (!bigCover) {
        // 老数据 / 接口没给封面 → 不留空图位，退化成一行标题（宁可少张图，也绝不少内容）
        rows.push('<section style="margin:' + (last ? "0" : "0 0 20px") + ';">'
          + '<p style="margin:0;font-size:16px;line-height:22px;letter-spacing:0.5px;color:' + TITLE_COLOR
          + ';overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;">' + title + "</p>"
          + "</section>");
        return;
      }
      var SCRIM_RGB = "11,14,20";   // 中性墨 #0B0E14
      var SCRIM_A = 0.62;           // 文字带最下沿的强度（兜底底色也用它）
      var scrimStyle = "background-image:linear-gradient(to top,"
        + "rgba(" + SCRIM_RGB + "," + SCRIM_A + ") 0%,"
        + "rgba(" + SCRIM_RGB + ",0.60) 33%,"
        + "rgba(" + SCRIM_RGB + ",0.24) 46%,"
        + "rgba(" + SCRIM_RGB + ",0) 56%);";
      // 卡片的几何（28% 图区 + 16px 左右内缩 + 14px 底边距）**全部由这个 <a> 承担** → 整卡可点。
      var CARD_PAD = "padding:28% 16px 14px;";
      // ⚠️ 圆角必须**两层都写**：`border-radius` 只裁自己那层的背景，**不裁子元素**
      //   （除非这层带 `overflow:hidden`）。内层渐变是「照片之上的另一层」，
      //   只给外壳写圆角的话，渐变会带着方角盖住照片的下圆角 ——
      //   上半部分因渐变 α=0 看不出来，下半部分浓了就成了「上圆下方」
      //   （用户真机反馈：「图片似乎是有圆角，但是下面……看起来是方的」）。
      //   故：① 两层同值圆角（内层那 4px 是自己那层渐变的圆）；
      //       ② 外壳再补 `overflow:hidden` 兜底（万一内层圆角被洗掉，仍被裁圆）。
      rows.push('<section style="margin:' + (last ? "0" : "0 0 20px") + ';">'
        + '<section data-ignore-dm="text-bg-gradient" style="width:100%;'
        + "background-color:rgba(" + SCRIM_RGB + "," + SCRIM_A + ");"
        + "background-image:url(" + wxImgUpgrade(bigCover) + ");background-size:cover;"
        + "background-position:center center;border-radius:" + radius
        + ";overflow:hidden;" + '">'
        + '<section data-ignore-dm="text-bg-gradient" style="' + scrimStyle
        + "border-radius:" + radius + '">'
        + '<p style="margin:0;font-size:16px;line-height:22px;font-weight:400;letter-spacing:0.5px;'
        + 'color:#FFFFFF;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;">'
        + '<a href="' + href + '" style="text-decoration:none;display:block;color:#FFFFFF;' + CARD_PAD + '">'
        + title + "</a></p>"
        + "</section></section></section>");
      return;
    }

    // thumb（原有样式，结构未改）
    // 缩略图：外层用 <a> 包住，图片本身也能点击跳转（此前只有标题带链接，点图没反应）。
    var imgA = it.cover
      ? '<a href="' + href + '" style="text-decoration:none;">'
          + '<img src="' + it.cover + '" style="width:104px;height:76px !important;max-width:100%;object-fit:cover;border-radius:' + radius + ';display:block;background-color:transparent;">'
        + "</a>"
      : "";
    // 两列布局：**用 flex（float + text-wrap 会被编辑器重新解析破坏，flex 实测能完整存活）**。
    //
    // 之前用「图片右浮动 + 文字环绕」，被公众号编辑器（ProseMirror）重新解析后会被打断：
    // 浮动元素被塞进 <span leaf>、标题被拆进独立的 <p>，环绕关系丢失 → 标题掉到图片下方。
    // 两列卡片用 flex（文字列 flex:1 + 固定尺寸图），实测在编辑器里能完整存活
    //（我们代码里「flex 会被微信清洗掉」的老判断是错的，被清洗的其实是 float 环绕）。
    var row =
      '<section style="width:100%;display:flex;justify-content:space-between;align-items:center;">' +
        '<section style="margin-right:12px;flex:1;">' + titlePThumb + dateP + "</section>" +
        imgA +
      "</section>";
    rows.push('<section style="padding:10px 12px;min-height:76px;border-radius:4px;background:#F5F5F5;margin:0 0 10px;">'
      + row
      + "</section>");
  });

  if (style === "text") {
    // 整块**一个**浅灰容器，不是 N 张卡：重复条目用 N 张圆角卡会多出 2N 条圆角与间隙，
    // 视觉噪声比信息还多。
    out.push('<section style="padding:4px 12px;border-radius:4px;background:#F5F5F5;">'
      + rows.join("") + "</section>");
  } else {
    out.push(rows.join(""));
  }
  out.push("</section>");
  return out.join("");
}

/**
 * 智能排版「编辑器现有正文」：
 *   · 若正文内容是 Markdown 文本（含 # 标题 / - 列表 / > 引用 / ``` 等），先识别转换成结构再套主题；
 *   · 若是普通富文本（已是 h1/p/ul 等标签），直接按标签套主题（restyleHtml）。
 * 返回可插入的 HTML 字符串。
 */
function bodyToStyled(html, theme, opts) {
  opts = opts || {};
  // 只换颜色：直接走重排，跳过下面所有步骤。
  // 一旦走 Markdown 重新生成，等于整篇重建 —— 用户在编辑器里设的对齐、段间距、
  // 手动调过的东西会被主题默认值冲掉。改主题色必须只改颜色，其它一律不动。
  if (opts.colorsOnly) return restyleHtml(html, theme, opts);

  const doc = new DOMParser().parseFromString('<div id="root">' + bvUpgrade(html) + "</div>", "text/html");
  const root = doc.getElementById("root");
  // 必须在这里（解包之前）接住对齐：bodyToStyled 自己也会解包一次，
  // 等进了 restyleHtml 再取就找不到旧容器了。
  const keepAlign = opts.textAlign || pickRootAlign(root);
  const outOpts = keepAlign ? Object.assign({}, opts, { textAlign: keepAlign }) : opts;
  unwrapRootSections(root); // 幂等：先解包自己之前套的外层 section

  // 收集每个块的纯文本行（<br> 视为换行），section/div 包装自动解包
  const lines = [];
  function textOf(el) {
    let t = "";
    el.childNodes.forEach(function (n) {
      if (n.nodeType === 3) t += n.nodeValue;
      else if (n.nodeType === 1) t += (n.tagName.toLowerCase() === "br") ? "\n" : (n.textContent || "");
    });
    return t;
  }
  const BLOCK_RE = /^(p|div|section|h[1-6]|ul|ol|li|blockquote|pre|table)$/i;
  function walk(el) {
    const kids = Array.prototype.slice.call(el.children);
    const hasBlock = kids.some((k) => BLOCK_RE.test(k.tagName));
    if (!kids.length || !hasBlock) {
      const t = textOf(el);
      if (t.trim()) lines.push(t);
      return;
    }
    kids.forEach(function (k) {
      const tag = k.tagName.toLowerCase();
      if (tag === "section" || tag === "div") walk(k);
      else { const t = textOf(k); if (t.trim()) lines.push(t); }
    });
  }
  walk(root);

  const flat = [];
  lines.forEach((l) => l.split("\n").forEach((s) => flat.push(s)));
  const nonEmpty = flat.filter((l) => l.trim()).length;
  const mdLines = flat.filter((l) =>
    /^\s{0,3}(#{1,6}\s|>|[-*+]\s|\d+[.)]\s|```|(-{3,}|\*{3,}|_{3,})\s*$)/.test(l)
  ).length;
  const isMd = nonEmpty > 0 && mdLines >= 2 && mdLines / nonEmpty >= 0.25;

  if (isMd && typeof markdownToWechat === "function") {
    return markdownToWechat(flat.join("\n"), theme, outOpts);
  }
  return restyleHtml(html, theme, outOpts);
}

/**
 * 离线重排「已有 HTML」（来自公众号编辑器现有正文）：打上主题内联样式，返回可插入的 HTML 字符串。
 * 与 markdownToWechat 的唯一区别是输入为 HTML 而非 Markdown；都在离屏 DOM 上操作，不碰线上编辑器。
 * @param {string} html 现有正文 innerHTML
 * @param {object} theme WECHAT_THEMES 中的主题
 * @param {object} [opts] { fontSize, lineHeight, letterSpacing }
 */
function restyleHtml(html, theme, opts) {
  opts = opts || {};
  const doc = new DOMParser().parseFromString('<div id="root">' + bvUpgrade(html) + "</div>", "text/html");
  const root = doc.getElementById("root");
  // 先接住旧容器的对齐（居中/居右）——解包后它会随旧容器一起消失
  const keepAlign = opts.textAlign || pickRootAlign(root);

  // 只换颜色模式：各主题之间主要差在配色，布局 / 字号 / 对齐都一样。
  // 这时不重建容器 —— 重建会把用户在编辑器里设的对齐、手动调整盖回主题默认值。
  // 只更新颜色相关属性，其余一律不动。
  if (opts.colorsOnly) {
    // 换颜色也不该把「图片下面那个空行」一起写回去（它只是原地重上色）。
    // 清掉无源空图不算改结构 —— 它本来就不是内容。
    stripSourcelessImages(root);
    // 信息块要先按**新的主题色**重新生成 —— 它们的颜色全在生成器里，
    // 下面那条 applyStylesRecursive(onlyColors) 是「按元素改色」，改不到生成出来的块。
    regenSemBlocks(root, theme);
    // 只换颜色：绝不重建结构。
    // 有排版容器就顺带给容器上色；没有也照样只改颜色 —— 不能退回完整重排，
    // 否则主题的 margin / 字号等会把用户在编辑器里设的段前段后间距、对齐全冲掉
    // （「改个主题色，段间距变回默认值」就是这个原因）。
    const sec0 = root.querySelector("section[" + ROOT_MARK + "]");
    if (sec0) mergeStyle(sec0, theme.styles.section, true);
    // 只换颜色时也要认领符号：符号的颜色跟主题走，不重新认领会停在旧色上
    //（它是带样式的 span，颜色不在 bodyColor 那批里）。
    wrapListMarkers(root, theme);
    applyStylesRecursive(root, inheritTypography(theme, opts), true);
    return root.innerHTML; // 容器原样保留，不新建
  }

  unwrapRootSections(root); // 幂等：先解包自己之前套的外层 section，避免重复套用多包一层
  // 再展开「一个属性都没有」的空 section 包裹层（原稿常见 5~6 层嵌套）。
  // markdownToWechat 那条链不加：marked 生成的是 p/ul/ol，本来就没有这种空 section。
  unwrapEmptySections(root);
  // 信息块（提示框 / 步骤条 / 时间轴 / 卡片组）：**按当前主题重新生成**。
  // 位置刻意放在这里 —— 早于 normalizeCjkInDom / normalizeStructure，让重新生成的 HTML
  // 也过一遍文本与结构规范化；又早于 applyStylesRecursive，那一步会整块跳过它们。
  regenSemBlocks(root, theme);
  normalizeCjkInDom(root, opts.cjk); // 中文排版规范：中英文空格 / 标点 / 多余空格
  normalizeStructure(root); // 官方规范 2.1/2.2/2.3：嵌套≤10 层、span[leaf]/section[nodeleaf] 合规
  // 清掉「整棵子树都没有可见内容」的空壳 section/div/span（第三方导出稿常见，见函数说明）。
  // 必须放在 normalizeStructure 之后：无源空 <img> 壳已被它删掉，剩下的空壳判定才准。
  stripEmptyShells(root);
  if (typeof highlightCodeBlocks === "function") highlightCodeBlocks(root);
  demoteSemanticBlocks(root); // 语义标签降级为角色标记段落（与 markdownToWechat 一致）
  markCodeBlocks(root); // 代码块打角色标记（编辑器可能不保留 <pre> 标签）
  // 同上：按当前标题变体包 / 卸内层色块 span —— 2026-10-27 起**按级别分别判**
  //（一级用 H1 变体、二级可能换了另一套；共用同一个布尔会让 H2 选「静默」时仍留着色块 span）。
  wrapHeadInner(root, function (lv) {
    return lv === "h2" ? themeNeedsHeadInnerH2(theme) : themeNeedsHeadInner(theme);
  }, gradAttrFor(theme));
  wrapHeadMarks(root, theme); // 同上：插 / 卸前导图形（井号前缀）
  wrapLiText(root);  // 同上：列表文字包内层 span，跟随正文色
  wrapListMarkers(root, theme); // 同上：列表前缀做成真实文本（字号/颜色独立于正文，必须在 wrapLiText 之后）
  ensureMarkExempt(root); // 同上：荧光标记补 data-ignore-dm 豁免
  applyStylesRecursive(root, inheritTypography(theme, opts));
  // 组件（视频号 / 公众号视频 / 音频 / 小程序 / SVG 组件）的 40px 上下留白 ——
  // 必须在打样式之后：块壳先被套成正文段（16px），再被这里改成 40px（否则会被段距盖回去）。
  applyWidgetSpacing(root);
  // 同上：巨大句号（必须在打样式之后，见 markdownToWechat 同处的说明）。
  decoratePunct(root, (theme.styles || {}).punct);
  // 段首标点悬挂（2026-10-21）：与 markdownToWechat 同一条、同一个开关。
  hangLeftPunct(root, !!(opts.cjk && opts.cjk.hang));
  fixCaptionImageGap(root); // 图下有图释 → 这张图的下边距收到 10
  fixImageRunGaps(root);    // 连续的几张图：组内间距收到 10（2026-10-24 用户口径）（在打样式之后做，否则会被 40 覆盖回去）
  const section = doc.createElement("section");
  section.setAttribute(ROOT_MARK, "1");
  section.setAttribute("data-bluevibe-editor", "蓝调排版");
  const sectionStyle = Object.assign({}, theme.styles.section);
  applySectionTypography(sectionStyle, opts);
  // 对齐跟着用户走：整篇居中/居右在换主题、换颜色后不能被打回居左
  if (keepAlign) sectionStyle.textAlign = keepAlign;
  section.setAttribute("style", styleToCss(sectionStyle));
  section.innerHTML = root.innerHTML;
  return section.outerHTML;
}


</script>
<script>
/*
 * 蓝调 · 手机排版（2026-10-28 · 第二版：块级编辑 + 逐行成段）
 *
 * 两个手机端特有的取舍：
 *   1. **一行 = 一段**。手机上从公众号 / 备忘录 / Word 粘过来，段与段之间往往只有**一个换行**
 *      （没有空行）。Markdown 的规矩是「单换行 = 同一段」，粘进来就会全并成一大段 ——
 *      用户 2026-10-28 报的正是这个。所以这里**不走 CommonMark 的软换行**：
 *      每一行自己成一段，空行只当分隔符。（想在一段里换行，就写在一行里。）
 *   2. **点段落弹「浮板」**。触屏没有 hover，桌面的悬停浮板搬不过来；改成
 *      「点预览里的某一段 → 底部弹出选项（标题/引用/列表/正文…）」，改的是**那一块**，
 *      并且会**回写左侧的原文**（加 `#`、`>`、`-` 前缀）—— 原文始终是真源，改完还能手改。
 *
 * 排版仍然完全交给 converter 的 `bodyToStyled()`：这里只负责「把一行行变成一块块」，
 * 一行渲染一次再拼起来，保证和电脑版同源（唯一差别：相邻同类标题不做收间距）。
 */
(function () {
  "use strict";

  var H1_CHOICES = [
    ["block", "色块刊头"],
    ["banner", "通栏色块"],
    ["quiet", "静默"],
    ["chip", "底色块"],
    ["hash", "井号前缀"],
    ["numBlock", "编号实心块"]
  ];
  var H2_CHOICES = [["", "跟随一级"]].concat(H1_CHOICES);
  var FONT_CHOICES = [["pingfang", "苹方"], ["system", "系统"], ["hiragino", "冬青"]];
  var COLOR_CHOICES = ["#0052FF", "#E5484D", "#F76B15", "#1FA971", "#7C5CFF"];

  // 块类型：桌面浮板那几颗的基础版（手机上不需要 H4 / 代码块 / 卡片）
  var KINDS = [
    ["p", "正文"],
    ["h1", "H1"],
    ["h2", "H2"],
    ["h3", "H3"],
    ["quote", "引用"],
    ["list", "列表"],
    ["hr", "分割线"]
  ];

  var state = {
    accent: "#0052FF",
    h1: "block",
    h2: "",
    size: 16,
    lh: 1.75,
    gap: 16,
    font: "pingfang"
  };

  var $ = function (id) { return document.getElementById(id); };
  var mdEl = $("md");

  /* ────────────────────────── 解析：一行 = 一段 ────────────────────────── */

  function stripPrefix(t) {
    return t
      .replace(/^#{1,6}\s+/, "")
      .replace(/^>\s?/, "")
      .replace(/^([-*+]|\d+\.)\s+/, "");
  }

  function parseBlocks(src) {
    var lines = String(src || "").split(/\r?\n/);
    var out = [];
    for (var i = 0; i < lines.length; i++) {
      var t = lines[i].trim();
      if (!t) continue;
      var kind = "p", text = t;
      if (/^#{3,6}\s+/.test(t)) { kind = "h3"; text = stripPrefix(t); }
      else if (/^##\s+/.test(t)) { kind = "h2"; text = stripPrefix(t); }
      else if (/^#\s+/.test(t)) { kind = "h1"; text = stripPrefix(t); }
      else if (/^>\s?/.test(t)) { kind = "quote"; text = stripPrefix(t); }
      else if (/^([-*+]|\d+\.)\s+/.test(t)) { kind = "list"; text = t; }
      else if (/^[-*_]{3,}$/.test(t)) { kind = "hr"; text = ""; }
      var prev = out[out.length - 1];
      // 连续的引用 / 列表合成一块（渲染成一个框 / 一个列表）
      if (prev && prev.kind === kind && (kind === "quote" || kind === "list") && prev.end === i - 1) {
        prev.lines.push(text); prev.end = i; prev.text = prev.lines.join("\n");
      } else {
        out.push({ kind: kind, lines: [text], start: i, end: i, text: text });
      }
    }
    return out;
  }

  /** 一块 → 交给 bodyToStyled 的一小段 Markdown。 */
  function mdOf(b) {
    switch (b.kind) {
      case "h1": return "# " + b.text;
      case "h2": return "## " + b.text;
      case "h3": return "### " + b.text;
      case "quote": return b.lines.map(function (l) { return "> " + l; }).join("\n");
      case "list": return b.lines.join("\n");
      case "hr": return "---";
      default: return b.text;
    }
  }

  /** 改写原文里这一块的行前缀（改类型时回写真源，原文永远可手改）。 */
  function retypeSource(src, block, kind) {
    var lines = String(src || "").split(/\r?\n/);
    var hashes = kind === "h1" ? "# " : kind === "h2" ? "## " : kind === "h3" ? "### " : "";
    for (var i = block.start; i <= block.end; i++) {
      var t = lines[i].trim();
      if (!t) continue;
      if (kind === "hr") { lines[i] = "---"; continue; }
      var body = stripPrefix(t);
      if (kind === "quote") lines[i] = "> " + body;
      else if (kind === "list") lines[i] = "- " + body;
      else if (kind === "p") lines[i] = body;
      else lines[i] = hashes + body;
    }
    return lines.join("\n");
  }

  /* ────────────────────────── 主题与选项 ────────────────────────── */

  function theme() {
    var T = window.WECHAT_THEMES || {};
    var base = T.business || Object.keys(T).map(function (k) { return T[k]; })[0];
    if (!base) return null;
    base = Object.assign({}, base, { accent: state.accent });
    if (typeof window.applyBlockVariants === "function") {
      base = window.applyBlockVariants(base, {
        title: state.h1, titleH2: state.h2, quote: "soft", list: "tri"
      }, "");
    }
    return base;
  }

  function opts() {
    return {
      fontSize: state.size, lineHeight: state.lh, letterSpacing: 0, paraGap: state.gap,
      fontFamily: state.font, imgRadius: 8,
      cjk: { space: true, punct: true, tidy: true, hang: true }
    };
  }

  /* ────────────────────────── 渲染 ────────────────────────── */

  var blocks = [];
  var previewEl = $("preview");
  var lastHtml = "";

  function sectionTagOf(html) {
    var m = /^<section\b[^>]*>/i.exec(String(html || "").trim());
    return m ? m[0] : '<section style="width:100%">';
  }

  function innerOf(html) {
    return String(html || "").trim()
      .replace(/^<section\b[^>]*>/i, "")
      .replace(/<\/section>\s*$/i, "");
  }

  function render() {
    var t = theme();
    if (!t || typeof window.bodyToStyled !== "function") return;
    blocks = parseBlocks(mdEl.value);
    if (!blocks.length) {
      lastHtml = "";
      previewEl.innerHTML = '<p class="ph">先写点内容…</p>';
      return;
    }
    var wraps = [], pieces = [], open = "";
    for (var i = 0; i < blocks.length; i++) {
      var html = "";
      try {
        // ⚠️ 必须用 markdownToWechat，不能用 bodyToStyled：
        //    后者的「是不是 Markdown」判据要求 **至少两行** 带标记（mdLines >= 2），
        //    我们这里是**一块一块**渲染的（单行标题 / 单行正文），永远不达标 ——
        //    结果会被当成富文本原样转义，`# 标题` 就真的显示成 "# 标题"（2026-10-28 踩到）。
        html = (typeof window.markdownToWechat === "function")
          ? window.markdownToWechat(mdOf(blocks[i]), t, opts())
          : window.bodyToStyled(mdOf(blocks[i]), t, opts());
      }
      catch (e) { html = "<section><p>" + String(blocks[i].text) + "</p></section>"; }
      if (i === 0) open = sectionTagOf(html);
      var inner = innerOf(html);
      pieces.push(inner);
      wraps.push('<div class="bvb" data-bv-b="' + i + '" role="button" tabindex="0">' + inner + "</div>");
    }
    lastHtml = open + pieces.join("") + "</section>";
    previewEl.innerHTML = open + wraps.join("") + "</section>";
  }

  var timer = null;
  function schedule() { clearTimeout(timer); timer = setTimeout(render, 120); }

  /* ────────────────────────── 块「浮板」 ────────────────────────── */

  var sheet = $("sheet");
  var sheetKinds = $("sheetKinds");
  var sheetWho = $("sheetWho");

  function kindsLabel(k) {
    for (var i = 0; i < KINDS.length; i++) if (KINDS[i][0] === k) return KINDS[i][1];
    return k;
  }

  function openSheet(idx) {
    var b = blocks[idx];
    if (!b) return;
    sheetWho.textContent = "第 " + (idx + 1) + " 段 · " + kindsLabel(b.kind);
    sheetKinds.innerHTML = "";
    KINDS.forEach(function (k) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "kbtn" + (k[0] === b.kind ? " on" : "");
      btn.textContent = k[1];
      btn.addEventListener("click", function () {
        var next = retypeSource(mdEl.value, b, k[0]);
        if (next !== mdEl.value) mdEl.value = next;
        closeSheet();
        render();
        toast("已改成「" + k[1] + "」");
      });
      sheetKinds.appendChild(btn);
    });
    sheet.hidden = false;
    document.body.classList.add("sheet-open");
  }

  function closeSheet() {
    sheet.hidden = true;
    document.body.classList.remove("sheet-open");
  }

  previewEl.addEventListener("click", function (e) {
    var host = e.target.closest ? e.target.closest("[data-bv-b]") : null;
    if (!host) return;
    var idx = parseInt(host.getAttribute("data-bv-b"), 10);
    if (!isNaN(idx)) openSheet(idx);
  });

  $("sheetCancel").addEventListener("click", closeSheet);
  $("sheetMask").addEventListener("click", closeSheet);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSheet(); });

  /* ────────────────────────── 样式控件 ────────────────────────── */

  function chip(label, on, fn) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "chip" + (on ? " on" : "");
    b.textContent = label;
    b.addEventListener("click", fn);
    return b;
  }

  function paintColors() {
    var box = $("colors");
    box.innerHTML = "";
    COLOR_CHOICES.forEach(function (c) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "dot" + (c.toLowerCase() === state.accent.toLowerCase() ? " on" : "");
      b.style.background = c;
      b.setAttribute("aria-label", "主题色 " + c);
      b.addEventListener("click", function () {
        state.accent = c; $("accent").value = c; paintColors(); render();
      });
      box.appendChild(b);
    });
  }

  function paintChips(id, list, cur, onPick) {
    var box = $(id);
    box.innerHTML = "";
    list.forEach(function (it) {
      box.appendChild(chip(it[1], it[0] === cur, function () {
        onPick(it[0]);
        paintChips(id, list, it[0], onPick);
        render();
      }));
    });
  }

  function paintAll() {
    paintColors();
    paintChips("h1chips", H1_CHOICES, state.h1, function (v) { state.h1 = v; });
    paintChips("h2chips", H2_CHOICES, state.h2, function (v) { state.h2 = v; });
    paintChips("fontchips", FONT_CHOICES, state.font, function (v) { state.font = v; });
    $("size").value = state.size; $("sizeOut").textContent = state.size;
    $("lh").value = state.lh; $("lhOut").textContent = state.lh;
    $("gap").value = state.gap; $("gapOut").textContent = state.gap;
    $("accent").value = state.accent;
  }

  ["size", "lh", "gap"].forEach(function (k) {
    var el = $(k);
    el.addEventListener("input", function () {
      state[k] = (k === "lh") ? parseFloat(el.value) : parseInt(el.value, 10);
      $(k + "Out").textContent = el.value;
      schedule();
    });
  });
  $("accent").addEventListener("input", function () {
    state.accent = this.value; paintColors(); schedule();
  });
  mdEl.addEventListener("input", schedule);

  $("btnSample").addEventListener("click", function () {
    mdEl.value = [
      "# 手机上也能排版了",
      "这是一段正文。字号、行高、段间距都能在下面调，预览就是粘进公众号的样子。",
      "在「看」页点某一段，可以把它改成标题、引用或列表。",
      "## 先说结论",
      "> 手机上写完，复制一下，粘到「订阅号助手」，再插图片就行。",
      "- 标题有六套版式，一级二级可以不一样",
      "- 点段落就能改这一块的样式",
      "- 图片留个 [图1] 占位，粘完删掉它、在那里插图",
      "## 再补一句",
      "排版引擎和电脑版是同一份，所以两边排出来一致。"
    ].join("\n");
    render();
  });

  /* ────────────────────────── 复制 ────────────────────────── */

  function plainOf(html) {
    var d = document.createElement("div");
    d.innerHTML = html;
    return (d.textContent || "").replace(/\n{3,}/g, "\n\n").trim();
  }

  function copyViaExecCommand(html) {
    var box = document.createElement("div");
    box.setAttribute("contenteditable", "true");
    box.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0;";
    box.innerHTML = html;
    document.body.appendChild(box);
    var range = document.createRange();
    range.selectNodeContents(box);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    sel.removeAllRanges();
    document.body.removeChild(box);
    return ok;
  }

  function copyRich(html) {
    if (navigator.clipboard && window.ClipboardItem) {
      try {
        var items = {};
        items["text/html"] = new Blob([html], { type: "text/html" });
        items["text/plain"] = new Blob([plainOf(html)], { type: "text/plain" });
        return navigator.clipboard.write([new window.ClipboardItem(items)])
          .then(function () { return true; })
          .catch(function () { return copyViaExecCommand(html); });
      } catch (e) { /* 落到下面 */ }
    }
    return Promise.resolve(copyViaExecCommand(html));
  }

  var toastEl = $("toast"), toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("on"); }, 2200);
  }

  $("btnCopy").addEventListener("click", function () {
    if (!lastHtml) { toast("先写点内容"); return; }
    var btn = this;
    btn.disabled = true;
    copyRich(lastHtml).then(function (ok) {
      btn.disabled = false;
      toast(ok ? "已复制 · 去订阅号助手长按粘贴" : "复制失败：请长按预览手动选择");
    });
  });

  /* ────────────────────────── 页签 / 启动 ────────────────────────── */

  var tabs = $("tabs");
  function switchTab(name) {
    [].forEach.call(tabs.children, function (b) {
      var on = b.getAttribute("data-tab") === name;
      b.classList.toggle("on", on);
      b.setAttribute("aria-selected", on ? "true" : "false");
    });
    $("paneEdit").hidden = (name !== "edit");
    $("paneView").hidden = (name !== "view");
    window.scrollTo(0, 0);
  }
  [].forEach.call(tabs.children, function (b) {
    b.addEventListener("click", function () { switchTab(b.getAttribute("data-tab")); });
  });

  paintAll();
  render();
})();

</script>
