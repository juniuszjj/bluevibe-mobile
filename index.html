<style>
/* 蓝调 · 手机排版（2026-10-28 · 第一版）
   目标设备：iPhone Safari（也兼容安卓 Chrome）。
   原则：单列、大触控区、底部固定主按钮；预览区就是公众号里的样子。 */

:root {
  --brand: #0052FF;
  --bg: #F5F6F8;
  --card: #FFFFFF;
  --fg: #1A1D22;
  --fg2: #5A6270;
  --fg3: #8A9099;
  --line: #E6E8EC;
  --fill: #F1F3F6;
  --r: 14px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.5 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
  -webkit-text-size-adjust: 100%;
}

/* ── 顶栏 ── */
.bar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px 10px;
  background: rgba(245, 246, 248, .92);
  backdrop-filter: saturate(180%) blur(12px);
  -webkit-backdrop-filter: saturate(180%) blur(12px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 8px; }
.brand b { font-size: 19px; letter-spacing: .02em; }
.ver { font-size: 11px; color: var(--fg3); }

/* ── 页签：写 / 看 ── */
.tabs {
  display: flex; gap: 4px; padding: 0 12px 8px;
}
.tabs button {
  flex: 1; border: 0; border-radius: 10px; padding: 9px;
  background: var(--card); color: var(--fg2);
  font: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
  box-shadow: 0 1px 2px rgba(16, 24, 40, .05);
}
.tabs button.on { background: var(--brand); color: #fff; font-weight: 600; }

main { padding: 12px 12px 96px; }

/* ── 卡片 ── */
.card {
  background: var(--card);
  border-radius: var(--r);
  padding: 12px 14px 14px;
  margin: 0 0 12px;
  box-shadow: 0 1px 2px rgba(16, 24, 40, .04);
}
.cardhead {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 8px; margin-bottom: 8px;
}
.cardhead > span:first-child, .cardhead label {
  font-size: 13px; font-weight: 600; color: var(--fg);
}
.hint { font-size: 11px; color: var(--fg3); text-align: right; }

/* ── 输入 ── */
textarea {
  width: 100%; min-height: 168px; resize: vertical;
  border: 1px solid var(--line); border-radius: 10px;
  padding: 12px; font: inherit; line-height: 1.7;
  color: var(--fg); background: #FCFCFD;
  -webkit-appearance: none; appearance: none;
}
textarea:focus { outline: 2px solid rgba(0, 82, 255, .18); border-color: var(--brand); }

/* ── 控件行 ── */
.row { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.row .lab { width: 62px; flex: none; font-size: 12px; color: var(--fg2); }
.row output { min-width: 34px; font-size: 12px; color: var(--fg2); font-variant-numeric: tabular-nums; }
.row input[type="range"] { flex: 1; min-width: 120px; accent-color: var(--brand); }

/* 主题色圆点 */
.colors { display: flex; gap: 10px; flex: 1; }
.dot {
  width: 28px; height: 28px; border-radius: 50%;
  border: 0; padding: 0; cursor: pointer;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .08);
}
.dot.on { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--brand); }
input[type="color"] {
  width: 32px; height: 28px; padding: 0; border: 1px solid var(--line);
  border-radius: 8px; background: none;
}

/* 胶囊选项 */
.chips { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
.chip {
  border: 1px solid var(--line); background: var(--fill); color: var(--fg2);
  border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 12px;
  cursor: pointer;
}
.chip.on { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }

/* ── 预览 ── */
.previewcard { padding-bottom: 8px; }
.phone {
  border-radius: 12px; background: #fff; overflow: hidden;
  border: 1px solid var(--line);
}
.preview {
  width: 100%; padding: 18px 18px 22px; min-height: 120px;
  font-size: 16px; line-height: 1.75; color: #242A26;
  overflow-wrap: break-word;
}
.preview img { max-width: 100%; height: auto; }
.preview .ph { color: var(--fg3); }

.tip { margin: 4px 2px 0; font-size: 12px; color: var(--fg3); line-height: 1.6; }
.tip b { color: var(--fg2); }

/* ── 底部操作条 ── */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  padding: 10px 12px calc(10px + var(--safe-b));
  background: linear-gradient(to top, var(--bg) 62%, rgba(245, 246, 248, 0));
}
.primary {
  width: 100%; border: 0; border-radius: 12px;
  padding: 15px; font: inherit; font-size: 16px; font-weight: 600;
  color: #fff; background: var(--brand);
  box-shadow: 0 6px 18px rgba(0, 82, 255, .28);
  cursor: pointer;
}
.primary:active { transform: scale(.985); }
.primary[disabled] { opacity: .5; box-shadow: none; }

.ghost {
  border: 1px solid var(--line); background: var(--card); color: var(--fg2);
  border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 12px;
  cursor: pointer;
}

/* ── 提示 ── */
.toast {
  position: fixed; left: 50%; bottom: calc(86px + var(--safe-b));
  transform: translate(-50%, 8px);
  max-width: 86vw;
  padding: 10px 16px; border-radius: 999px;
  background: rgba(24, 28, 34, .92); color: #fff; font-size: 13px;
  opacity: 0; pointer-events: none; transition: opacity .18s ease, transform .18s ease;
  z-index: 40; text-align: center;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (min-width: 720px) {
  main { max-width: 720px; margin: 0 auto; }
  .dock { max-width: 720px; margin: 0 auto; }
}
/* ── 预览里的块：点击热区（点一下弹「浮板」）── */
.bvb { border-radius: 8px; transition: background .15s ease; }
body:not(.sheet-open) .bvb:hover { background: rgba(0, 82, 255, .04); }
.bvb:active { background: rgba(0, 82, 255, .08); }

/* ── 块「浮板」 ── */
#sheet { position: fixed; inset: 0; z-index: 50; }
.sheet-mask {
  position: absolute; inset: 0;
  background: rgba(12, 16, 22, .38);
  animation: fade .18s ease;
}
.sheet-panel {
  position: absolute; left: 0; right: 0; bottom: 0;
  background: var(--card);
  border-radius: 18px 18px 0 0;
  padding: 14px 14px calc(16px + var(--safe-b));
  box-shadow: 0 -8px 30px rgba(16, 24, 40, .18);
  animation: rise .2s cubic-bezier(.2, .8, .2, 1);
}
.sheet-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px;
}
.sheet-head span { font-size: 13px; color: var(--fg2); }
.kinds { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.kbtn {
  border: 1px solid var(--line); background: var(--fill); color: var(--fg);
  border-radius: 10px; padding: 12px 4px; font: inherit; font-size: 13px;
  cursor: pointer;
}
.kbtn.on { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
/* 浮板打开时把底部「复制」条收掉：它本来就被浮板盖住，留着只会让人以为按钮坏了 */
body.sheet-open .dock { display: none; }
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
@keyframes rise { from { transform: translateY(12px); opacity: .6 } to { transform: none; opacity: 1 } }

</style>
</head>
<body>

<header class="bar">
  <div class="brand"><b>蓝调</b><span class="ver" id="ver">手机版</span></div>
  <button class="ghost" id="btnSample" type="button">示例</button>
</header>

<nav class="tabs" id="tabs">
  <button type="button" data-tab="edit" class="on">写</button>
  <button type="button" data-tab="view">看</button>
</nav>

<main>
  <div class="pane" id="paneEdit">
  <!-- 输入 -->
  <section class="card">
    <div class="cardhead">
      <label for="md">内容</label>
      <span class="hint">支持 # 标题 / ## 二级 / &gt; 引用 / - 列表；空行分段</span>
    </div>
    <textarea id="md" spellcheck="false" placeholder="# 一级标题
正文写在这里。

## 二级标题
> 引用一句话。

- 列表第一项
- 第二项

[图1]"></textarea>
  </section>

  <!-- 样式 -->
  <section class="card">
    <div class="cardhead"><span>样式</span><span class="hint">改一项，预览立刻变</span></div>

    <div class="row">
      <span class="lab">主题色</span>
      <div class="colors" id="colors"></div>
      <input type="color" id="accent" value="#0052FF" aria-label="自定义主题色">
    </div>

    <div class="row">
      <span class="lab">一级标题</span>
      <div class="chips" id="h1chips"></div>
    </div>

    <div class="row">
      <span class="lab">二级标题</span>
      <div class="chips" id="h2chips"></div>
    </div>

    <div class="row">
      <span class="lab">字号</span>
      <input type="range" id="size" min="14" max="19" step="1" value="16">
      <output id="sizeOut">16</output>
    </div>
    <div class="row">
      <span class="lab">行高</span>
      <input type="range" id="lh" min="1.5" max="2.1" step="0.05" value="1.75">
      <output id="lhOut">1.75</output>
    </div>
    <div class="row">
      <span class="lab">段间距</span>
      <input type="range" id="gap" min="8" max="26" step="2" value="16">
      <output id="gapOut">16</output>
    </div>
    <div class="row">
      <span class="lab">字体</span>
      <div class="chips" id="fontchips"></div>
    </div>
  </section>

  </div><!-- /paneEdit -->

  <div class="pane" id="paneView" hidden>
    <section class="card previewcard">
      <div class="cardhead"><span>预览</span><span class="hint">这就是粘进公众号的样子</span></div>
      <div class="phone"><div id="preview" class="preview"><p class="ph">先写点内容…</p></div></div>
    </section>
    <p class="tip">点预览里的任意一段，可以把它改成标题 / 引用 / 列表。<br>
      复制后，在「订阅号助手」里长按粘贴；文中 <b>[图1]</b> 那句粘完删掉，在那里插入图片。</p>
  </div>
</main>

<!-- 底部操作条 -->
<div class="dock">
  <button class="primary" id="btnCopy" type="button">复制排版</button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- 块「浮板」：点预览里的某一段弹出来 -->
<div id="sheet" hidden>
  <div class="sheet-mask" id="sheetMask"></div>

<script>
/**
 * 蓝调默认排版样式
 *
 * 只保留两种入口：
 *   1. 默认主题：黑色正文 + 蓝色强调
 *   2. 自定义颜色：只替换强调色，字号、间距和结构保持一致
 *
 * 所有样式最终由 converter.js 写成内联 style，适配微信公众号编辑器。
 */
/**
 * 字体族（官方规范第 3 章「字体使用规范」）。
 *
 * 官方给了一套默认栈，并写明「不建议设置任何字体族」—— 但面板要提供「默认字体」选择，
 * 所以这里只做一件事：**把官方栈原样收进来，再把 PingFang SC 提到首位**。
 * 为什么把苹方提前（2026-10-19 用户口径）：它是编辑器与手机最稳的中文字体；
 * `mp-quote` 是微信引用体，桌面端通常不存在，放首位等于「先探测一个没有的字」。
 * 除顺序外，家族清单与官方默认栈**逐字一致**（多一个少一个都算偏离规范）。
 *
 * ⚠️ 官方默认栈原文（留档，改顺序时对照）：
 *   "mp-quote", PingFang SC, system-ui, -apple-system, BlinkMacSystemFont,
 *   Helvetica Neue, Hiragino Sans GB, Microsoft YaHei UI, Microsoft YaHei, Arial, sans-serif
 */
/**
 * 面板「字体」下拉的选项。
 *   label —— **短名**：下拉框要和「字重」挤在同一行（用户 2026-10-19 口径「压缩成一行」），
 *            窄框里放不下「苹方 PingFang SC」这类全名（会被原生 select 直接切掉）。
 *   full  —— 全名：进 title / tooltip，悬停时仍能看到完整字体名。
 *   css   —— 写进 font-family 的那一项。
 */
/*
 * ⚠️ 本文件顶层的声明一律用 `var`，**不要改回 `const`**（2026-10-27）。
 *
 * 原因：扩展更新后，background 的 ensureMain 会把整栈重新注入主世界。blockbar / converter /
 * inject-main 都是 IIFE，重复注入只是重新定义函数、没事；而本文件是**平铺的顶层脚本**，
 * 顶层 `const` 第二次注入时会直接 `SyntaxError: Identifier 'X' has already been declared`
 * —— 这一整份就被跳过，主世界继续用旧的主题表，于是出现「新浮板 + 旧主题表」的混搭
 *（症状：浮板点 H2 不是 H2 的样式，得再点一次应用主题才正常）。
 * `var` 允许重复声明并重新赋值，重注入就能干净替换掉旧的一份。
 *
 * 另：tests 里也有几处 `src.replace(/^const /gm, "var ")` 的写法（eval 时 const 会丢），
 * 换成 var 之后那些 replace 变成空操作，不影响。
 */
var FONT_FAMILIES = [
  { id: "pingfang", label: "苹方", full: "苹方 PingFang SC", css: '"PingFang SC"' },
  { id: "mpquote", label: "微信引用体", full: "微信引用体 mp-quote", css: '"mp-quote"' },
  { id: "system", label: "系统界面", full: "系统界面 system-ui", css: "system-ui" },
  { id: "apple", label: "苹果系统", full: "苹果系统 -apple-system", css: "-apple-system" },
  { id: "blink", label: "Blink 系统", full: "BlinkMacSystemFont", css: "BlinkMacSystemFont" },
  { id: "helvetica", label: "Helvetica", full: "Helvetica Neue", css: '"Helvetica Neue"' },
  { id: "hiragino", label: "冬青黑体", full: "冬青黑体 Hiragino Sans GB", css: '"Hiragino Sans GB"' },
  { id: "yaheiui", label: "雅黑 UI", full: "微软雅黑 UI", css: '"Microsoft YaHei UI"' },
  { id: "yahei", label: "微软雅黑", full: "微软雅黑", css: '"Microsoft YaHei"' },
  { id: "arial", label: "Arial", full: "Arial", css: "Arial" },

/** 默认字体 = 苹方（面板下拉的第一项，也是「恢复默认」回到的那一项）。 */
var FONT_DEFAULT = "pingfang";

/** 默认字体的字重档位（面板「字重」一行）：细 / 常规 / 中粗 / 半粗。 */
var FONT_WEIGHTS = [300, 400, 500, 600];
var FONT_WEIGHT_LABELS = ["细", "常规", "中粗", "半粗"];
var FONT_WEIGHT_DEFAULT = 300;

/** 认不出的字体 id → 默认苹方（老存档 / 手改过的值都挡在渲染层之外）。 */

  var s = String(id == null ? "" : id);
  for (var i = 0; i < FONT_FAMILIES.length; i++) if (FONT_FAMILIES[i].id === s) return s;
  return FONT_DEFAULT;

/** 认不出的字重 → 默认 300。 */
function fontWeightOf(v) {
  var n = Math.round(Number(v));

 * 字体 id → 完整 font-family 栈。
 * 规则：选中的家族排第一，其余按 FONT_FAMILIES 的顺序跟在后面，最后兜底 sans-serif。
 * 换的只是「谁先命中」，中文回退链始终是官方那一套 —— 不会因为选了 Arial 就让中文

  }
  for (i = 0; i < FONT_FAMILIES.length; i++) {
    if (FONT_FAMILIES[i].id !== first) out.push(FONT_FAMILIES[i].css);

var MONO_FONT = '"SF Mono", Monaco, "Cascadia Code", "Roboto Mono", Consolas, monospace';

var DEFAULT_ACCENT = "#0052FF";

// 标题 / 装饰的墨色（引用、代码、表格、标题变体里的「墨色版」共用这个值）。
var INK = "#242A26";
// 正文颜色（2026-10-21 用户指定 `rgb(63, 67, 74)`）：段落 / 列表里的段落 / 外层默认字色。
// ⚠️ 与 INK 分开是有意的 —— 标题仍用 INK，改正文不该把标题一起改浅。
var BODY_INK = "#3F434A";
// 正文**加粗**的颜色（用户指定 `rgb(17, 24, 39)`）：比正文更深一档，加粗才「跳」得出来。
// 只作用于正文里的 strong；标题内部的加粗由 headInlineStyle 换成标题自己的颜色，不受影响。
var STRONG_INK = "#111827";

/* ==========================================================================

    //    算法按「文字与背景对比度」判它必然踩线。
    //    解法用的是官方 **§4.6 豁免机制**：`data-ignore-dm="low-contrast"`
    //    （原文：「创作者如果已经充分了解了 Dark Mode 检测给出的警告，并确认 Dark Mode 的
    //      效果没问题，那么可以添加 data-ignore-dm 属性来告知校验引擎跳过该节点的指定规则」）。
    //    ⚠️ 豁免的前提是**真的确认过暗色模式没问题**，不是随手消警告：
    //      浅色鬼影灰在深色页面上是高对比（深底 + 浅灰 #E4E4E7 合成后约 13:1），
    //      而且官方算法对「已经够亮」的色不做处理 → 深色下它只会更清楚，不会更淡。
    //    ⚠️ 属性挂在**图形 span 自己**身上，不能挂外层 h1 ——
    //      官方写明「其后代节点如果有违规，依然会进行检测」，挂外层对这颗 span 无效。
    //    ⚠️ 别改成「把颜色加深到 4.5:1 就没人报了」：那会把水印式的灰数字变成一枚
    //      实心中灰，整张截图的美术口径（中性灰页码感）就没了。豁免才是对症的那一刀。
    mark: { counter: true, pad: 2, thumb: "numtop", ignoreDm: true },
    // lineHeight:1 + margin 3px：把大数字那行的行盒压扁，否则 2.4em 的行盒会在标题上方
    // 撑出一大块空白（截图上数字底到标题顶只有 ~18px）。
    // ⚠️ color 用 `{faint}`（中性鬼影灰）不是 `{mark}`（主题色荧光版）：截图里数字与
    //    标题下面那条线**是同一个中性灰 #E4E4E7**，跟主题色无关。换成 `{mark}` 之后
    //    淡色主题色（#FFD400）会得到 rgba(240,200,0,0.22) —— 在白纸上几乎不存在，
    //    连「低对比装饰」都算不上。（这是体检用例 [9] ①真的抓出来的，不是猜的。）
    markStyle: { display: "block", color: "{faint}", fontSize: "2.4em", fontWeight: "800",
                 lineHeight: "1", letterSpacing: "-1px", margin: "0 0 3px" },
    h1: { fontSize: "21px", fontWeight: "800", color: "{text}", lineHeight: "1.35",
          margin: "34px 0 18px", paddingBottom: "12px", borderBottom: "1px solid {faint}" },
    h2: { fontSize: "17.5px", fontWeight: "700", color: "{text}", lineHeight: "1.35",
          margin: "30px 0 16px", paddingBottom: "10px", borderBottom: "1px solid {faint}" },
  },

  numBlock: {

    mark: { counter: true, pad: 2, thumb: "numblock", ignoreDm: true },

    h1: { fontSize: "20px", fontWeight: "800", color: "{text}", lineHeight: "1.5", margin: "32px 0 16px" },

/* ==========================================================================
   渐变字：色带 + 图床地址注册表（2026-10-09 落地，2026-10-09 晚改版）
   --------------------------------------------------------------------------
   这里只放**数据**与「地址注入」；样式怎么拼在 titleStylesOf 里。

   色带与 GIF 生成器原型（`docs/设计稿/蓝调-渐变字生成器-原型.html` 的 `ST.colors`）**同源**：
   A1 静态渐变条与 A3 流动 GIF 共用这一份数据，不维护两套。`stops` 是**开链**（首尾不同色），
   画成图 / 编码 GIF 前要**闭环**（末尾补回首色）—— 由 gradStopsClosed 统一补，闭环后横向
   滚动才无缝（A3 全靠它）。

   ⚠️ 地址**不能写死在变体表**里：微信只转存**外链图**，所以必须先上传图床拿到 mmbiz 地址，
      再在运行时注入（与视频号美化同一条链路）。没上传前是空串，titleStylesOf 会据此把渐变
      退化成实色字（见变体注释里的硬约束 ③）。
   ========================================================================== */
/**
 * 出厂色带：**只留两条**（2026-10-09 用户定）。
 * ---------------------------------------------------------------------------
 * 原来是 4 条（flame / sunset / ocean / mint）。用户当天改口径：
 *   「色带默认保留两条，另外的可以用户自定义色带后点一下保存可以放到色带下面」
 * ⇒ sunset 与 flame 撞（都是暖橙）、mint 与 ocean 撞（都是青绿），四选二就留对比最大的
 *   **一暖一冷**（flame 洋红橙紫 / ocean 青蓝）当出厂默认；空出来的位置给用户自己存的色带
 *   （见下面的 GRAD_USER）。副作用正好是我们想要的：色带行不会再换行。
 *
 * ⚠️ `label` 保留但**不再画在界面上**（用户：「色带可以不加名字」）：
 *    只当 `title` / `aria-label` 用 —— 一个纯色块对读屏用户零信息，
 *    去掉可见文字 ≠ 去掉可访问名。
 * ========================================================================== */
var GRAD_PRESETS = {
  flame: { label: "洋红橙紫", stops: ["#FF3D71", "#FF8A00", "#7C3AED"] },
  ocean: { label: "青蓝",     stops: ["#00C6FF", "#0072FF", "#00E0C6"] },
};
var GRAD_PRESET_DEFAULT = "flame";
/** 「我的图片」那一路的地址键（与出厂预设分开存，互不覆盖）。 */
var GRAD_CUSTOM_KEY = "custom";
/** 「自定义色」那一路的键：用户在弹窗里自己挑的色标（不属于 GRAD_PRESETS，运行时可改）。 */
var GRAD_DIY_KEY = "diy";

/**
 * 自定义色的色标（默认先给 flame 那组，用户改过就一直是改过的）。
 * ⚠️ 用 `var` 不用 `const`：长图那份沙箱是一段段 window.eval 拼起来的，
 *    顶层 const/let 不跨 eval 共享（项目惯例，见 tests/lib/palette.js 的 readVar）。
 */
var GRAD_DIY_STOPS = GRAD_PRESETS[GRAD_PRESET_DEFAULT].stops.slice();

/**
 * 用户自己存下来的色带（2026-10-09 用户定：「用户可以自定义默认的一些色带保存本机，
 * 这样可以复用……点一下保存可以放到色带下面」）。
 * ---------------------------------------------------------------------------
 * 键 → 色标数组。键是 `u` + 时间戳（`u1759999999999`），与出厂预设（flame / ocean）、
 * `diy`（当前正在编辑的那组）、`custom`（用户自己的图片）**互不冲突**。
 *
 * 为什么要一张**运行时表**而不是把用户色带塞回 GRAD_PRESETS：
 *   · 出厂预设是**不可变**的常量表（测试锁着、也真的不该被用户改）；
 *   · 用户色带是从 chrome.storage 读进来的运行时数据，两边性质不同。
 *
 * ⚠️ 素材（图床地址）**天然按这个键分格**（GRAD_IMAGE_URLS 就是 key → url）——
 *    所以每条用户色带各自一格、彼此不覆盖，切来切去不会反复重传同一张图。
 * ⚠️ 两个世界各有一份 themes.js（主世界 + isolated），这份表**两边都要注册**：
 *    面板侧负责画缩略图，主世界那侧负责生成/上传素材。
 * ⚠️ 用 `var` 不用 `const`：长图那份沙箱是一段段 window.eval 拼起来的，
 *    顶层 const/let 不跨 eval 共享（项目惯例）。
 */
var GRAD_USER = Object.create(null);

/** 色标合法吗（2~5 个 #RRGGBB）—— setGradStops / registerGradSwatch 共用一个判据。 */
function gradStopsValid(stops) {
  return Array.isArray(stops) && stops.length >= 2 && stops.length <= 5 &&
    stops.every(function (c) { return /^#[0-9A-Fa-f]{6}$/.test(String(c)); });
}

/**
 * 注册 / 更新一条用户色带。返回规范化后的色标（非法输入**一个字都不改**，返回当前值）。
 * ⚠️ 改色标要把这条色带**两张素材都作废**（静态与流动各一格）—— 只清一格的话，
 *    开着流动改色，正文里贴的还是上一组色的 GIF（「改了没反应」）。
 */
function registerGradSwatch(id, stops) {
  // 进来可能是**素材键**（`u123@flow`）—— 与 gradStopsOf 同一个口径，先剥后缀。
  var k = gradBaseKey(id);
  // 出厂预设不可改；`custom` 是「我的图片」的地址格，**绝不能**被当成色带注册进去
  // （注册了会让 gradStopsOf("custom") 返回一组色标，兜底实色就跟着乱）。
  if (!k || k === GRAD_DIY_KEY || k === GRAD_CUSTOM_KEY || GRAD_PRESETS[k]) return gradStopsOf(k);
  if (!gradStopsValid(stops)) return gradStopsOf(k);
  GRAD_USER[k] = stops.map(function (c) { return String(c).toUpperCase(); });
  setGradImageUrl(k, "");
  setGradImageUrl(k + GRAD_FLOW_SUFFIX, "");
  return GRAD_USER[k].slice();
}

/** 把一整批（从 chrome.storage 读回来的）注册进来 —— 开机同步用，不逐条作废素材。 */
function loadGradSwatches(map) {
  if (!map || typeof map !== "object") return 0;
  var n = 0;
  Object.keys(map).forEach(function (k) {
    var s = map[k];
    if (k === GRAD_DIY_KEY || k === GRAD_CUSTOM_KEY || GRAD_PRESETS[k]) return;
    if (!gradStopsValid(s)) return;
    GRAD_USER[k] = s.map(function (c) { return String(c).toUpperCase(); });
    n++;
  });
  return n;
}
/** 摘掉一条用户色带（用户在弹窗里点了那个 ×）—— 连素材格一起清。 */
function unregisterGradSwatch(id) {
  var k = gradBaseKey(id);
  if (!k || !GRAD_USER[k]) return false;
  delete GRAD_USER[k];
  setGradImageUrl(k, "");
  setGradImageUrl(k + GRAD_FLOW_SUFFIX, "");
  return true;
}

/** 当前有哪些用户色带（顺序 = 插入顺序，面板按它排）。 */
function gradSwatchIds() { return Object.keys(GRAD_USER); }
/** 这个键是不是一条已知色带（出厂预设 / 用户色带 / diy 都算）。 */
function gradKeyKnown(k) {
  var b = gradBaseKey(k);
  return !!(GRAD_PRESETS[b] || GRAD_USER[b] || b === GRAD_DIY_KEY);
}

/**
 * 素材键 → 色带键（去掉「流动」那个后缀）。
 * ---------------------------------------------------------------------------
 * ⚠️ 2026-10-09 用户报「流动只有第一个渐变色可以，其他颜色不能流动」—— 根因就在这里：
 *    素材是按**格子**存的，流动那张的键是 `ocean@flow`，而画它时要问「这条色带是哪几个
 *    色标」。当时直接拿 `ocean@flow` 去 GRAD_PRESETS 里查 ⇒ **查不到 ⇒ 静默退回默认那组**
 *    （`|| GRAD_PRESETS[GRAD_PRESET_DEFAULT]`）。flame 是默认组，所以只有它「碰巧是对的」，
 *    其余三组流动出来其实都是 flame 的颜色 —— 看起来就像「只有第一个能流动」。
 *    ⇒ 问色标之前必须先把后缀剥掉。这个坑的本质是**键有两套**（素材键 / 色带键），
 *      混用会静默退化，不会报错。
 */
function gradBaseKey(key) {
  var k = String(key || "");
  if (k === GRAD_DIY_KEY) return k;
  var suf = GRAD_FLOW_SUFFIX;
  if (suf && k.length > suf.length && k.slice(-suf.length) === suf) return k.slice(0, -suf.length);
  return k;
}

/** 某一路的色标（预设 4 组 / 自定义）。返回副本，别让外面改到表里的数据。
    ⚠️ 进来可能是**素材键**（`ocean@flow`），要先剥后缀 —— 见 gradBaseKey 那段注释。 */
function gradStopsOf(key) {
  const b = gradBaseKey(key);
  if (b === GRAD_DIY_KEY) return GRAD_DIY_STOPS.slice();
  // 用户自己存的色带（从 chrome.storage 读回来的那一批）—— 排在出厂预设**前面**：
  // 两边的键不会撞（用户键是 `u` + 时间戳），但先查运行时表语义上更对。
  if (GRAD_USER[b]) return GRAD_USER[b].slice();
  const p = GRAD_PRESETS[b] || GRAD_PRESETS[GRAD_PRESET_DEFAULT];
  return p.stops.slice();
}

/**
 * 改自定义色的色标（弹窗里点「用这组色」）。
 * ⚠️ 改完必须把 **diy 那张已上传的渐变条作废** —— 否则用户改了色，正文里贴的还是
 *    上一组色生成的那张图（表现为「改了没反应」）。作废后走 ensureGradImage 会重传。
 * 不合法（少于 2 个 / 多于 5 个 / 不是 #RRGGBB）就**一个字都不改**，返回当前值。
 */
function setGradStops(key, stops) {
  // 2026-10-09 晚：用户色带也要能通过这条路设色标（面板里「保存这条」会把它连同 stops
  // 一起 postMessage 给主世界，那侧照 id 注册 —— 与 diy 走的是同一条消息）。
  if (key !== GRAD_DIY_KEY) return registerGradSwatch(key, stops);
  if (!gradStopsValid(stops)) return gradStopsOf(key);
  GRAD_DIY_STOPS = stops.map(function (c) { return String(c).toUpperCase(); });
  // ⚠️ 静态与流动是**两格**，两格都要作废 —— 只清静态那格的话，
  //    开着流动时用户改了色，正文里贴的还是上一组色的 GIF（「改了没反应」）。
  setGradImageUrl(GRAD_DIY_KEY, "");
  setGradImageUrl(GRAD_DIY_KEY + GRAD_FLOW_SUFFIX, "");
  return GRAD_DIY_STOPS.slice();
}

/**
 * 当前**生效**的那一路渐变素材（预设键 / diy / custom）。
 * ---------------------------------------------------------------------------
 * 为什么不能在变体表里写死：变体 `grad` 的 `grad.preset` 是 `"flame"`（表是静态的），
 * 而用户在面板里可以选「日落 / 青蓝 / 薄荷 / 自定义」—— 写死的话，选了别的预设时
 * `gradTokensOf("flame")` 去查**flame 那一张**的地址，永远查不到 ⇒ 退化成实色
 * （2026-10-09 发现的第二个真 bug：换了预设色却没反应）。
 * ⇒ 变体表只负责「这套是渐变系」，**用哪一路**由这里说了算。
 *
 * ⚠️ 用 `var`：长图沙箱是分段 window.eval 拼的，顶层 const/let 不跨 eval 共享。
 */
var GRAD_ACTIVE = GRAD_PRESET_DEFAULT;
function setGradActive(key) { if (key) GRAD_ACTIVE = String(key); return GRAD_ACTIVE; }
/** 真正要用的键：「我的图片」在位时永远优先（与 gradTokensOf 内部同一个口径）。 */
function gradActiveKey() {
  if (gradImageUrlOf(GRAD_CUSTOM_KEY)) return GRAD_CUSTOM_KEY;
  return GRAD_ACTIVE || GRAD_PRESET_DEFAULT;
}

/**
 * A3 流动渐变（2026-10-09）：同一路色带要能出**两张**素材 —— 静态 PNG 与流动 GIF。
 * 两张必须存在**不同的格子**里，否则切来切去拿到的是同一张，开关就成了摆设。
 *
 * ⚠️ 「我的图片」那一路**不加后缀**：它是用户自己的文件，动不动由文件本身决定
 *    （用户传的就是 GIF 时它本来就会动），再分出一格只会白白多传一张。
 *
 * ⚠️ 用 `var`：长图沙箱是分段 window.eval 拼的，顶层 const/let 不跨 eval 共享。
 */
var GRAD_FLOW = false;
var GRAD_FLOW_SUFFIX = "@flow";
function setGradFlow(v) { GRAD_FLOW = !!v; return GRAD_FLOW; }
function gradFlow() { return !!GRAD_FLOW; }
/**
 * 渐变走向（静态外观）：横向 / 纵向 / 斜向。
 * 横向＝与出厂那两条一致（真机四轮验的就是它）；纵向是给「上下流动」用的
 * （纵向没色差就流不起来 —— 见 gradFlowAxis）；斜向只是把同一条条斜着铺。
 */
var GRAD_AXES = ["h", "v", "diag"];
function gradAxisOf(v) { return GRAD_AXES.indexOf(String(v || "")) >= 0 ? String(v) : "h"; }

/**
 * 流动方向（2026-10-09 用户：「流动的方向可以调整不，现在是向左滚动，可以设置向右向上向下不」）。
 * ---------------------------------------------------------------------------
 * ⚠️ 方向**不是**一个「样式参数」，它决定**素材怎么生成**：
 *     ← → 的色带沿 X 变化、↑ ↓ 沿 Y 变化，GIF 相位符号决定平移往哪边。
 *     所以生成端（blockbar 的 gradStripBlob / gradGifBlob）必须拿到它 ——
 *     只把方向写进 CSS 是没用的（背景是一张程序生成的位图，微信那边也不吃 CSS 动画）。
 * ⚠️ 默认 `left`，与改版前那一版**逐帧一致**（老文章 / 老测试不受影响）。
 */
var GRAD_FLOW_DIRS = ["left", "right", "up", "down"];
var GRAD_FLOW_DIR_DEFAULT = "left";
function gradFlowDirOf(v) {
  var d = String(v || "");
  return GRAD_FLOW_DIRS.indexOf(d) >= 0 ? d : GRAD_FLOW_DIR_DEFAULT;
}
/** 流动方向 → 色带走向：左右 = 横向（h），上下 = 纵向（v）。 */
function gradFlowAxis(dir) {
  var d = gradFlowDirOf(dir);
  return (d === "up" || d === "down") ? "v" : "h";
}
/** 流动方向 → 相位符号：+1 朝负轴走（← / ↑），-1 反之（→ / ↓）。 */
function gradFlowSign(dir) {
  return (gradFlowDirOf(dir) === "left" || gradFlowDirOf(dir) === "up") ? 1 : -1;
}

/** 素材在地址表里的**实际**键（静态与流动各一格）。 */
function gradAssetKey(key) {
  var k = key || gradActiveKey();
  if (k === GRAD_CUSTOM_KEY) return k;
  return GRAD_FLOW ? (k + GRAD_FLOW_SUFFIX) : k;
}

/**
 * 出厂两路色带的**图床地址（写死）** —— 2026-10-21 用户给的，两条都是 256×16 的 PNG 色带：
 *   · flame：左→右 洋红 #FF3D70 → 橙 #FF7A1B → 紫 #7C3AED（暖）
 *   · ocean：左→右 青 #00C5FF → 蓝 #0080F7 → 青绿 #00D9D4（冷）
 * 为什么要写死：「行内渐变」第一次点要是有没有地址就得先上传、等一秒，体验像坏了；
 * 写死之后**选了就用**，要换颜色再进弹窗改（改过色标会落到 diy 键、重新传一张，见 content.js 的 gradCommit）。
 * ⚠️ 这两条 URL 与色标必须同源：改了 `GRAD_PRESETS` 的颜色就要同步换图，否则画出来的还是旧色。
 */
var GRAD_SEED_URLS = {
  flame: "https://mmbiz.qpic.cn/mmbiz_png/YpIuibLcQ8jWDqLo5ICM21sEH1YZKQxGP0yeA2WViccFxs80KrVaUmichEQD6XyqJvOxwUO7wumiadhVj9pb7R0wUkNXWaum4ZVdNNq7Y57fndE/640?wx_fmt=png&from=appmsg",
  ocean: "https://mmbiz.qpic.cn/sz_mmbiz_png/YpIuibLcQ8jXDLB3ayxymfC4XMWBYZCC48Hl9XyRjibj4WzLh6Mqqiaabnc1DLoclIe3aibia63z9icpzJHic6sufe2dLic56kXyKiaY50YzZORiaRkjw/640?wx_fmt=png&from=appmsg",
};

/** preset → 图床地址（运行时注入；空 = 还没上传 / 上传失败）。出厂两条开局就带地址。 */
var GRAD_IMAGE_URLS = Object.create(null);
Object.keys(GRAD_SEED_URLS).forEach(function (k) { GRAD_IMAGE_URLS[k] = GRAD_SEED_URLS[k]; });
function setGradImageUrl(key, url) {
  if (!key) return "";
  if (url) GRAD_IMAGE_URLS[key] = String(url);
  else delete GRAD_IMAGE_URLS[key];
  return GRAD_IMAGE_URLS[key] || "";
}
function gradImageUrlOf(key) { return (key && GRAD_IMAGE_URLS[key]) || ""; }

/** 闭环后的色标（末尾补回首色）—— 画渐变条 / 编码 GIF 都用它。 */
function gradStopsClosed(presetKey) {
  const s = gradStopsOf(presetKey);
  return s.concat([s[0]]);
}

/** 渐变那三个「伪令牌」：{gradImage} 图址、{gradSize} 铺法、{grad0} 兜底实色。
    ⚠️ 它们不跟主题色走，只跟预设色带走 —— 所以不进 h1PaletteOf，在这里单独并入调色板。 */
function gradTokensOf(presetKey) {
  const custom = gradImageUrlOf(GRAD_CUSTOM_KEY);
  // ⚠️ 查的是**素材的实际键**（静态 / 流动各一格），不是用户选的那一路本身 ——
  //    否则开了「流动」还在查静态那张，表现为「开关开了没反应」。
  const url = custom || gradImageUrlOf(gradAssetKey(presetKey));
  // 自定义图在位时，**兜底实色仍要跟着用户选的那一路色带走**（不然换色没反应）。
  const forInk = custom ? (GRAD_ACTIVE || GRAD_PRESET_DEFAULT) : gradBaseKey(presetKey);
  return {
    gradImage: url ? ("url(" + url + ")") : "",
    // 预设渐变条：横向拉伸**无损**、纵向也无差别，铺满整行最像渐变字；
    // 自定义图：必须保持比例（`cover`），真机四轮 I1 已验「不变形」。
    gradSize: custom ? "cover" : "100% 100%",
    grad0: gradStopsOf(forInk)[0],
  };
}

/** 没有图址时要剥掉的那一组属性（退化成实色字 —— 变体注释里的硬约束 ③）。 */
var GRAD_PROPS = ["backgroundImage", "backgroundSize", "backgroundPosition", "backgroundRepeat",
                    "WebkitBackgroundClip", "backgroundClip", "WebkitTextFillColor"];
function stripGrad(o) {
  if (!o) return o;
  GRAD_PROPS.forEach(function (k) { delete o[k]; });
  return o;
}

/** 当前标题变体是不是渐变系 —— converter 用它决定内层 span 要不要打 data-bluevibe-grad。 */
function titleIsGrad(variant) {
  const v = TITLE_VARIANTS[variant];
  return !!(v && v.grad);
}

/** 变体表里用到的占位符 → 实际颜色。main 必须是已 normalize 的 #RRGGBB。 */
/**
 * 当前主题的**主色** —— 一切「跟随主题色」的地方（加粗高亮 / 荧光底 / 列表前缀 /
 * 浮板强调按钮 / 强调色同步）都从这里取。
 *
 * ⚠️ 千万别再写 `theme.styles.h2.color` 当主色来源（2026-09-24 修的真 bug）。
 *    合并标题表之前，二级标题的默认变体是「主题色标题」（`color` 正好 = 主色），
 *    于是「从 h2 取主色」是**巧合成立**的；v2.46.0 两级共用一套变体后，默认
 *    「色块刊头」的 `h2.color` 是**白色**（主色落在内层色块的 background 上），
 *    那些地方统统变成白色 —— 加粗高亮、荧光底、浮板按钮色全成了白字，
 *    在白底正文上**直接看不见**（实测：荧光底 rgba(255,255,255,.22)、强调色 #FFFFFF）。
 *    `theme.accent` 是主题自己的显式字段、与变体无关、永远可靠 —— 就该用它。
 *
 * @param theme 可以是完整主题对象，也可以是 { accent } 片段（浮板与面板都这么用）
 */
function themeMainColor(theme) {
  return (theme && theme.accent) || DEFAULT_ACCENT;
}

/* ==========================================================================
   深色底自动适配（2026-09-30）
   --------------------------------------------------------------------------
   用户在面板里给正文设了**深色背景**时，主题里那套「深字 + 浅底」的配色会整片糊掉
   （正文墨色 #242A26 压在深底上几乎看不见）。这里给出一套**规则化**的翻转，
   与「文章转贴图」(longpic.js，旧称「长图导出」) 的 bgStyle() 同构、数值一致 —— 两个模块一个口径。

   判据与调值都照 **微信公众号客户端暗黑模式算法**（wechatjs/mp-darkmode）：
     · 感知亮度 PB = (r*299 + g*587 + b*114) / 1000（与该算法 constant.js 同一套权重）
     · MIN_LIMIT_OFFSET_BRIGHTNESS = 65：前景与背景的 PB 差 < 65 就算「看不清」
   为什么要跟它对齐：我们写下的颜色最终会发到微信里，读者手机的暗黑模式**还会再跑一次**
   这套算法。两边判据一致，才不会出现「浅色模式一个样、暗黑模式另一个样」。
   反过来，只要差 ≥ 65，算法就**不会动**我们写下的值 —— 深浅两种模式渲染结果一致。

   用法：判定用 bodyBgNeedsLightText(底色)；派生用 h1PaletteOf(main, 底色)。
   `dark` 为空 = 不启用（原样返回），所以不传第三参的老调用点行为一字不变。

   对应关系（深底值 ↔ longpic 的 bgStyle 深底分支，同值）：
     text  #F2F4F8          / sub  rgba(255,255,255,.60)
     soft  rgba(255,255,255,.09)   / border rgba(255,255,255,.16)
   ========================================================================== */
var DARK_MIN_GAP = 65;                        // = mp-darkmode 的 MIN_LIMIT_OFFSET_BRIGHTNESS
var DARK_TEXT = "#F2F4F8";                    // 深底上的正文 / 标题色
var DARK_SUB = "rgba(255, 255, 255, 0.60)";   // 深底上的次要文字（图注等）
var DARK_SOFT = "rgba(255, 255, 255, 0.09)";  // 深底上的浅底（引用 / 代码块）
var DARK_BORDER = "rgba(255, 255, 255, 0.16)";
var DARK_BORDER_STRONG = "rgba(255, 255, 255, 0.32)";
// 「淡」装饰色（2026-10-10 · 大号编号用）。浅色档取黑 10.6% —— 选这个数不是为了好看，
// 是为了**在白纸上精确合成出 #E4E4E7**（用户截图里那个中性灰）：255 × (1 − 0.106) = 227.97。
// 深色档白 14%：与浅色档「比底色亮一点点」的强度对称，且比 DARK_BORDER(0.16)/DARK_SOFT(0.09)
// 正好夹在中间 —— 它是个**装饰字**，比浅底重、比普通边框轻。
var FAINT_LIGHT = "rgba(0, 0, 0, 0.106)";
var FAINT_DARK = "rgba(255, 255, 255, 0.14)";

/** 感知亮度（0~255）。权重与 mp-darkmode 的 constant.js 一致，不可随意改。 */
function perceivedLum(rgb) {
  if (!rgb) return 255;
  return (rgb.r * 299 + rgb.g * 587 + rgb.b * 114) / 1000;
}

/**
 * 这个底色需不需要把文字翻浅？
 * 判据是「现有正文墨色压上去还看不看得清」，与 mp-darkmode 判「文字 / 背景亮度差够不够」
 * 的规则同源（差 < 65 → 看不清）。用「对比不足」而不是「底够不够黑」来判，边界更准：
 *   #8A8F98（中灰，PB 142）与墨色差 101 → **不翻**（深字看得清，也确实更协调）
 *   #3B5998（中蓝，PB  87）与墨色差  46 → 翻浅
 * 认不出的值（空、渐变字符串）一律返回 false —— 不确定就别改用户的配色。
 */
function bodyBgNeedsLightText(bg) {
  return !contrastEnough(INK, bg);
}

/**
 * 「背景圆角看不看得见」—— 背景片与**公众号页面底（白）**的感知亮度差够不够。
 *
 * 背景圆角要成立，前提是**背景片和页面底不是同一个颜色**：页面底是白的（PB 255），
 * 我们的背景片若也接近白，那条弧线就没有边界、等于没设（用户 2026-10-13 点名：
 * 「背景圆角还要和公众号自己的背景色要有差别」）。
 *
 * ⚠️ 阈值取 6（不是 contrastEnough 那个 65）：65 是**读字**的门槛，这里只要"看得出有一条边"——
 *    两者差一个数量级，别合并。面板自带的建议底色 #F5F7FA 与白的差是 8.3 ⇒ 刚好过线
 *    （出厂那个浅灰卡片是能看见的）；再浅一点（#FBFCFD，差 3）就糊成一片了。
 * ⚠️ 认不出的值（空、渐变串、rgba）返回 true（= 不多嘴）—— 与 contrastEnough 同一条纪律：
 *    不确定就别替用户下结论。
 */
function bgCardVisible(bg) {
  const c = hexToRgb(bg);
  if (!c) return true;
  return Math.abs(255 - perceivedLum(c)) >= 6;
}

/**
 * 背景图的「铺法」（2026-10-14）—— 面板（隔离世界）与主世界都要用，所以放 themes.js
 * （它被两个世界各注入一次，见架构地图 §1 的硬规则）。
 *
 * 四档都有**真机依据**（`docs/设计稿/蓝调-渐变字-真机验证-结论.md` §八「四路对照」）：
 *   · cover   —— `cover`：保比例、铺满、多出的裁掉。真机判定「正常 / 不变形」
 *                ⇒ **自定义图案 / 照片的定案写法**，也是本功能的默认档。
 *   · tile    —— `auto` + `repeat`：双向平铺，整张图都看得到、保比例。
 *   · tileX   —— `auto 100%` + `repeat-x`：横向平铺。真机跑过、判定「平铺重复」，
 *                ⚠️ **会有接缝** —— 所以预设图必须是真无缝的，否则一眼看到格子缝。
 *   · stretch —— `100% 100%`：宽高各自独立缩放到盒子 ⇒ **不保比例**（真机判定「变形」）。
 *                留着只因为「纵向无信息」的图（如渐变条）拉起来无损；照片用它必变形。
 *
 * ⚠️ 认不出的 mode 一律退到 cover：宁可「裁掉一点」，也不要留下一个没写铺法的背景图 ——
 *    不写 size 时浏览器默认 `auto` + `repeat`，照片会平铺成一堆重复小图，比裁掉更难看。
 */
function bgImageProps(mode) {
  const ALL = {
    cover:   { size: "cover",     repeat: "no-repeat", position: "center center" },
    tile:    { size: "auto",      repeat: "repeat",    position: "left top" },
    tileX:   { size: "auto 100%", repeat: "repeat-x",  position: "left center" },
    stretch: { size: "100% 100%", repeat: "no-repeat", position: "left top" }
  };
  return ALL[mode] || ALL.cover;
}

/**
 * 背景图的四行长写 CSS。⚠️ 调用方必须把它排在 `background:` 简写**之后** ——
 * 简写会把 image / size / repeat / position 一并重置，顺序反了图就不见了。
 */
function bgImageUrlToken(url) {
  const u = String(url);
  /*
   * ⚠️ **默认写成不带引号的 `url(...)`**，不是 `url("...")`（2026-10-14 实测踩到）：
   *    bgImageCss 的结果会被拼进**双引号**的 `style="…"` 属性里，里面再用双引号
   *    会把属性当场截断 —— 症状是样式只剩 `background-image:url(`，图完全不显示。
   *    不带引号这个写法正是项目里两条**真机验证过的生产路径**用的：
   *    `themes.js` 的渐变字（gradImage）、`converter.js` 的压图封面都用它。
   *    只有当地址里出现会截断无引号 url() 的字符时，才退回**单引号**形式
   *    （双引号属性里单引号是安全的；文档里的真机示例也是单引号那种写法）。
   */
  // 引号**无论走哪条分支都要先转义**：结果最终落在双引号的 style="…" 属性里，
  // 留一个引号就把属性截断了（第一版只转义单引号，双引号漏网 —— 被用例抓出来）。
  const safe = u.replace(/"/g, "%22").replace(/'/g, "%27");
  if (/[\s()\\]/.test(safe)) return "url('" + safe + "')";
  return "url(" + safe + ")";
}

/**
 * 背景图的四行长写 CSS。⚠️ 调用方必须把它排在 `background:` 简写**之后** ——
 * 简写会把 image / size / repeat / position 一并重置，顺序反了图就不见了。
 */
function bgImageCss(url, mode) {
  if (!url) return "";
  const p = bgImageProps(mode);
  return "background-image:" + bgImageUrlToken(url) + ";"
       + "background-size:" + p.size + ";"
       + "background-repeat:" + p.repeat + ";"
       + "background-position:" + p.position + ";";
}

/** 铺法的选项表 —— 面板直接读这一张，别再抄第二份（抄了必然漂）。 */
function bgModeOptions() {
  return [
    { id: "cover",   label: "铺满" },

/** 认不出的 id 返回 null（调用方据此决定"不是预设"，而不是拿到一个瞎猜的）。 */
function bgPresetById(id) {
  const all = bgPresetList();
  for (let i = 0; i < all.length; i++) if (all[i].id === id) return all[i];
  return null;
}

/**
 * 这张小图能不能用于「平铺之外」的铺法？——**不能**。
 * 判据用数据（`tile <= 32`）而不是写死"预设一律平铺"：将来若真加了一张大图预设，
 * 它会自动获得完整的四种铺法，不用再改这里。
 */
function bgPresetIsMicroTile(id) {
  const p = bgPresetById(id);
  return !!(p && p.tile > 0 && p.tile <= 32);
}

/**
 * 这几张预设图的墨色不透明度。**实测值，不是设计值**：
 * 2026-10-14 把四张图床图下载下来逐像素量过，透明度只有 {0, 20}（= 7.84%），RGB 纯黑。
 * 暗色模式那段检查（用例 [5]）靠这个数算"底纹最浓处"压在生效底上还剩多少对比度 ——
 * 所以它是数据，别当成注释里的说明删掉；哪天真换了图，这个数要跟着重量。
 */
function bgPresetInkAlpha() { return 20 / 255; }

/**
 * 这个底色在微信暗色下会不会**被反相成近黑、而深色正文不跟着翻**（= 读者读不了）？
 * 阈值与微信算法对齐：`pb > 250`（tests/lib/darkmode.js 的 WHITE_LIKE）。
 * ⚠️ 权重必须是 299/587/114（= perceivedLum 那一套）—— 换权重就会和真机算法错开。
 * 认不出的值返回 false（不多嘴，与 bgCardVisible / contrastEnough 同一条纪律）。
 */
function bgColorDarkModeHazard(bg) {
  const c = hexToRgb(bg);
  if (!c) return false;
  return perceivedLum(c) > 250;
}

/**
 * 推荐底色（用户 2026-10-14：「可以默认推荐几个背景颜色，比如有适合 apple 风格的等」）。
 * 全部取**中性色**：带色味的浅底在微信暗色下会被钳成"浅灰浮岛"（规范 §五之二实测过），
 * 中性色才会被反相、融进整页。深色那两颗会自动把正文/标题翻成浅色（走 bodyBgNeedsLightText）。
 * ⚠️ 每颗都必须能让正文达到 4.5:1 —— 用例 [4] 会拿暗色检查器逐颗验。
 * ⛔ **不许再放纯白 #FFFFFF**：它的 pb=255 > 250，微信暗色会把它**反相成近黑**，
 *    而深色正文在"生效底变暗"时不会跟着翻浅 ⇒ 实测只有 **1.20:1**，读者根本读不了。
 *    （这条是第一版推荐表里真放过的错，被用例 [4] 当场抓出来。）
 *    想要"白"就用「近白」#F7F7F8（pb=247，视觉上几乎一样白，但安全）。
 */
function bgRecColors() {
  return [
    { hex: "#F5F5F7", name: "苹果灰" },
    { hex: "#F7F7F8", name: "近白" },
    { hex: "#FAF7F2", name: "暖白" },
    { hex: "#E4E4E7", name: "浅灰" },
    { hex: "#1D1D1F", name: "深空" },
    { hex: "#2C2C2E", name: "石墨" }
  ];

/**
 * 两个色的感知亮度差够不够（mp-darkmode 的 65）。**认不出的值一律算「够」** ——
 * 不确定就别去改用户写下的颜色。
 */
function contrastEnough(fg, bg) {
  const a = hexToRgb(fg), b = hexToRgb(bg);
  if (!a || !b) return true;
  return Math.abs(perceivedLum(a) - perceivedLum(b)) >= DARK_MIN_GAP;
}

/* --------------------------------------------------------------------------
   反方向：压在「主题色块」上的白字，主题色太浅时自动翻成墨色（2026-09-30 第二段）
   --------------------------------------------------------------------------
   变体表里的 `{white}` 用在「色块刊头 / 通栏色块」这类**整片主题色填充 + 白字**的标题上。
   主题色是用户自己挑的（取色器能给任意颜色），一旦挑了淡色（#FFD400 / #FFE066 这种），
   白字就直接糊在色块上看不见了 —— 用户得自己再去调「标题」色板，很别扭。

   阈值为什么是 150，而不是上面那条 65：
     · 65 回答的是「**官方暗黑模式算法会不会再动一次**」—— 那是对齐 mp-darkmode 的常量，动不得；
     · 150 回答的是「**白字压在这个色块上还看不看得清**」—— 换了个问题，就得换一个门槛。
       感知亮度 150 ≈ **WCAG 3:1（大字号 AA）** 的分界；标题最小 17px/700 已经算大字号，
       所以白字只要还够 3:1 就留着；过了 150 就换墨色（墨色在 150 上有 4.8:1，绰绰有余）。
     · 取 150 还顺带保证了**出厂预置色一个都不变**：最亮的「橙」#F5731F 是 144.3 < 150。
   认不出的值（空 / 渐变字符串）→ 维持白字，不确定就别改用户看到的颜色。

   ⚠️ 这个 150 **只管「白字」这一件事**（唯一消费方就是下面的 textOnAccent）。
      「主题色自己当墨用 / 当淡版令牌」是**另一条线**，见紧跟着的 ACCENT_INK_MIN_PB。
   ========================================================================== */
var ACCENT_TEXT_MIN_PB = 150;

/* --------------------------------------------------------------------------
   第二条线：主题色**自己**够不够深（2026-09-30 淡色主题色 · 二次调参）
   --------------------------------------------------------------------------
   用户看过对照稿后定的原话：「我觉得可以感知亮度 PB ≥ 190 再调整，要不然有些其实本身清楚的
   加深后反而色块太重了」。

   190 = **255 − 65** —— 与纸白的感知亮度差不到 65（正是 mp-darkmode 那条
   MIN_LIMIT_OFFSET_BRIGHTNESS），就说明这个色压在纸白上「差不多等于没有颜色」，才叫淡色。
   本机实测两个代表（单位：感知亮度 / 与纸白的差）：
     · #E8B84B 芥末黄 185.9 / 69 → 本身看得清 → **一律不动**
       （旧的 150 那条线会把它压深成 #BB943D，还把引用浅底变成一整块实心芥末黄
        —— 就是用户说的「有些其实本身清楚的，加深后反而色块太重」）
     · #FFD400 亮黄   200.7 / 54 → 当字看不见 → 压深

   为什么这条比 150 更**宽**（更不容易触发）—— 两条线问的是两个问题：
     · 150：一整片**白字**压在这个色块上够不够 3:1。承受方是白字、面积大，对比不足是灾难 → 严。
     · 190：这个色**自己**当墨写在纸白上够不够。承受方是纸白（255），差 65 就够 → 宽。
   ⚠️ 两条线**不许合并**：一合并，色块刊头的白字 / 墨字就会在 150~190 这一段来回跳
      （#E8B84B 上白字只有 1.9:1，那正是第五轮专门修掉的「看不清」）。
   ========================================================================== */
var ACCENT_INK_MIN_PB = 190;

/**
 * 这个主题色算不算「**淡色**」？判据 = 感知亮度 ≥ ACCENT_INK_MIN_PB（190）。
 *
 * 一个数、一条界线，服务两处**同源**的派生（都在这一个文件里，别在别处再判一遍）：
 *   ① 主题色当字色（accentInk）：≥190 在纸白上看不见 → 压深；
 *   ② 主题色的「淡版令牌」（soft / border / borderStrong）：见 h1PaletteOf 里的说明 ——
 *      淡色原色**本身**就是「淡版」，再乘一个 alpha 就等于没有。
 * 两处回答的都是同一句话：「这个色淡到连**自己当墨**都不够了吗」。
 * 认不出的值（空 / 渐变串）一律 false —— 不确定就别改用户的配色。
 *
 * ⚠️ 「色块上的白字要不要翻墨色」**不在这条线上** —— 那是 textOnAccent 的
 *    ACCENT_TEXT_MIN_PB（150），承受方是大面积白字，容差不一样。别顺手换成这个。
 */
function accentIsPale(color) {
  const c = hexToRgb(color);
  return !!c && perceivedLum(c) >= ACCENT_INK_MIN_PB;
}

/**
 * 压在主题色块上的可读字色：色块够浅就给墨色，否则白字。
 * ⚠️ 判据是 ACCENT_TEXT_MIN_PB（150），**不是** accentIsPale 那条 190 —— 见上面两条线的说明。
 *    这里刻意**不复用** accentIsPale：复用了就等于把两条线悄悄合成一条（本轮就是这么踩的）。
 */
function textOnAccent(accent) {
  const c = hexToRgb(accent);
  if (!c) return "#FFFFFF";
  return perceivedLum(c) >= ACCENT_TEXT_MIN_PB ? INK : "#FFFFFF";
}

/**
 * 用户**手工指定**的「文字 / 标题色」按正文底色校正一遍：
 *   · 底色不是深色（或没设）→ 原样返回，用户说了算；
 *   · 底色是深色、而指定的色压不住（对比不足）→ 返回 ""（让位给自动派生的浅色）。
 * 为什么要这条：色板就在「背景」旁边，用户很可能先在浅底下调过文字色、再改深底 ——
 * 那时同一个色值的语境已经变了，照旧沿用会得到「设了深底、字还是黑的、看不见」。
 * 而如果用户给的色本来就够亮（比如 #E0E0E0），照旧尊重他，不做无谓覆盖。
 * ⚠️ 两处消费（converter.js 的 inheritTypography、blockbar.js 的 theme）共用这一条规则，
 *    别各判一遍 —— 判据抄两份必然漂。
 */
function effectiveInkColor(color, bg) {
  if (!color) return color;
  if (!bodyBgNeedsLightText(bg)) return color;
  return contrastEnough(color, bg) ? color : "";
}

/**
 * 把前景色提亮到「与底色亮度差 ≥ gap」（默认 65）—— 向白色插值 + 二分找最小混合量。
 * 目的是让暗黑模式算法**不再二次调整**它（差够了它就原样保留），深浅两种模式渲染一致；
 * 否则浅色模式是原色、暗黑模式被算法提亮，成了两种观感。
 */
function liftForBg(fg, bg, gap) {
  const c = hexToRgb(fg);
  if (!c) return fg;
  // +1 是给 rgbToHex 的取整留余量：不留的话二分收敛到 64.998（< 65），
  // 暗黑模式算法就会把它当成「还不够」再动一次（2026-09-30 实测抓到）。
  const need = Math.min(255, perceivedLum(hexToRgb(bg)) + (gap == null ? DARK_MIN_GAP : gap) + 1);
  if (perceivedLum(c) >= need) return normalizeHex(fg);
  let lo = 0, hi = 1;
  for (let i = 0; i < 20; i++) {
    const t = (lo + hi) / 2;
    if (perceivedLum({ r: c.r + (255 - c.r) * t, g: c.g + (255 - c.g) * t, b: c.b + (255 - c.b) * t }) >= need) hi = t;
    else lo = t;
  }
  return rgbToHex(c.r + (255 - c.r) * hi, c.g + (255 - c.g) * hi, c.b + (255 - c.b) * hi);
}

/* ==========================================================================
   反方向之二：主题色**当文字墨用**时，淡色自动压深（2026-09-30 淡色主题色）
   --------------------------------------------------------------------------
   用户原话：「如果主题色选择淡色，一些**本身没有背景**的主题色比如**加粗加亮**的设置，
   比如**主题色标题**，可以加深成主题色的深颜色版吗……要不然主题色淡了有些标题样式是会
   看不清楚的」。

   为什么需要这一段：上一段管的是「色块**底**太浅 → 压在底上的字翻墨色」，可还有一大批
   主题色**根本没铺底**、直接当字用 —— 主题色标题（accent 变体整个标题就是主题色）、
   链接、列表符号、行内代码、加粗高亮、h3 左竖条、hr、th 底线……
   这些在纸白上，淡色（#FFD400 只有 1.4:1）就是**看不见**，用户得自己再去调一次色板。

   两条约束取更严的那个（`need` = 目标感知亮度上限）：
     ① PB ≤ ACCENT_INK_MIN_PB（190）—— 「淡色分界」，与 accentIsPale / 淡版令牌**同一个门槛**。
        注意纸白（255）上这一条算出来是 189（下面那句 −1 的取整余量），所以**纸白上真正
        起作用的是 ②**；① 的作用是给「底比纸白还亮」的极端情况兜个上限，
        并让「淡色」这个概念在三个地方同值（判淡色 / 压字色 / 不稀释令牌）。
     ② 与底色亮度差 ≥ DARK_MIN_GAP（65）—— 底色本身不白时（浅灰卡 / 米色纸）起作用的就是它。
   两条合起来的效果很好描述：**只有与纸白差不到 65 的颜色才会被动**。与纸白差 ≥ 66
   （= 出厂预置 5 色、以及一切「本身看得清」的色）逐字节不变 —— 用户说的
   「有些其实本身清楚的」就是这一批。

   ⚠️ 压深的方向是**向黑等比缩放 r:g:b** —— 色相与 HSL 饱和度都不变，只是变浅变深，
      所以得到的确实是「主题色的深色版」，不是变成灰。
   ⚠️ 用二分找**最小**压深量而不是「一刀切压到底」：阈值附近才是连续的
      （PB 189.9 几乎不动、190.1 也几乎不动），用户在取色器上拖过去不会突然跳一下。
   ⚠️ 这个函数只管「当字色」的用法。**色块底绝不能过这一道** —— 底加深了，压在它上面的
      字反而没对比度（那是 textOnAccent 管的事）。分辨办法见 resolveVariantTokens。
   ⚠️ longpic.js 里有一份同构实现，改这里必须想着那里。
   ========================================================================== */
function accentInk(main, bg) {
  const c = hexToRgb(main);
  if (!c) return main;                                  // 认不出（空 / 渐变串）→ 原样，别乱改用户配色
  if (bg && bodyBgNeedsLightText(bg)) return liftForBg(main, bg, DARK_MIN_GAP);  // 深底 → 反过来提亮
  const base = hexToRgb(bg) || hexToRgb("#FFFFFF");
  // `- 1` 与 liftForBg 的 `+ 1` 同理：给 rgbToHex 的取整留余量，否则会收敛到边界上差 0.x，
  // 官方暗黑模式算法或下一轮判据可能把它当成「还不够」再动一次。
  const need = Math.max(0, Math.min(ACCENT_INK_MIN_PB, perceivedLum(base) - DARK_MIN_GAP - 1));
  if (perceivedLum(c) <= need) return normalizeHex(main);   // 本来就够深 → 出厂 5 色一个都不动
  let lo = 0, hi = 1;
  for (let i = 0; i < 20; i++) {
    const t = (lo + hi) / 2;
    if (perceivedLum({ r: c.r * (1 - t), g: c.g * (1 - t), b: c.b * (1 - t) }) <= need) hi = t;
    else lo = t;
  }
  return rgbToHex(c.r * (1 - hi), c.g * (1 - hi), c.b * (1 - hi));
}

/**
 * 变体调色板。@param dark **正文底色**（如 "#1F2430"）；为空 = 浅色模式，返回原值。
 * ⚠️ **要不要翻由函数自己判**（bodyBgNeedsLightText）—— 调用方直接把正文底色丢进来即可，
 *    不必先判一次。2026-09-30 验证时抓到：早先写成「传了值就翻」，中灰底（#8A8F98，深字
 *    其实看得清）也会被翻浅，白白改掉用户配色。判定收进来只有一个入口，漏判不了。
 * ⚠️ 浅色分支与深色分支都给出 `sub` / `border` 两个键 —— 形状一致，调用方不必判空。
 *
 * ⚠️⚠️ `main` 与 `mainSolid` 是**同一个主题色的两个身份**，别混用：
 *     · `main`       —— 主题色**当字色 / 描边色**用（=`accentInk` 压深过的版本）
 *     · `mainSolid`  —— 主题色**铺底色**用（永远是用户挑的那个原色）
 *     淡色主题色当字看不见 → 字要压深；可色块底压深了，压在它上面的字反而没对比度。
 *     `soft` / `border` / `borderStrong` 仍由**原色**派生（它们是「主题色淡版」这一族，
 *     与引用块浅底、发丝边是同一套，加深了就不协调了）。
 */
function h1PaletteOf(main, dark) {
  // 原色（铺底色用）：认不出的值原样留着，别悄悄换成默认蓝
  const solid = hexToRgb(main) ? normalizeHex(main) : main;
  if (dark && bodyBgNeedsLightText(dark)) {
    // ⚠️ 顺序不能反：**先**把主色提亮，**再**按提亮后的主色判色块上的字色。
    // 深底会把主色顶亮（深灰底 + 深主色就是这一档），顶亮之后白字也会压不住 ——
    // 拿提亮前的值去判，就会留下「色块变浅了、字还是白的」。
    const lifted = liftForBg(main, dark, DARK_MIN_GAP);
    // 深底这一档两个身份合一：提亮后的值本来就与底色差 ≥ 65，当字够亮、当底也是它。
    return {
      main: lifted,
      mainSolid: lifted,
      text: DARK_TEXT,
      sub: DARK_SUB,
      white: textOnAccent(lifted),
      soft: DARK_SOFT,
      border: DARK_BORDER,
      borderStrong: DARK_BORDER_STRONG,
      // 「淡」令牌（2026-10-10 随「大号编号」一起加）：**中性**的、故意很弱的装饰色 ——
      // 给「底纹式大号编号 / 它的那条发丝线」用。见浅色分支同一处的长注释。
      faint: FAINT_DARK,
      // 正文 / 加粗的「字色」：深底这一档两者都翻浅（与 DARK_TEXT 同值）
      body: DARK_TEXT,
      strong: DARK_TEXT,
      // 荧光高亮（标题「荧光标记」用）：深底上取**提亮版主题色 + 0.30**——
      // 低透明度色合成在深色页面上自然变暗，既不刺眼又保住「这是主题色」的识别度。
      mark: toRgba(lifted, 0.30),
    };
  }
  const ink = accentInk(main, dark);
  const pale = accentIsPale(solid);
  return {
    // 当字色用 → 淡色压深（出厂 5 色都够深，一个都不动）
    main: ink,
    mainSolid: solid,
    text: INK,
    // 正文 / 加粗的「字色」：浅底这一档才和 INK 分开 ——
    //   正文 #3F434A（用户 2026-10-21 指定 rgb(63,67,74)）、加粗 #111827（rgb(17,24,39)）。
    // ⚠️ 必须走调色板令牌：写死在 styles 里的话，深底那一档就不会翻浅（整篇黑字压黑底）。
    body: BODY_INK,
    strong: STRONG_INK,
    sub: "#8A8F99",
    // `white` 这个名字沿用（变体表里的 {white} 占位符就不必动那 5 处），
    // 但它现在是**算出来的**：压在主题色块上的可读字色。淡色主题色 → 墨色。
    // ⚠️ 判据必须用**原色 solid**（色块底铺的就是它），不能用压深后的 main。
    white: textOnAccent(solid),
    // ── 主题色的「淡版令牌」在淡色主题色下会发生什么（2026-09-30 淡色主题色 · 用户点名）──
    // 用户原话：「引用背景本来用的是主题色的淡版，如果主题色选的淡的话是不是就可以直接用
    // 主题色了」「井号前缀的虚线 / 底色块标题的背景色 / 极简细线的线也要加深」。
    //
    // 一句话：**淡色原色本身就是「淡版」，再乘一个 alpha 就等于没有。**
    // 所以淡色时两个令牌各走各的「不稀释」版本，而且**基色不同**（这不是偷懒，是有原因的）：
    //   · soft（底：引用 / 代码块 / 标题底色块）→ 直接用**原色**。
    //     底是大面积、承的是墨色正文（墨色 PB 39.8 与 PB ≥ 190 的底差 ≥ 150，绰绰有余），
    //     直接用原色既看得见又不抢眼 —— 这也是用户点名要的「引用背景直接用主题色」。
    //     ⚠️ 触发的线是 ACCENT_INK_MIN_PB（190）而不是 150 —— 用户看过对照稿后把这条线放宽了：
    //        150~190 这段（芥末黄 #E8B84B 这类）「本身看得清」，引用底就该还是 10% 的浅版，
    //        不该变成一整块实心色 —— 原话「加深后反而色块太重了」。
    //   · border / borderStrong（线：代码块框 / 表格线 / 极简细线 / 井号虚线）→ 用**压深版**。
    //     细线要跟**纸白**本身拉开差距，而淡色原色与纸白几乎同色（#FFD400 只有 1.43:1）——
    //     哪怕不稀释也还是看不见。所以线的基色必须换成压深版，否则「加深」是假的。
    //   ⚠️ alpha 也一并去掉（不再乘 0.28 / 0.58）：淡色下任何稀释都会立刻跌破可见阈值
    //      （实测 #FFD400 的压深版 #F0C800 乘 0.58 → 合成 #F6DF6B，只剩 1.34:1）。
    //   ⚠️ 深色模式下的取舍：这段注释上面那套「半透明底」是为了让底跟着深色页面一起暗下去。
    //      淡色主题色这一档放弃半透明，是有意的 —— 不透明浅色底在深色模式下会被官方算法
    //      压到亮度 190 左右（变成一块暗黄；与 ACCENT_INK_MIN_PB 恰好同数，只是巧合，
    //      一个是「我们判淡色的线」、一个是「官方暗黑模式的钳位」，别把两件事混起来），
    //      加上块内文字会被算法提亮，仍然读得下去。
    //   ⚠️ 非淡色时两个令牌与**上一轮逐字节相同**（这是硬约束，见 tests/test-accent-ink.js）。
    // ⚠️ `{soft}` 这个令牌**必须存在**：引用「浅底块 / 竖线 + 浅底」与标题「底色块」都用它 ——
    //    漏了的话占位符会**原样留在样式里**（resolveVariantTokens 找不到就保留 {soft}），
    //    那不是合法 CSS、会被 CSSOM 直接丢掉 → 底色悄悄没了（2026-09-24 修）。
    soft: pale ? solid : toRgba(solid, 0.10),
    border: pale ? ink : toRgba(solid, 0.28),
    // 发丝边同样用「主题色 + 透明度」而不是「混白的不透明色」：后者在微信深色模式下
    // 会被只压到亮度 190，在深底正文里成一条浅灰线（见 makeDefaultStyles 顶部说明）。
    // 白底上的合成结果与 tint(main, .42) 完全等价（1 - 0.58 = 0.42），浅色模式像素级不变。
    borderStrong: pale ? ink : toRgba(solid, 0.58),
    // 荧光高亮（标题「荧光标记」用）：与正文「加粗高亮 / 荧光标记」的 markFill 同一手法、同 alpha。
    // ⚠️ 淡色主题色时基色换成**压深版**（与 border / borderStrong 同一条判据）——
    //    淡色原色再乘 0.22 就等于没画（#FFD400 × .22 在白底上只剩 1.05:1）。
    mark: pale ? toRgba(ink, 0.22) : toRgba(solid, 0.22),
    // ── `faint`（2026-10-10 新增 · 「大号编号」专用）──────────────────────────────
    // 它是**唯一一个不跟主题色走**的令牌，理由是素材本身就要求中性色：
    //   用户 2026-10-10 给的截图里，「01」那个大号数字与标题下面那条通宽发丝线，
    //   实测**同一个值 = rgb(228,228,231) / #E4E4E7**（1446×452 的图，两处都采样过），
    //   而正文是 #52525B、标题是 #27272A —— #E4E4E7 是个**中性灰**，
    //   不是任何主题色的淡版。硬套主题色会立刻丢掉「像页码/目录号」的那股编辑感。
    // ⚠️ 但**不能**写死 #E4E4E7：深色模式下它是一块刺眼的白（用户点名「涉及标题的
    //    都要考虑暗黑模式的适应」）。所以做成**两档**：
    //      浅色 = 黑 10.6% → 在纸白上合成为 (227.97…) ≈ **#E4E4E7**，与截图逐位对上；
    //      深色 = 白 14%   → 在深底上合成出一个比底色亮一档的「鬼影灰」。
    //    ⚠️ 用半透明黑/白而不是写死两个 hex：浅色档被换到别的浅色纸上、深色档被换到
    //       用户自选深色底上，半透明版本都还能自己贴合过去。
    // ⚠️ 与 `mark` 的分工：`mark` 是「主题色的荧光版」（当**底**用），
    //    `faint` 是「中性的鬼影」（当**装饰字 / 装饰线**用）。两者别互借。
    // ⚠️ 它在 color 槽上是**合法**的 —— 大号编号天生低对比，那是设计要求，不是 bug。
    //    tests/test-accent-ink.js 的 [9] 体检为此专门开了一条白名单（见那边的注释）。
    faint: FAINT_LIGHT,
  };
}

/**
 * 变体样式里的占位符替换：{main} {text} {white} {soft} {borderStrong} {mark} → 实际色值。
 * 所有变体表（标题 / 引用 / 列表）共用这一个，别各写一份 —— 抄两份必然漂。
 * ⚠️ `{white}` 读作「**压在主题色块上的字色**」，不是「白色」：主题色够浅时它是墨色
 *    （见 h1PaletteOf / textOnAccent）。名字沿用是为了不动变体表那 5 处。
 * ⚠️ 令牌清单是**契约**：加一个就要两处加（本文件 h1PaletteOf + longpic.js 的同构副本），
 *    tests/test-accent-text.js 的 [6] 会把「变体表用到、调色板给不出」的令牌直接点出来。
 *
 * ⚠️⚠️ `{main}` 也是**两个身份**，靠**属性名**分流（2026-09-30 淡色主题色）：
 *     · `background`   → `mainSolid`（原色）—— 色块底必须还是用户挑的那个色。
 *       底一旦被压深，压在它上面的 {white} 反而没了对比度（那是 textOnAccent 的活）。
 *     · 其余（color / border*） → `main`（`accentInk` 压深过的）—— 它们是「画在纸上的
 *       笔画」，淡色主题色在这两处就是看不见。
 *   为什么按属性名判而不是给 {main} 拆成 {ink}/{fill} 两个名字：拆名字要动三张变体表
 *   里十几处写法 + 全部文档注释，而「铺底 vs 画字」这条界线本来就与属性名一一对应
 *   （现存 9 套标题变体里，`{main}` 只在这三处当 background：block 的 span、
 *   banner 的 h1/h2）。**加变体时若写出 `{main}` 当底色，这里会自动按原色处理**，
 *   正是想要的行为 —— 不用记得回来改。
 */
function resolveVariantTokens(o, pal) {
  const out = {};
  for (const k in (o || {})) {
    out[k] = typeof o[k] === "string"
      ? o[k].replace(/\{(\w+)\}/g, function (m, t) {
          if (t === "main" && /^background/i.test(k) && pal.mainSolid !== undefined) return pal.mainSolid;
          return pal[t] !== undefined ? pal[t] : m;
        })
      : o[k];
  }
  return out;
}

/**
 * 取某个标题变体的四件套：{ h1, h2, inner, mark, markStyle, variant }。
 * inner 为 null 表示该变体**不需要**内层 span（converter 的 wrapHeadInner 会把它卸掉）；
 * mark 为 null 表示没有前导图形（wrapHeadMarks 会把已有的图形 span 卸掉）。
 * 变体名不认识时回退默认变体（不抛错 —— 用户存的老配置可能带着已删掉的变体名）。
 */
function titleStylesOf(main, variant, dark) {
  const key = TITLE_VARIANTS[variant] ? variant : TITLE_DEFAULT;
  const v = TITLE_VARIANTS[key];
  // 渐变系：把「图址 / 铺法 / 兜底实色」三个令牌并进调色板 —— 其余令牌照旧来自主题色。
  // ⚠️ 用哪一路素材是**运行时**的（gradActiveKey），不是变体表里的 `v.grad.preset`：
  //    那一份只是「这套是渐变系」的标记，写死它的话用户换了预设色也永远读 flame 那张图。
  const pal = v.grad
    ? Object.assign({}, h1PaletteOf(main, dark), gradTokensOf(gradActiveKey()))
    : h1PaletteOf(main, dark);
  const h1 = resolveVariantTokens(v.h1, pal);
  const h2 = resolveVariantTokens(v.h2, pal);
  const inner = v.inner ? resolveVariantTokens(v.span, pal) : null;
  // ⚠️ 硬约束 ③：没有图址 ⇒ 剥掉渐变那一组、退化成实色字。
  //    留着 `-webkit-text-fill-color:transparent` 而背景图缺失 = 整条标题消失，这是最坏的结果。
  if (v.grad && !pal.gradImage) { stripGrad(h1); stripGrad(h2); stripGrad(inner); }
  return {
    variant: key,
    h1: h1,
    h2: h2,
    inner: inner,
    mark: v.mark || null,
    markStyle: v.markStyle ? resolveVariantTokens(v.markStyle, pal) : null,
    // 渐变系标志（给面板缩略图用）：**有这个标志就画渐变条**，不看当前有没有图址 ——
    // 缩略图的职责是「告诉你选这个会得到什么」，而不是「实时反映上传进度」；
    // 图还没上传完就退化成色块刊头的样子，用户在面板上会认不出这两套。
    grad: v.grad || null,
  };
}

/**
 * 该变体的前导图形要写什么文字（null = 没有图形）。
 * @param n     它在本级标题里的序数（从 1 起，只有 mark.counter 用得到）；
 *              mark.counter 为真时按 mark.pad 补零（pad:2 → "01"），只补不截
 * @param level 级别（"h1" / "h2"），只有 mark.byLevel 用得到 —— 「井号前缀」按级别重复 # 号
 *              （H1 一颗、H2 两颗）。调用点两处：converter 的 wrapHeadMarks 与浮板的标题分支，
 *              两边都必须把 level 传进来，否则 H2 会少一颗 #。
 */
function titleMarkText(variant, n, level) {
  const v = TITLE_VARIANTS[variant];
  if (!v || !v.mark) return null;
  if (v.mark.glyph) {
    const g = listMarkerGlyph({ marker: v.mark.glyph });
    if (v.mark.byLevel) {
      const lv = (level === "h3" || level === "h4") ? 2 : (level === "h2" ? 2 : 1);
      return new Array(lv + 1).join(g);
    }
    return g;
  }
  if (v.mark.counter) {
    // 补零（`mark.pad`，2026-10-10 随「大号编号」numTop 一起加 —— 它的编号是两位数 01 / 02）。
    // ⚠️ **只补不截**：pad 是「至少几位」，第 100 个标题仍然输出 "100"，
    //    不会变成 "00"（那会撞号）。
    const pad = parseInt(v.mark.pad, 10) || 0;
    let out = String(n > 0 ? n : 1);
    while (pad > 0 && out.length < pad) out = "0" + out;
    return out;
  }
  return null;
}

/** 该变体有没有前导图形（converter 据此决定包 / 卸图形 span）。 */
function titleHasMark(variant) {
  const v = TITLE_VARIANTS[variant];
  return !!(v && v.mark);
}

/**
 * 该变体的前导图形要不要挂 `data-ignore-dm="low-contrast"`（官方规范 §4.6 豁免）。
 * 只有「装饰色故意很淡 / 自带实心底」的图形需要 —— 见 themes.js 里 numTop / numBlock
 * 各自的 mark.ignoreDm 注释。converter 的 wrapHeadMarks 与浮板的 buildReplacement
 * **两处出生点**都要读它，漏一处就会「浮板插进去弹警告、点一次应用主题才不弹」。
 */
function titleMarkIgnoreDm(variant) {
  const v = TITLE_VARIANTS[variant];
  return !!(v && v.mark && v.mark.ignoreDm);
}

/** 该变体是否需要内层色块 span（converter / 浮板据此决定包 / 卸）。 */
function titleNeedsInner(variant) {
  return !!(TITLE_VARIANTS[variant] || TITLE_VARIANTS[TITLE_DEFAULT]).inner;
}

/** 供面板渲染的标题变体清单（顺序即 TITLE_VARIANTS 的书写顺序）。 */
function titleVariantList() {
  return Object.keys(TITLE_VARIANTS).map(function (k) { return { id: k, label: TITLE_VARIANTS[k].label }; });
}

/* ---------- 旧名兼容层（H1 / H2 已合并成「标题」一张表） ----------
   ⚠️ 2026-10-05 清理：原注释写着「这两个名字仍在用」，但 `h1StylesOf` / `h2StylesOf`
   **在源码、用例、文档里一处调用都没有**（只有自查报告的历史条目提过它们）——「按级取样式」

   下面这两个**是真的还在用**，保留：`h1VariantList` 有专门用例守着别名可用；
   `h1NeedsInner` 被浮板与 converter 按名调用（见各自注释）。 */
/** 旧名兼容：合并前它只列「一级标题」的 5 个，现在列整张标题表的全部（9 个）。 */
function h1VariantList() { return titleVariantList(); }
/** 旧名兼容（浮板与 converter 仍在用这个名字）。 */
function h1NeedsInner(variant) { return titleNeedsInner(variant); }

/* ==========================================================================
   引用 / 列表变体表（块变体库后两块，2026-09-24）
   --------------------------------------------------------------------------
   与 TITLE_VARIANTS 同构，约定一样：只写结构 / 间距 / 字号，颜色写成占位符
   {main} {soft} {text} {borderStrong} {mark} → 换主题色时一起变色（版式与颜色正交）。
   加变体只改这里，面板读 blockVariantList() 自动渲染，不用动 UI 代码。

   原来的「二级标题」表（accent / chip / underline）已并入 TITLE_VARIANTS —— 它们在那里
   同时给出了 h1 与 h2 两条样式，见上。
   ========================================================================== */
/* 引用：变体分成两条样式 —— quote（外层块，承载底色/边框/内边距）与 p（块内段落）。
   外层块经过 demoteSemanticBlocks 会变成 p[data-bluevibe-role="blockquote"]，
   两条都要给，多段引用的拼接（quotePartStyle）拆的也是外层块那条。 */
/* ---------- 巨大句号（2026-10-10 · 大字浅底专用） ----------
   用户 2026-10-10 从预览页（docs/设计稿/蓝调-无框粗排-大句号效果-预览.html）里
   拍板了「句号显示得和字一样高」。**最终实现是「换字符」，不是「放大字号」** ——
   这是真机教训换来的，来龙去脉见下，别改回去。

   ▍现在的做法：把全角句号 `。` 换成一个**本身就是圆圈、且天然与汉字同高**的字符
     `〇`（U+3007 表意文字零号）。**零行内样式**。

   ▍为什么不是「放大 `。` 的 font-size」（第一版方案，已废弃）：
     第一版照抄预览页量出来的参数，写了这么一颗 span（现在只在注释里留档）：

       <span data-bluevibe-punct="1" style="display:inline-block;line-height:0;
         font-size:2.647em;vertical-align:-0.0043em;margin:0 -0.561em 0 -0.061em;">。</span>

    const text = String(customText || "").trim().slice(0, 2) || "\u25C6";
    return { key: LIST_PREFIX_CUSTOM, label: "自定义", kind: "sym", glyph: text,
             markerSize: 15, gap: 8, box: customPrefixBox(text), custom: true };
  }
  const v = LIST_PREFIXES[id];
  if (!v) return null;
  return {
    key: id, label: v.label, kind: v.kind,
    glyph: v.marker !== undefined ? listMarkerGlyph(v) : null,
    format: v.format,
    markerSize: v.markerSize, gap: v.gap,
    box: v.kind === "sym" ? v.markerSize + 2 : v.markerBox,
    custom: false,
  };
}

/**
 * 列表：{ ul, ol, li, liText, marker, olMarker, prefix, kind, markerSize }。
 *
 * 前缀只有**一个**（这就是合并的核心）：ul 与 ol 拿到同一套内边距与同一份标记样式 ——
 * 「这一行是符号还是序号」由前缀自己决定，不再由 ul / ol 标签决定。
 * marker 与 olMarker **在前缀是序号时**指向同一份；前缀是符号时 olMarker 另给一份「数字盒子」
 *（v2.48.9：<ol> 要显示 1. / 2.，不能因为是符号主题就丢掉顺序语义），详见下面 numMark 的说明。
 *
 * 悬挂缩进仍靠「挂角盒子」：盒子宽 = 前缀宽度，负左边距同宽，
 * 列表的左内边距 = 盒子 + 间隙。于是文字从内边距处起排（折行也对齐），
 * 前缀落在左边那道沟里 —— 与浏览器原生 list-style-position:outside 的观感一致。
 *
 * @param prefix   前缀名（LIST_PREFIXES 的键，或 "custom"）
 * @param legacy   旧调用点的第二个前缀名（合并前的 olVariant）—— 仅当前面取不到时才用
 * @param customText 自定义前缀的字符（prefix === "custom" 时用）
 */
function listStylesOf(main, prefix, legacy, customText, dark) {
  // 深底时符号 / 序号也要跟着提亮（它们的颜色就是主题主色）；
  // 列表**文字**走 liText（深底时同样翻浅），不跟着主色漂。
  const pal = h1PaletteOf(main, dark);
  const mk = pal.main;
  const p = listPrefixInfo(prefix, customText)
    || listPrefixInfo(legacy, customText)
    || listPrefixInfo(LIST_PREFIX_DEFAULT);
  const box = p.box;
  const pad = (box + p.gap) + "px";
  const noList = { listStyleType: "none", listStyle: "none" };
  // 符号：居中 + 按变体字号；序号：右对齐（1. / 10. 的右边缘齐成一条线）、字号跟随列表文字。
  const mark = p.kind === "sym"
    ? { display: "inline-block", width: box + "px", marginLeft: "-" + box + "px",
        fontSize: p.markerSize + "px", fontWeight: "700", color: mk,
        lineHeight: "1", textAlign: "center" }
    : { display: "inline-block", width: box + "px", marginLeft: "-" + box + "px",
        fontWeight: "700", color: mk, lineHeight: "1", textAlign: "right" };
  // 有序列表（<ol>）专用的挂角样式，v2.48.9 新增。
  //   ① 前缀本身是序号 → 与 mark 同一份（此时 ul/ol 都是序号，观感必须一致，保持 v2.46.0 的合并口径）；
  //   ② 前缀是**符号** → 另做一份「数字盒子」：原文里写着 <ol>，表达的就是「第 1 步 / 第 2 步」，
  //      让符号前缀把顺序信息吃掉是丢内容。converter 的 wrapListMarkers 仍会让这一项显示
  //      `1.` / `2.`（退回 decimal 格式），所以盒子必须跟着改成序号那一套 ——
  //      数字比符号宽，居中盒子 + 居中/左对齐会压到文字上，改成右对齐（1. / 10. 右边缘齐成一条线）。
  //   ⚠️ 盒子宽度取 decimal 的 18px，**不动** ol 的 paddingLeft：符号前缀下 ul / ol 的左内边距
  //      都是 25px（17 + 8），25 ≥ 18，盒子放得下，正文起始位在 ul / ol 之间保持对齐。
  const numBox = (listPrefixInfo("decimal") || { box: 18 }).box;
  const numMark = { display: "inline-block", width: numBox + "px", marginLeft: "-" + numBox + "px",
                    fontWeight: "700", color: mk, lineHeight: "1", textAlign: "right" };
  return {
    prefix: p.key,
    kind: p.kind,
    custom: !!p.custom,
    markerSize: p.markerSize,
    ul: Object.assign({ paddingLeft: pad, margin: "16px 0", color: mk }, noList),
    ol: Object.assign({ paddingLeft: pad, margin: "16px 0", color: mk }, noList),
    li: { paddingLeft: "0", margin: LIST_LI_MARGIN + "px 0", color: mk, lineHeight: "1.8" },
    // 列表项「文字」色：li 的 color(main) 只作用于符号兜底，文字单独走 liText（正文墨色）。
    liText: { color: pal.body },
    marker: mark,
    olMarker: p.kind === "num" ? mark : numMark,
  };
}

/**
 * 第 n 项（n 从 1 起）在该前缀下要显示的文本 —— converter 的 wrapListMarkers 与面板缩略图
 * 都走这一个入口，所以「改前缀」不会出现「正文换了、缩略图没换」。
 * 不传 n 时按第 1 项算（面板画样本用）。
 */
function listMarkerTextOf(prefix, n, customText) {
  const p = listPrefixInfo(prefix, customText) || listPrefixInfo(LIST_PREFIX_DEFAULT);
  if (p.kind === "sym") return p.glyph;
  return formatListNum(p.format, n > 0 ? n : 1);
}

/** 中文数字（1~99 够用；超出范围退回阿拉伯数字）。 */
function cnListNum(n) {
  const d = ["零", "一", "二", "三", "四", "五", "六", "七", "八", "九"];
  if (!(n > 0)) return String(n);
  if (n < 10) return d[n];
  if (n === 10) return "十";
  if (n < 20) return "十" + d[n % 10];
  const t = Math.floor(n / 10), u = n % 10;
  return d[t] + "十" + (u ? d[u] : "");
}
/** 圈码 ①(1)~⑳(20) / ㉑(21)~㉟(35)，超过就退回阿拉伯数字（渲染上更稳）。 */
function circledListNum(n) {
  if (n >= 1 && n <= 20) return String.fromCharCode(0x2460 + n - 1);
  if (n >= 21 && n <= 35) return String.fromCharCode(0x3251 + n - 21);
  return n + ".";
}
/** 罗马数字 Ⅰ(1)~Ⅻ(12)，13~20 用「Ⅹ + 个位」组合，再高退回阿拉伯数字。 */
function romanListNum(n) {
  const ROMAN = ["\u2160", "\u2161", "\u2162", "\u2163", "\u2164", "\u2165", "\u2166", "\u2167", "\u2168", "\u2169", "\u216A", "\u216B"];
  if (n >= 1 && n <= 12) return ROMAN[n - 1];
  if (n >= 13 && n <= 20) return "\u2169" + (n > 10 ? ROMAN[n - 11] : "");
  if (n === 20) return "\u2169\u2169";
  if (n >= 21 && n <= 29) return "\u2169\u2169" + ROMAN[n - 21];
  return n + ".";
}
/** 某个序号格式的第 n 项文本。 */
function formatListNum(format, n) {
  if (format === "cn") return cnListNum(n) + "、";
  if (format === "circled") return circledListNum(n);
  if (format === "decimalParen") return n + ")";
  if (format === "paren") return "(" + n + ")";
  if (format === "roman") return romanListNum(n) + ".";
  return n + ".";
}

/* ---------- 块变体总索引：面板与检测脚本共用这一份，别再各处列清单 ----------
   三块 = 面板里的三段选择器（标题 / 引用 / 列表）。
   · 「一级标题 + 二级标题」已合并成**标题**（每套变体同时给 h1 / h2 两条样式，
     字号台阶仍按级别 —— 所以和浮板上的 H1-H4 不冲突：浮板定级别，这里定形状）；
     三级 / 四级仍是各自的小标样式，不参与块样式。
   · 「无序列表 + 有序列表」已合并成**列表**（前缀决定是符号还是序号）。 */
var BLOCK_TYPES = ["title", "quote", "list"];

function blockVariantInfo(block) {
  if (block === "title") return { def: TITLE_DEFAULT, table: TITLE_VARIANTS, label: "标题" };
  if (block === "quote") return { def: QUOTE_DEFAULT, table: QUOTE_VARIANTS, label: "引用" };
  if (block === "list") return { def: LIST_PREFIX_DEFAULT, table: LIST_PREFIXES, label: "列表" };
  return null;
}

/** 供面板渲染的变体清单（顺序即表里的书写顺序）。 */
function blockVariantList(block) {
  const info = blockVariantInfo(block);
  if (!info) return [];
  return Object.keys(info.table).map(function (k) {
    // group 是**面板专用**的分组名（如「图形前缀」）：面板把同一组的变体画在同一个标题下，
    // 用户看到的就是「一个可以全前缀的选项 + 一排符号」。引擎完全不读它。
    return { id: k, label: info.table[k].label, group: info.table[k].group || "" };
  });
}

/**
 * 这一套引用变体支不支持「巨大句号」（面板据此决定那颗开关显不显示）。
 * ⚠️ 目前只有「大字浅底」声明了 `punct: true`。开关**只在这一档上有意义** ——
 *    挂到别的引用变体上没有任何效果，所以面板上也就不显示（免得点了没反应）。
 */
function quotePunctSupported(variant) {
  const v = QUOTE_VARIANTS[variant];
  return !!(v && v.punct);
}

/** 变体名不认识时回退默认（面板与 applyBlockVariants 共用，避免两处判据漂移）。 */
function normalizeBlockVariant(block, id) {
  const info = blockVariantInfo(block);
  if (!info || !info.table[id]) return info ? info.def : id;
  return id;
}

/**
 * 面板缩略图专用：取某块某变体的**真实样式**（占位符已替换成当前主题色）。
 * 缩略图据此现推要画什么，所以以后在表里加变体，缩略图自动就是对的。
 * 「标题」返回的是 h1 那一档（缩略图只表达形状，不表达字号台阶）；h2 一并在 h2 键里给出。
 */
function blockVariantStylesOf(block, main, id, customText) {
  if (block === "title") {
    const t = titleStylesOf(main, id);
    return { style: t.h1, h2: t.h2, inner: t.inner, mark: t.mark, markStyle: t.markStyle,
             markText: titleMarkText(id, 1), grad: t.grad };
  }
  if (block === "quote") { const q = quoteStylesOf(main, id); return { style: q.quote, innerText: q.p, punct: q.punct }; }
  if (block === "list") {
    const l = listStylesOf(main, id, null, customText);
    return { style: l.ul, marker: l.marker, prefix: l.prefix, kind: l.kind,
             markerSize: l.markerSize, glyph: listMarkerTextOf(id, 1, customText) };
  }
  return {};
}

/**
 * 按所选的块变体重算一套 styles（纯函数，不改动传入对象）。
 *
 * 为什么是「重算 styles」而不是「多套主题」：颜色已 100% 由 accent 参数化，
 * 所以版式与颜色天然正交 —— 这里只换标题 / 引用 / 列表那几条，其余样式原样带过去，
 * 换主题色时变体自动跟着变色。
 *
 * 兼容旧字段名：合并前调用点传的是 { h1, h2, quote, list, ol }，
 * 现在是 { title, quote, list, custom } —— 两套都认（旧名只是取值的别名，不留第二份状态）。
 *
 * 幂等：同一 theme 反复调用结果一致。
 */
function applyBlockVariants(theme, vars, dark) {
  if (!theme || !theme.styles) return theme;
  vars = vars || {};
  const accent = normalizeHex(theme.accent || DEFAULT_ACCENT);
  const firstOf = function () {
    for (let i = 0; i < arguments.length; i++) if (arguments[i]) return arguments[i];
    return undefined;
  };
  // 取值顺序：**新名优先**，然后才是合并前的旧名 —— state / 快照 / 老主题对象里
  // 存的都是旧名（h1Variant / listVariant / olVariant），两套都得认。
  // 合并前后缀是两个命名空间（tri… vs decimal…），但 LIST_PREFIXES 把两边的键**都留着**，
  // 所以旧值一定能解析；迁移时「无序那个选择」优先于「有序那个选择」。
  const titleId = firstOf(vars.title, vars.titleVariant, vars.h1, vars.h1Variant,
                          vars.h2, vars.h2Variant, theme.titleVariant, theme.h1Variant);
  const quoteId = firstOf(vars.quote, vars.quoteVariant, theme.quoteVariant);
  const prefixId = firstOf(vars.list, vars.listPrefix, vars.listLegacy, vars.listVariant,
                           vars.ol, vars.olVariant, theme.listPrefix, theme.listVariant);
  const customText = (vars.custom !== undefined && vars.custom !== null) ? vars.custom
    : ((vars.listCustom !== undefined && vars.listCustom !== null) ? vars.listCustom : theme.listCustom);
  // 巨大句号（2026-10-10）：「这一套支持」**且**「面板开关开着」两件事同时成立才给样式。
  // 开关默认**开** —— 所以判据是 `!== false` 而不是 `=== true`（state 里没这个字段时
  // 是 undefined，那是「用户没表态」，按默认开处理）。
  // ⚠️ 它挂在 vars 上而不是 theme 上：punct 是**用户当前的选择**，不是主题自带的属性 ——
  //    从 theme 上读的话，老主题对象里那个 undefined 会让开关永远关着。
  const punctOn = (vars.punct === undefined || vars.punct === null) ? true : !!vars.punct;

  const ts = titleStylesOf(accent, normalizeBlockVariant("title", titleId), dark);
  /*
   * 二级标题**可以单独挑一套**（2026-10-27 用户点名的 A 方案）。
   * 取值来源：`vars.titleH2` / `vars.h2Variant`（面板把空串解释成「跟随一级」）。
   * ⚠️ 归一化后**等于一级**就当作「跟随」：老 state 里 h2Variant 一直等于 titleVariant，
   *    不这么判会让 theme.titleVariantH2 永远带上一个值，`h2 独立` 的判据全线走错。
   * ⚠️ 数据结构本来就分开了（TITLE_VARIANTS 每套都有自己的 h1 / h2 / span / mark），
   *    这里只是「两级各用哪一套」，不要另造一张只有 h2 的表。
   */
  const h2Raw = firstOf(vars.titleH2, vars.h2Title, vars.h2Variant, theme.titleVariantH2);
  const h2Norm = h2Raw ? normalizeBlockVariant("title", h2Raw) : "";
  const h2Id = (h2Norm && h2Norm !== ts.variant) ? h2Norm : "";
  const ts2 = h2Id ? titleStylesOf(accent, h2Id, dark) : ts;
  const qs = quoteStylesOf(accent, normalizeBlockVariant("quote", quoteId), dark);
  const ls = listStylesOf(accent, prefixId, null, customText, dark);

  const s = Object.assign({}, theme.styles);
  s.h1 = ts.h1;
  s.h1Inner = ts.inner;
  s.h2 = ts2.h2;
  // 二级标题自己的内层色块 span（色块刊头那类）：一级用 h1Inner、二级用 h2Inner。
  // 没有独立变体时两者相同（老行为）。
  s.h2Inner = ts2.inner;
  // 标题的前导图形（井号前缀）—— wrapHeadMarks 会给图形 span 挂这一条。
  // h1 / h2 各一条：两级可以选不同变体，图形与样式也就不同。
  s.headMark = ts.markStyle;
  s.headMarkH2 = ts2.markStyle;
  s.blockquote = qs.quote;
  s.pInBlockquote = qs.p;
  // 巨大句号：`null` = 不放大（同时也告诉 decoratePunct「把旧的拆掉」）。
  // ⚠️ 这一条**必须**每轮都写（哪怕是 null）：换到别的引用变体、或用户关掉开关时，
  //    上一次留在正文里的 `<span data-bluevibe-punct>` 得靠它被拆掉 —— 不写就是
  //    「关了开关但那一段还是巨大句号」。
  s.punct = (qs.punct && punctOn) ? PUNCT_BIG : null;
  if (s.punct) {
    // 行距收到 1.3（用户 2026-10-10 第二句：「行距再小一些……标准行高改成 1.3」）。
    // ⚠️ 必须写在上面 s.blockquote / s.pInBlockquote 的**后面** —— 那两行刚把变体产物
    //    整个换上去，先覆盖再换等于没写。
    // ⚠️ 注意它**不是**「这一档行高」的定义处：大字浅底的行高在变体表里写死 1.3
    //    （2026-10-10 晚用户拍板「恒为 1.3，与句号开关无关」），所以这一段与它同值、
    //    对当前这一档是幂等的。留着是为了「将来别的档也声明 punct」那条退路 ——
    //    那种档没开 fixedType、行高会被滑杆改写，靠这一段收回 1.3。
    s.blockquote = Object.assign({}, s.blockquote, { lineHeight: PUNCT_BIG.lineHeight });
    s.pInBlockquote = Object.assign({}, s.pInBlockquote, { lineHeight: PUNCT_BIG.lineHeight });
  }
  s.ul = ls.ul;
  s.ol = ls.ol;
  s.li = ls.li;
  s.liText = ls.liText;
  s.listMarker = ls.marker;
  s.olMarker = ls.olMarker;
  return Object.assign({}, theme, {
    styles: s,
    titleVariant: ts.variant,
    // 空串 = 二级跟随一级（默认）。非空 = 二级自己那套。
    titleVariantH2: h2Id ? ts2.variant : "",
    quoteVariant: qs.variant,
    // 「这一档的字号/行高是不是以定义为准」（2026-10-10，见 QUOTE_VARIANTS.plain）——
    // 挂在 theme 上往下传：converter.js 的 inheritTypography 与 blockbar.js 的 quoteCss
    // 都靠它决定要不要用面板滑杆覆盖引用块的字号 / 行高。
    quoteFixedType: qs.fixedType,
    listPrefix: ls.prefix,
    listCustom: ls.custom ? String(customText || "").slice(0, 2) : (theme.listCustom || ""),
  });
}

function makeDefaultStyles(accent, dark) {

  // 的键都会自动跟着变，不必逐条改。
  const pal = h1PaletteOf(normalizeHex(accent || DEFAULT_ACCENT), dark);
  // ⚠️⚠️ 这里要拿**两个**值，别只留一个（2026-09-30 淡色主题色）：
  //   · main      = 主题色**当字色 / 描边色**用（淡色已压深）→ a / 行内代码 / hr / h3 竖条 / th 底线
  //   · mainSolid = 主题色**铺底色**用（永远是原色）→ 传给变体表，由 resolveVariantTokens
  //                 按属性名分流（background 走原色、color/border 走压深版）
  // 传错会出两种事故：把 mainSolid 当字色 → 淡色标题看不见（这轮要修的）；
  // 把 main 当底色 → 色块底被压深，压在它上面的字反而糊（上一轮刚修好的）。
  const main = pal.main;
  const mainSolid = pal.mainSolid;
  // 淡色主题色？只用来决定「淡版令牌」怎么给（见 h1PaletteOf 里那段说明）。
  const pale = accentIsPale(mainSolid);
  // 「要不要翻」只算一次：pal 已经判过，这里跟着它走，避免同一个判定写两遍走偏。
  const isDark = !!dark && bodyBgNeedsLightText(dark);
  // 「浅底 / 发丝边」一律用**主题主色 + 透明度**，不再用「主色混白的不透明色」。
  // 两者在白底上完全等价（tint(main,.90) ≡ rgba(main,.10) 合成在白底上），
  // 但在微信深色模式下差别很大 —— 2026-09-24 用官方 mp-darkmode 算法实测：
  //   · 不透明浅底 #E6EEFF（感知亮度 238）→ 算法只把它**压到亮度 190**，
  //     得到 rgb(184,190,204) 的浅灰块，压在正文的 #191919 深底上非常突兀；
  //   · 半透明底算法**原样保留**（按「带 alpha 的低亮度背景」处理），
  //     由渲染时合成到页面底色上：白底 → #E6EEFF（与旧值一致），
  //     深色页 #191919 → rgb(23,31,48) 深色同色系，自然融入整篇；
  //     算法还会据此把块内文字提亮（实测 rgb(186,196,189)），对比度充足。
  // 同一手法早已用于「荧光标记」（见 converter.js 的 markFill / MARK_ALPHA），
  // 这里把它推广到引用块与代码块。alpha 与旧 tint 参数一一对应：

// 第一个（blue）即默认出厂色；增减颜色只改这里，面板会自动渲染，无需动 UI 代码。
var PRESET_ACCENTS = [
  { id: "blue",   name: "蓝", color: "#0052FF" },
  { id: "red",    name: "红", color: "#E5484D" },
  { id: "orange", name: "橙", color: "#F5731F" },
  { id: "green",  name: "绿", color: "#1FA971" },
  { id: "purple", name: "紫", color: "#7C5CFC" },
];

// ---------- 颜色工具 ----------
function hexToRgb(hex) {
  const m = /^#?([0-9a-fA-F]{6}|[0-9a-fA-F]{3})$/.exec(String(hex).trim());
  if (!m) return null;
  let h = m[1];
  if (h.length === 3) h = h.split("").map((c) => c + c).join("");
  const n = parseInt(h, 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}

function rgbToHex(r, g, b) {
  const p = (x) => Math.round(Math.max(0, Math.min(255, x))).toString(16).padStart(2, "0");
  return "#" + p(r) + p(g) + p(b);
}

function mixColor(hexA, hexB, t) {
  const a = hexToRgb(hexA);
  const b = hexToRgb(hexB);
  if (!a || !b) return hexA;
  return rgbToHex(a.r + (b.r - a.r) * t, a.g + (b.g - a.g) * t, a.b + (b.b - a.b) * t);
}

function tintColor(hex, t) { return mixColor(hex, "#ffffff", t); }

/**
 * #RRGGBB → rgba(r, g, b, a)。
 *
 * 用于底色 / 发丝边（见 makeDefaultStyles 顶部注释）：半透明色在浅色模式下
 * 合成结果与「混白的不透明色」一致，但在微信深色模式下会跟着页面底色一起变暗，
 * 不会出现「深色正文里嵌一块奶白补丁」。alpha 传 0~1 的小数。
 */
function toRgba(hex, alpha) {
  const c = hexToRgb(hex);
  if (!c) return hex;
  return "rgba(" + c.r + ", " + c.g + ", " + c.b + ", " + alpha + ")";
}

/**
 * #RRGGBB → #RRGGBBAA（8 位十六进制）。
 *
 * ⚠️ 要写进**正文**的那一整块产物（信息块 / 动效 / 轮播这些 inline style 拼出来的 HTML）
 * 需要 alpha 时**一律用它、不用 toRgba()**，三条纪律叠在一起只留这一个出口：
 *   ① 正文产物里出现 `rgb(`/`rgba(` 会被当脏值 —— 蓝调自己的残留扫描就是这个口径
 *      （tests/test-sem-blocks.js 的 RESIDUE），与「正文只写 hex」的既有写法一致；
 *   ② 8 位 hex 与 `rgba(r,g,b,a)` 的**计算值完全等价**（Chrome 在 computed style 里
 *      就把 `#0052FF00` 序列化成 `rgba(0, 82, 255, 0)`），html2canvas 读到的是同一个值；
 *   ③ 渐变的渐隐端**绝不能写关键字 `transparent`** —— 它的计算值是 `rgba(0,0,0,0)`，
 *      带黑成分，长图导出会渗灰斑（见 test-longpic-export-bg.js 第 [1] 节）。
 *      ⇒ 渐隐端写 `toHexA(c, 0)`，三条同时满足。
 */
function toHexA(hex, alpha) {
  const c = hexToRgb(hex);
  if (!c) return hex;
  const a = Math.max(0, Math.min(1, Number(alpha) || 0));
  const two = (n) => ("0" + Math.round(n).toString(16)).slice(-2).toUpperCase();
  return "#" + two(c.r) + two(c.g) + two(c.b) + two(a * 255);
}

function normalizeHex(hex) {
  const m = /^#?([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.exec(String(hex).trim());
  if (!m) return DEFAULT_ACCENT;
  let h = m[1];
  if (h.length === 3) h = h.split("").map((c) => c + c).join("");
  return "#" + h.toUpperCase();
}

// 自定义颜色只改变强调色，不再创建第二套布局或逐元素覆盖。
function makeCustomTheme(accentHex, dark) {
  const accent = normalizeHex(accentHex);
  return {
    id: "custom",
    name: "自定义颜色",
    desc: "只替换默认主题的强调色",
    accent,
    titleVariant: TITLE_DEFAULT,
    quoteVariant: QUOTE_DEFAULT,
    listPrefix: LIST_PREFIX_DEFAULT,
    listCustom: "",
    styles: makeDefaultStyles(accent, dark),
  };
}
